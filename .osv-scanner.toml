# --- Gitleaks build-only Go closure: affected packages are absent ---
# The build checks the real target-specific import graph and fails if OpenPGP
# enters it. The accompanying regression also requires this to remain the only
# non-fixture Go module, because OSV advisory ignores are repository-wide.
[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-11-25
reason = "Verified 2026-10-25: this no-fixed-version advisory affects only golang.org/x/crypto/openpgp and its subpackages. Neither Linux amd64 (431 packages) nor arm64 (428 packages) Gitleaks 8.30.1 import closure includes them under the actual CGO_ENABLED=0, gore2regex build configuration. docker/tools.Dockerfile rechecks that exact target-specific closure through scripts/utils/gitleaks/verify_imports.py before every install and fails on any affected package or missing command. tests/scripts/test_gitleaks_import_guard.py guards the exception, its expiry, and the absence of any other non-fixture Go module; new consumers require fresh applicability review. This is not a patched-module or whole-image clearance claim. Remove or reassess before expiry. Advisory: https://pkg.go.dev/vuln/GO-2026-5932; review: https://github.com/lgtm-hq/py-lintro/pull/2977"
