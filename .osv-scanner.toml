# Track removal: https://github.com/lgtm-hq/py-lintro/issues/2981
# Patched SDKs are 1.30.0 / 2.2.0; overriding Semgrep breaks its declared
# dependency contract. Lintro invokes only `semgrep scan`; its own MCP SDK
# is already >=2.2. Remove these exceptions when Semgrep updates its pin.

[[IgnoredVulns]]
id = "GHSA-5h93-6whr-6q8j"
ignoreUntil = 2026-11-15
reason = "Verified 2026-10-29: CVE-2026-116685 affects HTTP MCP client transports and OAuth requests following cross-origin redirects. The only vulnerable SDK is mcp==1.29.0 in isolated requirements-semgrep.txt; both pinned Semgrep 1.179.0 and latest 1.182.1 require that exact version. lintro/tools/semgrep/definition.py invokes semgrep scan, never an MCP client or the semgrep mcp server command. Those transports, tool calls and authentication paths are not used by this scan-only integration. Lintro's own MCP runtime is constrained and locked to >=2.2, guarded by test_mcp_exceptions_do_not_cover_a_vulnerable_lintro_runtime. This is an applicability exception for lintro scans, not clearance for running semgrep mcp or arbitrary MCP clients from the tools image. Remove or reassess before expiry; upstream: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml"

