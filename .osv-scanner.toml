# OSV-Scanner configuration for the lintro project.
#
# OSV Scanner runs in CI via lintro; this file is the project hook for
# suppressions. Review periodically and add [[IgnoredVulns]] entries only when
# necessary. Each entry is time-boxed via ignoreUntil so it cannot silently
# outlive its rationale.

# --- opentelemetry-api (PyPI, isolated Semgrep tool environment) ---
# Reverified 2026-11-06: pinned Semgrep 1.184.0, the latest published release
# (2026-11-05), still requires opentelemetry-api~=1.37.0, excluding the fixed
# release 1.45.1.
# Remove this temporary ignore when Semgrep permits the fixed telemetry stack.
# Track: https://github.com/lgtm-hq/py-lintro/issues/2972

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-12-06
reason = "Reverified 2026-11-06: opentelemetry-api@1.37.0 in requirements-semgrep.txt (CVE-2026-114603) remains constrained by pinned Semgrep 1.184.0, the latest published release (2026-11-05), which requires opentelemetry-api~=1.37.0 and excludes fixed 1.45.1. No compatible release fixes the isolated Semgrep lock; the separate application uv.lock is patched to opentelemetry-api@1.45.2 and guarded by test_semgrep_telemetry_ignore_cannot_hide_vulnerable_application_lock, because this OSV ignore is advisory-global (also paired with pip-audit's advisory ignore list). Operator-owned one-calendar-month temporary ignore under the unpatched-upstream policy, not an owner waiver or a claim of non-reachability. The flaw is quadratic CPU denial of service in TraceState.from_header on untrusted tracestate input; this dependency is in the isolated one-shot Semgrep CLI environment, not Lintro's application server. Recheck upstream constraints before expiry and remove once a compatible Semgrep release admits the fixed telemetry stack. Track: https://github.com/lgtm-hq/py-lintro/issues/2972"

# GHSA-mf5v-w3w3-f6cg (CVE-2026-126360, published 2026-11-13) is the same
# blocker: fixed in opentelemetry-api 1.45.2, but pinned Semgrep 1.184.0 and
# Semgrep 1.185.0, the latest published release (2026-11-10), both still
# require opentelemetry-api~=1.37.0 (reverified 2026-11-13).

[[IgnoredVulns]]
id = "GHSA-mf5v-w3w3-f6cg"
ignoreUntil = 2026-12-13
reason = "Reverified 2026-11-13: opentelemetry-api@1.37.0 in requirements-semgrep.txt (CVE-2026-126360) remains constrained by pinned Semgrep 1.184.0 and by Semgrep 1.185.0, the latest published release (2026-11-10), which both require opentelemetry-api~=1.37.0 and exclude fixed 1.45.2. No compatible release fixes the isolated Semgrep lock; the separate application uv.lock is patched to opentelemetry-api@1.45.2 and guarded by test_semgrep_telemetry_ignore_cannot_hide_vulnerable_application_lock, because this OSV ignore is advisory-global (also paired with pip-audit's advisory ignore list). Operator-owned one-calendar-month temporary ignore under the unpatched-upstream policy, not an owner waiver or a claim of non-reachability. The flaw is quadratic-time regex backtracking (ReDoS, CPU denial of service) in TraceContextTextMapPropagator.extract() on an untrusted traceparent value carrying long whitespace and an embedded newline; this dependency is in the isolated one-shot Semgrep CLI environment, not Lintro's application server. Recheck upstream constraints before expiry and remove once a compatible Semgrep release admits the fixed telemetry stack. Track: https://github.com/lgtm-hq/py-lintro/issues/2972"

# --- mcp (PyPI, transitive via semgrep) ---
# GHSA-84m7-p3x7-pcfv (published 2026-10-15) is fixed in mcp 1.30.0, but the
# pinned semgrep 1.184.0, the latest published release, still requires
# mcp==1.29.0 exactly (reverified 2026-11-06), so the isolated semgrep lock
# cannot move. Drop this entry once semgrep's pin does.
# Track: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-12-06
reason = "Reverified 2026-11-06: mcp@1.29.0 in requirements-semgrep.txt (alias CVE-2026-59951, also ignored by pip-audit through [tool.lintro.pip_audit] ignore_vulns): pinned Semgrep 1.184.0, the latest published release (2026-11-05), requires mcp==1.29.0 exactly, so no resolvable upgrade exists. The flaw is unbounded session accumulation in mcp's StreamableHTTP server transport, reached only by a long-running MCP server. semgrep bundles mcp for its own `semgrep mcp` server command; lintro runs semgrep as a one-shot CLI linter on local files and never starts that server, in CI, locally or in the tools image, so the vulnerable transport is never opened. Not reachable. Upstream pin: semgrep cli/pyproject.toml"

# --- Additional MCP advisories: isolated Semgrep scan-only use ---
# Reverified 2026-11-06: pinned Semgrep 1.184.0, the latest published release,
# still requires mcp==1.29.0.
# Track removal: https://github.com/lgtm-hq/py-lintro/issues/2981
# Patched SDKs are 1.30.0 / 2.2.0; overriding Semgrep breaks its declared
# dependency contract. Lintro invokes only `semgrep scan`; its own MCP SDK
# is already >=2.2 (locked at 2.3.0). Remove these exceptions when Semgrep
# updates its pin.

[[IgnoredVulns]]
id = "GHSA-5h93-6whr-6q8j"
ignoreUntil = 2026-12-06
reason = "Reverified 2026-11-06: CVE-2026-116685 affects HTTP MCP client transports and OAuth requests following cross-origin redirects. The only vulnerable SDK is mcp==1.29.0 in isolated requirements-semgrep.txt; pinned Semgrep 1.184.0, the latest published release (2026-11-05), requires that exact version. lintro/tools/semgrep/definition.py invokes semgrep scan, never an MCP client or the semgrep mcp server command. Those transports, tool calls and authentication paths are not used by this scan-only integration. Lintro's own MCP runtime is constrained and locked to >=2.2, guarded by test_mcp_exceptions_do_not_cover_a_vulnerable_lintro_runtime. This is an applicability exception for lintro scans, not clearance for running semgrep mcp or arbitrary MCP clients from the tools image. Remove or reassess before expiry; upstream: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml"

