# OSV-Scanner configuration for the lintro project.
#
# OSV Scanner runs in CI via lintro; this file is the project hook for
# suppressions. Review periodically and add [[IgnoredVulns]] entries only when
# necessary. Each entry is time-boxed via ignoreUntil so it cannot silently
# outlive its rationale.

# --- markdown-it (npm, transitive via markdownlint-cli2) ---
# GHSA-r7fv-28h4-cvq7, GHSA-vfgh-jcmw-g37q and GHSA-gfr2-rv44-r23c (all
# published 2026-10-20) are fixed in markdown-it 15.0.2 / 15.0.3, but
# markdownlint-cli2 0.23.3 (the latest release, and the version the tools
# manifest pins) depends on markdown-it==15.0.1 exactly, so the lock cannot
# move. Drop these entries once a markdownlint-cli2 release moves its pin.
# Track: https://github.com/DavidAnson/markdownlint-cli2/blob/main/package.json

[[IgnoredVulns]]
id = "GHSA-r7fv-28h4-cvq7"
ignoreUntil = 2026-11-03
reason = "markdown-it@15.0.1 in the root bun.lock: markdownlint-cli2 0.23.3 (latest release, pinned by the tools manifest) requires markdown-it==15.0.1 exactly, so no resolvable upgrade exists. The flaw is quadratic-time parsing of unmatched closing quotes in the smartquotes rule. markdownlint-cli2 parses repository Markdown, including files a pull request adds, in a one-shot lint process locally or on a CI runner; it does not serve or parse network input. Worst case is a slow or stuck lint job on a crafted file (DoS of that job only, no confidentiality or integrity impact). Upstream pin: markdownlint-cli2 package.json"

[[IgnoredVulns]]
id = "GHSA-vfgh-jcmw-g37q"
ignoreUntil = 2026-11-03
reason = "markdown-it@15.0.1 in the root bun.lock: markdownlint-cli2 0.23.3 (latest release, pinned by the tools manifest) requires markdown-it==15.0.1 exactly, so no resolvable upgrade exists. The flaw is quadratic-time inline HTML parsing. markdownlint-cli2 parses repository Markdown, including files a pull request adds, in a one-shot lint process locally or on a CI runner; it does not serve or parse network input. Worst case is a slow or stuck lint job on a crafted file (DoS of that job only, no confidentiality or integrity impact). Upstream pin: markdownlint-cli2 package.json"

[[IgnoredVulns]]
id = "GHSA-gfr2-rv44-r23c"
ignoreUntil = 2026-11-03
reason = "markdown-it@15.0.1 in the root bun.lock: markdownlint-cli2 0.23.3 (latest release, pinned by the tools manifest) requires markdown-it==15.0.1 exactly, so no resolvable upgrade exists. The flaw is quadratic-time rendering of a multi-line link reference definition. markdownlint-cli2 parses repository Markdown, including files a pull request adds, in a one-shot lint process locally or on a CI runner; it does not serve or parse network input. Worst case is a slow or stuck lint job on a crafted file (DoS of that job only, no confidentiality or integrity impact). Upstream pin: markdownlint-cli2 package.json"

# --- opentelemetry-api (PyPI, isolated Semgrep tool environment) ---
# Reverified 2026-10-23: current Semgrep 1.179.0 and latest 1.182.1 both
# require opentelemetry-api~=1.37.0, excluding the fixed release 1.45.1.
# Remove this temporary ignore when Semgrep permits the fixed telemetry stack.
# Track: https://github.com/lgtm-hq/py-lintro/issues/2972

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-11-23
reason = "Reverified 2026-10-23: opentelemetry-api@1.37.0 in requirements-semgrep.txt (CVE-2026-114603) remains constrained by current Semgrep 1.179.0 and latest published Semgrep 1.182.1, which both require opentelemetry-api~=1.37.0 and exclude fixed 1.45.1. No compatible release fixes the isolated Semgrep lock; the separate application uv.lock is patched to opentelemetry-api@1.45.1 and guarded by test_semgrep_telemetry_ignore_cannot_hide_vulnerable_application_lock, because this OSV ignore is advisory-global (also paired with pip-audit's advisory ignore list). Operator-owned one-calendar-month temporary ignore under the unpatched-upstream policy, not an owner waiver or a claim of non-reachability. The flaw is quadratic CPU denial of service in TraceState.from_header on untrusted tracestate input; this dependency is in the isolated one-shot Semgrep CLI environment, not Lintro's application server. Recheck upstream constraints before expiry and remove once a compatible Semgrep release admits the fixed telemetry stack. Track: https://github.com/lgtm-hq/py-lintro/issues/2972"

# --- mcp (PyPI, transitive via semgrep) ---
# GHSA-84m7-p3x7-pcfv (published 2026-10-15) is fixed in mcp 1.30.0, but the
# pinned semgrep and every available upgrade through 1.182.1 require
# mcp==1.29.0 exactly, so the isolated semgrep lock cannot move. Drop this
# entry once semgrep's pin does.
# Track: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-11-15
reason = "mcp@1.29.0 in requirements-semgrep.txt (alias CVE-2026-59951, also ignored by pip-audit through [tool.lintro.pip_audit] ignore_vulns): the pinned semgrep release and every available upgrade through 1.182.1 require mcp==1.29.0 exactly, so no resolvable upgrade exists. The flaw is unbounded session accumulation in mcp's StreamableHTTP server transport, reached only by a long-running MCP server. semgrep bundles mcp for its own `semgrep mcp` server command; lintro runs semgrep as a one-shot CLI linter on local files and never starts that server, in CI, locally or in the tools image, so the vulnerable transport is never opened. Not reachable. Upstream pin: semgrep cli/pyproject.toml"

# --- Additional MCP advisories: isolated Semgrep scan-only use ---
