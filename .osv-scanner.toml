# --- opentelemetry-api (PyPI, isolated Semgrep tool environment) ---
# Reverified 2026-10-23: current Semgrep 1.179.0 and latest 1.182.1 both
# require opentelemetry-api~=1.37.0, excluding the fixed release 1.45.1.
# Remove this temporary ignore when Semgrep permits the fixed telemetry stack.
# Track: https://github.com/lgtm-hq/py-lintro/issues/2972

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-11-23
reason = "Reverified 2026-10-23: opentelemetry-api@1.37.0 in requirements-semgrep.txt (CVE-2026-114603) remains constrained by current Semgrep 1.179.0 and latest published Semgrep 1.182.1, which both require opentelemetry-api~=1.37.0 and exclude fixed 1.45.1. No compatible release fixes the isolated Semgrep lock; the separate application uv.lock is patched to opentelemetry-api@1.45.1 and guarded by test_semgrep_telemetry_ignore_cannot_hide_vulnerable_application_lock, because this OSV ignore is advisory-global (also paired with pip-audit's advisory ignore list). Operator-owned one-calendar-month temporary ignore under the unpatched-upstream policy, not an owner waiver or a claim of non-reachability. The flaw is quadratic CPU denial of service in TraceState.from_header on untrusted tracestate input; this dependency is in the isolated one-shot Semgrep CLI environment, not Lintro's application server. Recheck upstream constraints before expiry and remove once a compatible Semgrep release admits the fixed telemetry stack. Track: https://github.com/lgtm-hq/py-lintro/issues/2972"

# --- mcp (PyPI, transitive via semgrep) ---
# GHSA-84m7-p3x7-pcfv (published 2026-10-15) is fixed in mcp 1.30.0, but the
# pinned semgrep and every available upgrade through 1.181.0 require
# mcp==1.29.0 exactly, so the isolated semgrep lock cannot move. Drop this
# entry once semgrep's pin does.
# Track: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-11-15
reason = "mcp@1.29.0 in requirements-semgrep.txt (alias CVE-2026-59951, also ignored by pip-audit through [tool.lintro.pip_audit] ignore_vulns): the pinned semgrep release and every available upgrade through 1.181.0 require mcp==1.29.0 exactly, so no resolvable upgrade exists. The flaw is unbounded session accumulation in mcp's StreamableHTTP server transport, reached only by a long-running MCP server. semgrep bundles mcp for its own `semgrep mcp` server command; lintro runs semgrep as a one-shot CLI linter on local files and never starts that server, in CI, locally or in the tools image, so the vulnerable transport is never opened. Not reachable. Upstream pin: semgrep cli/pyproject.toml"
