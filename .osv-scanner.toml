# OSV-Scanner configuration for the lintro project.
#
# OSV Scanner runs in CI via lintro; this file is the project hook for
# suppressions. Review periodically and add [[IgnoredVulns]] entries only when
# necessary. Each entry is time-boxed via ignoreUntil so it cannot silently
# outlive its rationale.

# --- http-cache-semantics (npm, transitive via astro) ---
# No patched release: GHSA-ch52-4w7c-c8xp covers <= 4.2.0 (latest) and
# first_patched_version is null. Track: https://github.com/kornelski/http-cache-semantics/issues/56

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-02
reason = "http-cache-semantics@4.2.0: no patched release (advisory first_patched_version = none; 4.2.0 is latest, only 4.2.0-beta prereleases exist). Transitive via astro (root bun.lock dev tooling and apps/site/bun.lock), build-time only: astro imports it solely in dist/assets/build/remote.js to cache remote images during `astro build`. The docs site is static output with no SSR, no shared HTTP cache and no remote image config, so the cross-user max-stale disclosure has no reachable multi-user cache. Not exploitable. Upstream: https://github.com/kornelski/http-cache-semantics/issues/56"

# --- braces (npm, transitive via micromatch) ---
# No patched release: GHSA-vfj7-8cjw-p6xm covers <= 3.0.3 (latest) and
# first_patched_version is null. Track: https://github.com/micromatch/braces/issues/70

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-02
reason = "braces@3.0.3: no patched release (advisory first_patched_version = none; 3.0.3 is latest). Dev/lint tooling only (root package.json devDependencies, also bundled in the lintro tools image): reached via micromatch/fast-glob from markdownlint-cli2, stylelint and spectral-cli, plus vite/rollup at build time. Input is glob patterns from the operator's own CLI args and lint configs, never network or end-user input; worst case is a stack-exhaustion crash of a single local lint/build process (DoS only, no confidentiality or integrity impact). Upstream: https://github.com/micromatch/braces/issues/70"

# --- markdown-it (npm, transitive via markdownlint-cli2) ---
# GHSA-r7fv-28h4-cvq7 and GHSA-vfgh-jcmw-g37q (published 2026-10-20) are fixed
# in markdown-it 15.0.2 / 15.0.3, but markdownlint-cli2 0.23.3 (the latest
# release, and the version the tools manifest pins) depends on
# markdown-it==15.0.1 exactly, so the lock cannot move. Drop both entries once
# a markdownlint-cli2 release moves its pin.
# Track: https://github.com/DavidAnson/markdownlint-cli2/blob/main/package.json

[[IgnoredVulns]]
id = "GHSA-r7fv-28h4-cvq7"
ignoreUntil = 2026-11-03
reason = "markdown-it@15.0.1 in the root bun.lock: markdownlint-cli2 0.23.3 (latest release, pinned by the tools manifest) requires markdown-it==15.0.1 exactly, so no resolvable upgrade exists. The flaw is quadratic-time parsing of unmatched closing quotes in the smartquotes rule. markdownlint-cli2 only parses the operator's own repository Markdown in a one-shot local lint process; it never parses network or end-user input. Worst case is a slow or stuck lint run on a crafted file in the repository being linted (DoS only, no confidentiality or integrity impact). Upstream pin: markdownlint-cli2 package.json"

[[IgnoredVulns]]
id = "GHSA-vfgh-jcmw-g37q"
ignoreUntil = 2026-11-03
reason = "markdown-it@15.0.1 in the root bun.lock: markdownlint-cli2 0.23.3 (latest release, pinned by the tools manifest) requires markdown-it==15.0.1 exactly, so no resolvable upgrade exists. The flaw is quadratic-time inline HTML parsing. markdownlint-cli2 only parses the operator's own repository Markdown in a one-shot local lint process; it never parses network or end-user input. Worst case is a slow or stuck lint run on a crafted file in the repository being linted (DoS only, no confidentiality or integrity impact). Upstream pin: markdownlint-cli2 package.json"

# --- mcp (PyPI, transitive via semgrep) ---
# GHSA-84m7-p3x7-pcfv (published 2026-10-15) is fixed in mcp 1.30.0, but the
# pinned semgrep and every available upgrade through 1.181.0 require
# mcp==1.29.0 exactly, so the isolated semgrep lock cannot move. Drop this
# entry once semgrep's pin does.
# Track: https://github.com/semgrep/semgrep/blob/develop/cli/pyproject.toml

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-11-15
reason = "mcp@1.29.0 in requirements-semgrep.txt (alias CVE-2026-59951, also ignored by pip-audit through [tool.lintro.pip_audit] ignore_vulns): the pinned semgrep release and every available upgrade through 1.181.0 require mcp==1.29.0 exactly, so no resolvable upgrade exists. The flaw is unbounded session accumulation in mcp's StreamableHTTP server transport, reached only by a long-running MCP server. semgrep bundles mcp for its own `semgrep mcp` server command; lintro runs semgrep as a one-shot CLI linter on local files and never starts that server, in CI, locally or in the tools image, so the vulnerable transport is never opened. Not reachable. Upstream pin: semgrep cli/pyproject.toml"
