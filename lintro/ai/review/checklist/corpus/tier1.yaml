# Tier 1 built-in review checklist corpus.
# Always-included items (IDs 1-15). Empty domains and languages.
# One row per ChecklistItem; loaded by lintro.ai.review.checklist.loader.
# Valid category/domains/languages values are the Python enums the loader
# validates against (#2720: no generated schema; core categories only).
- id: 1
  tier: 1
  category: integration
  domains: []
  languages: []
  question: 'Does any early return skip independent work that could proceed when an optional step fails?'
- id: 4
  tier: 1
  category: silent-failure
  domains: []
  languages: []
  question: 'Does any error path exit or return success when callers expect failure?'
- id: 7
  tier: 1
  category: logic-bug
  domains: []
  languages: []
  question: 'Does the diff implement behavior that already exists elsewhere (duplicate logic)?'
- id: 8
  tier: 1
  category: logic-bug
  domains: []
  languages: []
  question: 'Does the diff actually do what the PR description claims?'
- id: 9
  tier: 1
  category: security
  domains: []
  languages: []
  question: 'Does any unknown/unparseable enum or status default to permissive access (fail-open)?'
- id: 14
  tier: 1
  category: integration
  domains: []
  languages: []
  question: 'Does the diff implement behavior contradicting explicitly deferred/out-of-scope items in the PR summary?'
- id: 15
  tier: 1
  category: silent-failure
  domains: []
  languages: []
  question: 'Does API/client code use type casts on responses without runtime validation?'
