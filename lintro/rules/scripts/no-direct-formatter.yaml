# Literal command heuristics, not shell or JavaScript data-flow analysis.
# Keep formatter coverage aligned with builtin FORMAT claims (guarded by tests).
---
rules:
  - id: lintro.scripts.no-direct-formatter.native-command
    languages: [generic]
    severity: WARNING
    message: >-
      Delegate formatting to lintro fmt (or uv run lintro fmt) so Lintro owns
      formatter selection and configuration instead of invoking a native formatter.
    metadata:
      lintro_rule_pack: scripts/no-direct-formatter
      # Discover every file: paths.include, not file extensions, picks targets.
      lintro_discover_all_files: true
      # Executable matcher examples; keys must equal builtin FORMAT claimants.
      lintro_formatters:
        black: black generated.py
        buf: buf format --write generated.proto
        oxfmt: bunx oxfmt generated.mjs
        prettier: prettier --write generated.css
        ruff: ruff format generated.py
        rustfmt: rustfmt generated.rs
        shfmt: shfmt -w generated.sh
        sqlfluff: sqlfluff format generated.sql
        taplo: taplo fmt Cargo.toml
    paths:
      include:
        - '**/scripts/**'
        - '**/*.mjs'
        - '**/Makefile'
    pattern-regex: |-
      (?mx)
      ^(?![\t ]*(?:\#|//))[\t ]*
      (?:
        # Make recipe prefixes in any order: @black, -@black, @+black.
        [@+-]*
        | [^\r\n\#"'`]*?(?:&&|\|\||;)[\t ]*
        | [^\r\n]*?\b(?:exec|execSync|execFile|execFileSync|spawn|spawnSync)
          [\t ]*\([\t ]*(?P<command_quote>["'`])
          # A chain inside the command string: 'cd web && prettier -w .'.
          # Inner quoted segments are skipped whole, so "hi; black" is text.
          (?:
            (?:
              [^\r\n"'`]
              | (?!(?P=command_quote))(?:"[^"\r\n]*"|'[^'\r\n]*'|`[^`\r\n]*`)
            )*?
            (?:&&|\|\||;)[\t ]*
          )?
      )
      (?:
        (?:bunx|npx)(?:[\t ]+--yes)?[\t ]+
        | (?P<uv_tool>uvx[\t ]+|uv[\t ]+tool[\t ]+run[\t ]+)
        | uv[\t ]+run[\t ]+
        | python(?:3(?:\.[0-9]+)?)?[\t ]+-m[\t ]+
      )?
      (?:
        # Optional runner version pins such as prettier@3 or black@24.1.0;
        # uvx and uv tool run also take black==24.1 (not bare requirement lines).
        # No comma boundary here: a JS line "  black," is object shorthand.
        (?:black|oxfmt|rustfmt|shfmt)
          (?:@(?:[0-9][\w.+-]*|latest|next)|(?(uv_tool)==[0-9][\w.+-]*|(?!)))?
          (?=[\t "'`);&|<>]|$)
        | prettier(?:@(?:[0-9][\w.+-]*|latest|next))?(?=[\t "'`),;&|<>]|$)
          # Stay in this shell command, JS command string, or its argv array.
          (?=
            (?(command_quote)
              (?:
                (?:(?!(?P=command_quote))[^\r\n\#;&|])*?
                | (?P=command_quote)[\t ]*,[\t ]*\[[^\r\n\#;\]&|]*?
              )
              | [^\r\n\#;&|]*?
            )
            (?<![\w-])(?:--write|-w)(?=[\t "'`,\]<>;&|)]|$)
          )
        | (?:(?:ruff|buf)
              (?:@(?:[0-9][\w.+-]*|latest|next)|(?(uv_tool)==[0-9][\w.+-]*|(?!)))?
              [\t ]+format
            | cargo[\t ]+fmt
            | taplo
              (?:@(?:[0-9][\w.+-]*|latest|next)|(?(uv_tool)==[0-9][\w.+-]*|(?!)))?
              [\t ]+(?:fmt|format)
            | sqlfluff
              (?:@(?:[0-9][\w.+-]*|latest|next)|(?(uv_tool)==[0-9][\w.+-]*|(?!)))?
              [\t ]+(?:format|fix))
          (?=[\t "'`),;&|<>]|$)
      )
