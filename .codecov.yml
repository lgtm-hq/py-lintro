---
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: 70...100
  status:
    project:
      default:
        # Kept in lockstep with [tool.coverage.report] fail_under in
        # pyproject.toml, so the same drop fails locally and on Codecov.
        target: 81%
        threshold: 0.5%
        informational: false
    patch:
      default:
        # Diff coverage of the changed lines, a different metric from the
        # project total, so it is not tied to fail_under.
        target: 80%
        threshold: 0.5%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: reach,diff,flags,files,footer
  behavior: default
  require_changes: false
