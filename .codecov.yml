---
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: 70...100
  status:
    project:
      default:
        target: 80%
        threshold: 0.5%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 0.5%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: reach,diff,flags,files,footer
  behavior: default
  require_changes: false
