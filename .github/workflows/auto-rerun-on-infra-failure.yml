---
name: Auto Rerun on Infra Failure

# When a listed workflow fails and its failed-job logs match a known
# GitHub-side outage signature ("Failed to resolve action download info",
# runner shutdown signals, harden-runner allowed-domain resolution errors),
# re-run only the failed jobs — once (run-attempt guard upstream). This repo
# saw a ghcr.io login timeout (run 29325278849) and a runner shutdown during
# #1370's CI, both manually rerun. See #1374 and Rustume's equivalent (#474).
#
# workflow_run triggers only run from the definition on the default branch,
# so changes here take effect after merging to main.

'on':
  workflow_run:
    workflows:
      - Build - Docker Image & Registry
      - Build - Lintro Tools Image
      - CI - Docker
      - CI - Tests
      - Deploy - GitHub Pages
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  rerun:
    # Same-repo guard: the branches filter matches the triggering run's head
    # branch name, so a fork branch named "main" would otherwise reach the
    # actions:write rerun with the upstream token.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88 # v0.59.2
    permissions:
      actions: write
      contents: read
    with:
      tooling-ref: 'ee8484ca71db3a2c2c33da6128bbf2330fcd7c88' # v0.59.2
      # run id/attempt are numbers in the event payload; format() passes them
      # as the strings the reusable workflow inputs expect.
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      egress-policy: block
      egress-preset: github-minimal
      # Extra transient-infra signatures, appended to lgtm-ci's built-in
      # defaults and matched with grep -qF. Keep every line a FIXED string
      # (no regex, no anchors) and narrow enough that it cannot absorb a
      # real failure that deserves a human. The embedded double quotes in
      # the Docker Hub line are part of the log text and this literal block
      # scalar must preserve them verbatim.
      #
      # 1-3. Cosign ambient-OIDC token-fetch flake (#1567, #1689), kept in
      #      parity with oidc_flake_markers in
      #      scripts/ci/cosign-sign-images.sh so a signing job that exhausts
      #      the in-step retry (#1646) is auto-rerun instead of needing a
      #      manual backfill.
      # 4.   Docker Hub timeout while Setup Docker Buildx pulls the buildkit
      #      image. registry-1.docker.io:443 is already allowed, so this is
      #      Docker Hub slowness, not a harden-runner block. Seen in the
      #      v0.91.42 release run (30148763859, Merge Manifests job
      #      89692290242), which no default signature matched. Scoped to the
      #      registry URL on purpose: a bare "context deadline exceeded"
      #      would swallow genuine timeouts elsewhere.
      signatures: |-
        fetching ambient OIDC credentials
        retrieving ID token
        reading ID token
        Get "https://registry-1.docker.io/v2/": context deadline exceeded
