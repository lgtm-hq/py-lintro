---
name: Auto Rerun on Infra Failure

# When a listed workflow fails and its failed-job logs match a known
# GitHub-side outage signature ("Failed to resolve action download info",
# runner shutdown signals, harden-runner allowed-domain resolution errors),
# re-run only the failed jobs — up to three times (run-attempt guard upstream).
# This repo saw a ghcr.io login timeout (run 29325278849) and a runner shutdown during
# #1370's CI, both manually rerun. Tag publishes also flake on setup-uv
# manifest timeouts and runner loss (#1487). See #1374 and Rustume's
# equivalent (#474).
#
# workflow_run triggers only run from the definition on the default branch,
# so changes here take effect after merging to main.
#
# No branches: filter — tag-triggered publish runs set head_branch to the
# tag name (e.g. v0.88.1), so branches: [main] would miss them, and
# workflow_run has no separate tags: filter. Dropping it also makes PR-branch
# runs of the watched CI workflows eligible, which is intended: the reusable
# workflow only reruns on a matched infra signature and up to three times per run.
# Fork abuse is blocked by the same-repo guard on the job below
# (head_repository.full_name), which is now the only such guard.
#
# Homebrew Tap / npm are reusable workflows invoked with `uses:` from the
# PyPI tag pipeline, so during a release they are jobs inside the
# "Publish - PyPI Production" run and emit no workflow_run event of their
# own — rerunning that run's failed jobs covers them. They are listed here
# for their standalone workflow_dispatch (backfill) runs.

# Which workflows belong here (#1775): every workflow whose failure marks a
# commit on main red, because that is the red a human has to chase. A pure
# infra kill on any of them is noise, and noise on main trains people to stop
# reading it. Publish workflows are listed for the release-pipeline reasons
# described above rather than for this criterion.
#
# Deliberately NOT listed:
#   - Release - Auto Tag / Release - Version PR. Both mutate repository state
#     (tags, release PRs) rather than just reporting on it, so an automatic
#     rerun after a partial run could double-tag or resurrect a version PR.
#     A human decides these.
#   - Security - Dependency Vulnerability Gate, and the other PR-scoped
#     helpers (labeler, auto-assign, PR title, action pinning, dependency
#     review). They run on pull_request only and never redden main; the next
#     push re-runs them anyway.
#   - Cron-only reporting (Scorecard, vuln-suppression, version-skew audit,
#     nightly dogfood). No main commit carries their status, and the next
#     scheduled run supersedes a flaked one.
'on':
  workflow_run:
    workflows:
      - AI - CLI Contract Tests
      - Build - Docker Image & Registry
      - Build - Lintro AI Tools Image
      - Build - Lintro Tools Image
      - Promote - Lintro Tools Candidate
      - CI - Docker
      - CI - Tests
      - Deploy - GitHub Pages
      - Publish - Homebrew Tap
      - Publish - npm
      - Publish - PyPI Production
      - Quality - Documentation Site
      - Reporting - Scheduled Lintro Analysis
      - Security - CodeQL Code Scanning
      - Security - SBOM Generation
      - Testing - Built Package Validation
    types: [completed]

permissions: {}

jobs:
  rerun:
    # Same-repo guard: without a branches filter, a fork PR workflow that
    # shares a watched name would otherwise reach the actions:write rerun
    # with the upstream token. Restrict to runs whose head repo is this one.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      actions: write
      # read: check-run annotations of failed jobs, where GitHub reports a
      # runner-acquisition failure ("failed to be acquired") that leaves no
      # log to match (lgtm-ci 0.74.2, #2553).
      checks: read
      contents: read
    with:
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      # Publish runs are never re-run automatically: their jobs have
      # irreversible steps (PyPI upload, npm publish, GHCR retag) and a
      # --failed rerun cannot exclude them. v0.160.3rc1's failed publish run
      # was re-run past the npm gate this way (#2633). Both files are listed
      # because publish-npm.yml also runs standalone (backfill dispatch).
      protected-workflows: 'publish-pypi-on-tag.yml,publish-npm.yml'
      # run id/attempt are numbers in the event payload; format() passes them
      # as the strings the reusable workflow inputs expect.
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      max-reruns: '3'
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      # github-results (lgtm-ci v0.76+ default): github-minimal plus GitHub's
      # results blob storage. Since v0.76 an explicit preset is enforced, and
      # github-minimal blocks the job-log downloads the rerun matcher reads.
      egress-preset: github-results
      # Extra transient-infra signatures, appended to lgtm-ci's built-in
      # defaults and matched with grep -qF. Keep every line a FIXED string
      # (no regex, no anchors) and narrow enough that it cannot absorb a
      # real failure that deserves a human. The embedded double quotes in
      # the Docker Hub line are part of the log text and this literal block
      # scalar must preserve them verbatim.
      #
      # 1-3. Cosign ambient-OIDC token-fetch flake (#1567, #1689), kept in
      #      parity with oidc_flake_markers in
      #      scripts/ci/cosign-sign-images.sh so a signing job that exhausts
      #      the in-step retry (#1646) is auto-rerun instead of needing a
      #      manual backfill.
      # 4.   Docker Hub timeout while Setup Docker Buildx pulls the buildkit
      #      image. registry-1.docker.io:443 is already allowed, so this is
      #      Docker Hub slowness, not a harden-runner block. Seen in the
      #      v0.91.42 release run (30148763859, Merge Manifests job
      #      89692290242), which no default signature matched. Scoped to the
      #      registry URL on purpose: a bare "context deadline exceeded"
      #      would swallow genuine timeouts elsewhere.
      # 5.   Fail-closed code-quality gate (#2296). The dogfooding lint job
      #      losing its runner already matches the built-in shutdown
      #      signatures, but since #2296 the 🚦 Code Quality Gate job goes red
      #      on its own too, and a run whose only failed job is the gate would
      #      otherwise match nothing. Matched as a fixed-string substring of
      #      the line scripts/ci/assert-required-check.sh prints (which also
      #      carries a ::error:: prefix and a (result=...) suffix), and never
      #      printed for a genuine lint verdict, which reports status=failed.
      # 6.   Hosted runner out of disk while buildkit writes the tools image
      #      layers (CI - Docker run 41776692501, 2026-11-04: checkov's numpy
      #      hit "no space left on device" on an AWS-provisioned runner; the
      #      identical rerun on a normal runner passed). ResourceExhausted is
      #      buildkit's ENOSPC wrapper; scoped to its snapshot path so a disk
      #      failure anywhere else still needs a human, and the max-reruns
      #      budget bounds the cost if the image ever outgrows every runner.
      signatures: |-
        fetching ambient OIDC credentials
        retrieving ID token
        reading ID token
        Get "https://registry-1.docker.io/v2/": context deadline exceeded
        No lint verdict (runner loss); auto-rerun will retry
        ResourceExhausted: failed to compute cache key: write /var/lib/buildkit/

  # Second half of the net: a successful retry leaves the All Checks Gate on
  # the same commit red, because the gate already judged the failed first
  # attempt and nothing re-evaluates it. On 2026-11-04 that kept main red for
  # an hour after CI - Docker attempt 2 passed (gate run 41776692371).
  #
  # Fires on any later attempt of a watched workflow that concluded success
  # (automatic or manual rerun) and re-runs each failed gate on that head SHA
  # that finished before the retry did. This is not a retry budget for the
  # gate: it only re-runs after a producer turned green, and the re-run gate
  # re-judges every check, so a producer that is still red keeps it red.
  refresh-gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt > 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Serialize per commit so two producers recovering together cannot both
    # re-run the same gate. GitHub keeps one pending run per group and
    # replaces it by queue arrival, so the survivor may be an *older*
    # recovery than the one it displaced. The script therefore ignores the
    # event's own timestamp and reads the newest successful retry on the SHA
    # from the API, so any survivor covers every recovery before it ran.
    concurrency:
      group: refresh-gate-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: write # re-run the gate's failed jobs
      contents: read
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout refresh script
        # workflow_run runs from the default branch, so this is trusted main
        # code, never the triggering head.
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/refresh-all-checks-gate.py
            scripts/ci/github_api.py
          sparse-checkout-cone-mode: false
      - name: Re-run stale red gates for the recovered commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/refresh-all-checks-gate.py
