---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
