---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@46cd4f431a6501230b629433c690bbc45d6c01ac # v0.59.28
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '46cd4f431a6501230b629433c690bbc45d6c01ac'  # v0.59.28
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
