---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@bab120fff62b419489d26a18b5cdccbc26703394 # v0.60.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'bab120fff62b419489d26a18b5cdccbc26703394' # v0.60.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
