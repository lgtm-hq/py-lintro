---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@61180f222f8c04d381bbebcbd1e91b38a569080f # v0.69.6
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '61180f222f8c04d381bbebcbd1e91b38a569080f' # v0.69.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
