---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@bfeaec696ae5831fb369c8840cdf0df401fd8f8b # v0.91.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'bfeaec696ae5831fb369c8840cdf0df401fd8f8b' # v0.91.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
