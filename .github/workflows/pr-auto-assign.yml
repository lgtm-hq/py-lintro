---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@666482503128c40a09ed21b955456e46d6bdfcbe # v0.63.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '666482503128c40a09ed21b955456e46d6bdfcbe' # v0.63.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
