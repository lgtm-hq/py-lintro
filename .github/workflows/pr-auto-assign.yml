---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@737747b1b8590900afc41a72efdd372e244ea39d # v0.69.10
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '737747b1b8590900afc41a72efdd372e244ea39d' # v0.69.10
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
