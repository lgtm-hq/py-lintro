---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@ea2eef45ec331a743dffd362a7397a0863501bd4 # v0.59.25
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'ea2eef45ec331a743dffd362a7397a0863501bd4'  # v0.59.25
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
