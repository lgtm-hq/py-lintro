---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@eb01982e334eaa7599709a0f767d97afbb015303 # v0.69.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'eb01982e334eaa7599709a0f767d97afbb015303' # v0.69.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
