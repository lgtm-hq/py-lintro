---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@0fec207d579bcf9961df170ef982da6d268c3fd1 # v0.73.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '0fec207d579bcf9961df170ef982da6d268c3fd1' # v0.73.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
