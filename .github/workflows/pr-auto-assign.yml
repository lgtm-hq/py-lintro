---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@903af56f9e0c623a047ccb5821e74bbb22d9514d # v0.74.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '903af56f9e0c623a047ccb5821e74bbb22d9514d' # v0.74.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
