---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@b0d71b2b37fd205bf12118f5084612ceeea09208 # v0.69.9
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'b0d71b2b37fd205bf12118f5084612ceeea09208' # v0.69.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
