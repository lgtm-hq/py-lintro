---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
