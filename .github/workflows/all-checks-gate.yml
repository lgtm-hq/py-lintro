---
name: PR - All Checks Gate
# One required check, `gate / ✅ All Checks Passed`, that passes only when
# every other check on the PR head (or merge-queue head) finished success,
# skipped or neutral, so native auto-merge and the merge queue wait for all
# checks, not just the required ones. Keep it in its own workflow file: runs
# of this file are excluded so the gate never waits on itself.

'on':
  push:
    branches: [main]
  pull_request:
    # `edited` too: PR - Title Validation re-runs on title edits.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

# pull_request runs share one group per PR, so a new head or title edit
# cancels the stale gate. Every main push and merge-queue run gets its own
# group (run_id + run_attempt) and is never cancelled: a later merge must not
# turn the previous commit's gate red. See .github/workflows/README.md
# "Concurrency".
concurrency:
  group: >-
    all-checks-gate-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number
    || github.run_id }}-${{ github.event_name == 'pull_request' && 'pr' ||
    github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      # Docker build, validation and same-run recovery can exceed one hour.
      timeout-minutes: 180
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
