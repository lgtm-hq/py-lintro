---
name: AI Review - Dogfood

# Dogfood `lintro review` on py-lintro's own pull requests.
#
# Trusted install: lintro is installed from the PR's BASE ref (main), never the
# PR head, so PR-controlled code never executes with the CLAUDE_CODE_OAUTH_TOKEN
# in scope. The PR is still reviewed — `lintro review --pr <N>` fetches the diff
# through `gh` (GitHub API), so the PR's lintro/** changes are reviewed as data,
# never run with the token. See the security note on the job below.
#
# TRANSPORT (#1894/#1971): the review runs on the `cli` transport. Repo Actions
# variables pick the provider (`LINTRO_AI_PROVIDER`, default anthropic). Anthropic
# uses the pinned `claude` binary and CLAUDE_CODE_OAUTH_TOKEN; Cursor uses the
# pinned `agent` binary and CURSOR_API_KEY. The ANTHROPIC_API_KEY account's
# balance is depleted, which is what turned this check red on every PR after
# #1826 made a credential failure visible. The CLI is *not* sent `--bare`
# (LINTRO_CLI_BARE: never): bare mode disables OAuth session login and
# authenticates only against an API key, which is precisely the credential that
# does not work for the Anthropic dogfood (#1838).
#
# Spend ceiling: committed YAML leaves `ai.max_cost_usd` unset (#2156
# rollout). The `LINTRO_AI_MAX_COST_USD` Actions variable is the operator
# overlay (#2024 / #2155): `uncapped` lifts the ceiling; overlay `0` is
# rejected as ambiguous. YAML `0` is still a literal $0 cap. Under the CLI
# transport the figure is a runtime bound, not marginal dollars (#1923).
# Historical note: #2018 / 9f43a98a briefly shipped 0.50; #2025 restored 2.00
# as the interim committed cap; this rollout removes that committed cap.
#
# Posts a review comment: the review runs with `--post`, so lintro maintains a
# single sticky comment on the PR (rich findings + cumulative telemetry) and
# posts inline review comments for diff-mappable findings.
#
# NO-SILENT-SKIP (#1826): this job is intentionally NOT a required check, but it
# is no longer unconditionally green. It previously carried continue-on-error at
# both the job and step level, so the check reported success even when the review
# aborted — for months `AI Review ✓` meant nothing, because a depleted Anthropic
# balance made every run a no-op. The job now reddens whenever no review was
# produced (missing/dead credential, depleted balance, unreachable provider,
# lintro-side failure); scripts/ci/run-ai-review.sh decides which case it is.
# Since the check is not required, a billing condition is loud but never blocks a
# merge. P1 findings still pass: the review ran, and its findings are advisory.
#
# ACTIVATION PRECONDITION (audited #1317, follow-up to #1072/#1074):
# Safe to expose the provider credential to this job only when all of the
# following hold (structurally asserted in tests/scripts/test_run_ai_review.py):
#   1. Job if-guard: non-draft, same-repository PRs only (fork PRs never run).
#   2. Trusted install: checkout ref is pull_request.base.sha, never PR head.
#   3. Secret ordering: provider credentials (CLAUDE_CODE_OAUTH_TOKEN and
#      CURSOR_API_KEY) are injected only into the review step env, after
#      the trusted base-ref checkout, the pinned CLI installs, and uv sync.
# No GitHub Environment gate is required once (1–3) hold; the trusted-install
# mechanism from #1074 is the primary control. Re-audit if the checkout ref,
# job guard, or secret injection site changes.
#
# TWO-PR BOOTSTRAP (#2025, rationale corrected #2158): this job checks
# out only the trusted base ref. Since 8 Dec 2025, GitHub evaluates
# pull_request_target workflow YAML and GITHUB_SHA from the repository
# default branch, not from the pull request (changelog 2025-11-07).
# Combined with the base-sha checkout, a new workflow step cannot see a
# brand-new script until that script is already on the default branch.
# Convention: PR 1 lands the script inert (no workflow step calls it
# yet); PR 2, after PR 1 is on main, adds the step that invokes it.
# Never land a new script and its first workflow invocation in the same
# PR. Extending an already-invoked script (run-ai-review.sh) is the
# allowed same-PR path. A second `actions/checkout` (any `path:`) fails
# the audit in tests/scripts/test_run_ai_review.py.

# No paths filter: every PR gets the dogfood review (#1902). The lintro/**
# filter dated from API-metered billing; under subscription billing the CI and
# workflow diffs it skipped are exactly where recent regressions shipped.
'on':
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-24.04
    # No job-level continue-on-error: that rewrites the conclusion to
    # `success`, which is precisely how a review that never ran kept
    # reading as a pass (#1826). Locate/download are the only step-level
    # exceptions (best-effort plumbing; they must not skip the review).
    # The review step itself still has none. The check is not required,
    # so a red conclusion here is visible without being blocking.
    #
    # Skip draft PRs and never run for fork PRs. Fork PRs already cannot read
    # secrets, but requiring head.repo == the base repo makes it explicit that
    # the keyed job only runs for same-repository pull requests.
    #
    # SECURITY: lintro is installed from the PR's trusted BASE ref
    # (pull_request.base.sha, i.e. main), never the PR head, so the code that
    # runs with the provider credential is always trusted — a PR cannot
    # substitute its own lintro/** to exfiltrate the token. Agent CLI versions
    # are pinned in the base ref's Dockerfile for the same reason. Cursor
    # install is gated on `vars.LINTRO_AI_PROVIDER == 'cursor'` and runs
    # `scripts/ci/install-cursor-agent.sh` from this trusted checkout — never
    # a PR-head side-checkout. New installer scripts follow the two-PR
    # bootstrap convention in the file header. The PR is reviewed as data:
    # `lintro review --pr <N>` fetches the diff via `gh` (GitHub API), it
    # does not execute the PR's working tree.
    # Trade-off: a PR that breaks the review code itself won't be caught by this
    # job (that is covered by the unit tests in tests/), which is the correct
    # security posture. The credential is therefore safe to enable.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # actions/checkout reads the trusted base ref with the workflow token.
      contents: read
      # `--post` writes as lintro-review[bot] via the App token (#2050).
      # The workflow GITHUB_TOKEN is only used by `gh` to fetch the PR
      # diff, which needs pull-requests: read.
      pull-requests: read
      # Cross-run artifact listing / download-artifact with run-id uses
      # the workflow GITHUB_TOKEN (#2158). Upload uses the same token.
      actions: read
    # COUPLED to ai.transports.cli.timeout (default 900 s,
    # lintro.ai.transport.DEFAULT_CLI_TIMEOUT): the
    # job budget must cover setup (~7 min) + the full review timeout (15 min) +
    # posting margin, so lintro's own timeout always fires before the runner
    # kills the job — a runner kill truncates the JSON envelope the outcome
    # classifier reads. Invariant enforced by tests/scripts/
    # test_run_ai_review.py; bump both values together. 75 (was 30, then 50) because
    # custom-agent passes stack additional per-call --timeout budgets on top
    # of the main review call, and provider-heavy diffs were hitting the old
    # ceiling exactly (#1976 reviews killed at the boundary four times; #1977's
    # oscillated around 45-55 min and was killed at 50 twice).
    timeout-minutes: 75
    # Cursor shards are appended only when the dogfood provider is Cursor.
    # They stay out of the anthropic path so that job cannot reach Cursor
    # hosts. A rotated shard (e.g. repo43.cursor.sh) is named in the
    # harden-runner summary of the failed run; fix is a one-line allowlist
    # PR on AI_REVIEW_CURSOR_EGRESS. No wildcards on this job.
    env:
      # yamllint disable-line rule:line-length
      AI_REVIEW_CURSOR_EGRESS: ${{ vars.LINTRO_AI_PROVIDER == 'cursor' && 'downloads.cursor.com:443 api2.cursor.sh:443 api3.cursor.sh:443 agentn.global.api5.cursor.sh:443 repo42.cursor.sh:443' || '' }}

    steps:
      - name: Harden Runner
        # Cursor shards observed on live dogfood (runs 31779466126 /
        # 31782811574): downloads.cursor.com, api2.cursor.sh, api3.cursor.sh,
        # agentn.global.api5.cursor.sh, repo42.cursor.sh. Gated via
        # AI_REVIEW_CURSOR_EGRESS so the anthropic path never allowlists
        # them. release-assets.githubusercontent.com is setup-node's
        # GitHub releases CDN; those runs blocked it and the action fell
        # back to nodejs.org — allowlisted so Node install is not a silent
        # fallback.
        # pipelines.actions.githubusercontent.com is the artifact service
        # (#2158 / test-ci.yml precedent). This job forbids wildcard
        # endpoints, so `*.blob.core.windows.net` (used by publish jobs)
        # cannot be copied here. No additional blob-redirect host has
        # been observed on artifact upload/download in this repo.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            api.anthropic.com:443
            astral.sh:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            nodejs.org:443
            registry.npmjs.org:443
            ${{ env.AI_REVIEW_CURSOR_EGRESS }}

      - name: Checkout base ref (trusted lintro install)
        # Install lintro from the PR's BASE ref (main), NOT the PR head. The
        # code that runs with the credential must be trusted; the PR diff is
        # fetched separately via `gh` in the review step. base.sha is the exact
        # commit the PR targets and is already merged into main, so it is safe.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          # Nothing after this step talks to git over the network — `gh` uses
          # GH_TOKEN — so leaving the token in .git/config would only widen
          # what a compromised review step could read.
          persist-credentials: false

      - name: Locate prior review-state run
        # API listing, not download-artifact's same-run default. Extends
        # run-ai-review.sh so this is not a new script invocation (#2158).
        # Empty run-id is the no-op: first review on a PR, or no valid prior.
        # continue-on-error keeps a locator failure from skipping the
        # review. The file-existence guard covers already-open PRs whose
        # base.sha still has the pre-plumbing run-ai-review.sh (that
        # older script treats --locate-prior-state as a PR number).
        id: prior-state
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f scripts/ci/review_state_artifacts.py ]]; then
            scripts/ci/run-ai-review.sh --locate-prior-state
          else
            echo "run-id=" >>"${GITHUB_OUTPUT:?}"
          fi

      - name: Download prior review-state artifacts
        # Skipped until a prior completed run actually uploaded state.
        # continue-on-error: a download failure must not skip the review.
        if: steps.prior-state.outputs.run-id != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.prior-state.outputs.run-id }}
          pattern: lintro-review-state-pr-${{ github.event.number }}-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ai-review-state

      - name: Resolve pinned agent-CLI versions
        id: pins
        # Single pin site: the Node and claude-code versions live in
        # docker/ai-tools.Dockerfile's Renovate-managed ARGs, so the CLI this
        # job drives is the one lintro ships and the contract tests verify.
        run: |
          python3 scripts/ci/ai_tools_arg_pin.py NODE_VERSION CLAUDE_CODE_VERSION \
            --exact --format github >>"$GITHUB_OUTPUT"

      - name: Resolve pinned cursor agent version
        id: cursor-pins
        if: ${{ vars.LINTRO_AI_PROVIDER == 'cursor' }}
        # Calendar build id is not semver, so this resolves without --exact.
        # Gated so the anthropic path never touches the Cursor tarball pins.
        run: |
          python3 scripts/ci/ai_tools_arg_pin.py CURSOR_AGENT_VERSION \
            CURSOR_AGENT_SHA256_X64 --format github >>"$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node-version }}

      - name: Install pinned claude CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pins.outputs.claude-code-version }}
        run: scripts/ci/install-claude-cli.sh

      - name: Install pinned cursor agent CLI
        if: ${{ vars.LINTRO_AI_PROVIDER == 'cursor' }}
        env:
          CURSOR_AGENT_VERSION: ${{ steps.cursor-pins.outputs.cursor-agent-version }}
          # yamllint disable-line rule:line-length
          CURSOR_AGENT_SHA256_X64: ${{ steps.cursor-pins.outputs.cursor-agent-sha256-x64 }}
        run: scripts/ci/install-cursor-agent.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --extra ai

      - name: Mint lintro-review App token
        id: lintro-review-app
        # Repo-scoped installation token (#2050). Default current-repo scope —
        # do not pass `owner:` without `repositories:`. Only the review step
        # below sees `outputs.token`; inference credentials stay separate.
        # Request only permissions the App installation grants. Asking for
        # `permission-contents: read` 422s the whole mint when Contents is
        # not on the install; compare then degrades instead of posting nothing.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          private-key: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Run AI review (posts comment; fails when nothing was reviewed)
        run: scripts/ci/run-ai-review.sh
        env:
          PR_NUMBER: ${{ github.event.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The guarded credential. ANTHROPIC_API_KEY is deliberately absent:
          # its account has no balance, and its mere presence would make
          # lintro's bare-mode detection think a bare `claude` call could
          # authenticate (LINTRO_CLI_BARE pins the decision regardless).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor CLI auth when LINTRO_AI_PROVIDER=cursor. Empty when the
          # org/repo secret is unset — the wrapper then fails visibly rather
          # than posting nothing.
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # `never` == do not send `--bare`, so the CLI uses its OAuth session
          # (#1838/#1859). AUTO would resolve the same way with no API key in
          # scope; pinning it keeps CI deterministic if that ever changes.
          LINTRO_CLI_BARE: 'never'
          # Keep the CLI's egress to api.anthropic.com only, and keep the
          # pinned version pinned — an autoupdate would silently swap the
          # binary the contract tests verified.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          # `gh` fetches the PR diff with the workflow token
          # (contents: read + pull-requests: read).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `--post` writes as lintro-review[bot] via the App token (#2050).
          GITHUB_TOKEN: ${{ steps.lintro-review-app.outputs.token }}
          # Repo Actions variables named identically to the env vars they feed
          # (#1971). Unset variables keep today's pinned CI defaults (cli /
          # anthropic); a set variable is the experiment loop (`gh variable set`
          # → next run → `gh variable delete`). Empty MODEL falls through to
          # the provider/config default. LINTRO_AI_ENABLED is hardcoded: CI
          # always turns the master switch on; the committed YAML stays
          # `enabled: false` for local checkouts.
          LINTRO_AI_ENABLED: '1'
          LINTRO_AI_TRANSPORT: ${{ vars.LINTRO_AI_TRANSPORT || 'cli' }}
          LINTRO_AI_PROVIDER: ${{ vars.LINTRO_AI_PROVIDER || 'anthropic' }}
          LINTRO_AI_MODEL: ${{ vars.LINTRO_AI_MODEL }}
          # Spend ceiling overlay (#2024 / #2154 / #2156). Unset falls
          # through to committed YAML (now unset = no cap). Overlay
          # `uncapped` is the explicit lift; overlay `0` is rejected as
          # ambiguous. YAML `0` is still a literal $0 cap. The CLI
          # transport treats a numeric cap as a runtime bound, not
          # marginal dollars, under subscription auth.
          LINTRO_AI_MAX_COST_USD: ${{ vars.LINTRO_AI_MAX_COST_USD }}

      - name: Upload review-state artifacts
        # Final upload is best-effort. Empirically, a cancelled mid-job
        # step caused later always() uploads to skip (dogfood job
        # 97293667852, 2026-08-24). Incremental part uploads (#2154)
        # remain the primary persistence path. if-no-files-found: ignore
        # so pre-feature runs no-op.
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # yamllint disable-line rule:line-length
          name: lintro-review-state-pr-${{ github.event.number }}-attempt-${{ github.run_attempt }}-final
          path: ai-review-state/
          if-no-files-found: ignore
          retention-days: 30
