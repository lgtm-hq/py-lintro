---
name: AI Review - Dogfood

# Dogfood `lintro review` on py-lintro's own pull requests.
#
# Trusted install: lintro is installed from the base-branch commit that
# supplied this workflow definition (github.workflow_sha: the tip of the PR's
# base branch, main for every dogfood PR, or the default branch on a
# comment-triggered run), never the PR head,
# so PR-controlled code never executes with a provider credential in scope.
# The PR is still reviewed — `lintro review --pr <N>` fetches the diff through
# `gh` (GitHub API), so the PR's lintro/** changes are reviewed as data, never
# run with the token. See the security note on the job below.
#
# REVIEW LANES (ADR-0011, #2869/#2870): where the review goes is a named row
# in the committed manifest scripts/ci/ai_review_lanes.json, and nowhere
# else. Which row runs is selected by the repository variable
# LINTRO_AI_PROVIDER (a declared lane id: anthropic, openai, cursor, zai or
# kimi; unset means the manifest's chain[0]; anything else is red before a
# secret exists) and LINTRO_AI_MODEL overrides that row's default model.
# Both are read by the secret-free `lane` job only. It checks out
# github.workflow_sha, runs scripts/ci/resolve_review_lanes.py, and
# publishes the resolved `chain` (chain[0] is the active lane; the rest is
# the fallback order of ADR-0011 decision D, walked by the wrapper, #2872) and every
# chain row as job outputs.
# The review job consumes only those outputs: its harden-runner egress is the
# union of the chain's hosts plus the static GitHub and toolchain hosts; each
# credential is forwarded by one literal `secrets.<NAME>` expression gated on
# membership of the chain, never indexed dynamically; the pinned CLI installs
# are gated on the lane's provider; and scripts/ci/run-ai-review.sh binds the
# attempt to its row — provider, transport, model and the base-URL override
# come from the row, exactly one credential is in scope, and a competing
# credential or a config that disagrees with the row refuses the run.
# No variable supplies an endpoint, a credential binding or an egress host:
# a selector can only name a declared row, so the worst an inherited value
# can do is pick another declared lane, and the sticky prints which. The
# other `vars.*` reads here are budget overlays, and a structural test pins
# the set. The default lane is `anthropic` (the pinned `claude` binary on the
# CLAUDE_CODE_OAUTH_TOKEN subscription session, LINTRO_CLI_BARE=never so the
# OAuth session is used, #1838); `openai` (the pinned `codex` binary on the
# CODEX_AUTH_JSON session, materialised by the wrapper for the attempt),
# `cursor` (CURSOR_API_KEY), `zai` (ZAI_AUTH_TOKEN) and `kimi` (KIMI_API_KEY),
# the last two non-first-party gateways, are the other declared rows.
# Switching lanes is a change to the repository variable; it reaches every
# open PR on the next run. A rerun keeps its run's inputs, so after a switch
# the recovery step for a red PR is an `@lintro review` comment, which
# starts a new run.
#
# Spend ceiling: committed YAML leaves `ai.max_cost_usd` unset (#2156
# rollout). The `LINTRO_AI_MAX_COST_USD` Actions variable is the operator
# overlay (#2024 / #2155): `uncapped` lifts the ceiling; overlay `0` is
# rejected as ambiguous. YAML `0` is still a literal $0 cap. Under the CLI
# transport the figure is a runtime bound, not marginal dollars (#1923).
# The `LINTRO_AI_REVIEW_PR_BUDGET_USD` variable is the same kind of overlay
# for the per-PR review budget, `ai.review_pr_budget_usd` (#2796). Budget
# overlays shape spend, not routing, which is why they stay variables.
# Historical note: #2018 / 9f43a98a briefly shipped 0.50; #2025 restored 2.00
# as the interim committed cap; this rollout removes that committed cap.
#
# Posts a review comment: the review runs with `--post`, so lintro maintains a
# single sticky comment on the PR (rich findings + cumulative telemetry) and
# posts inline review comments for diff-mappable findings.
#
# NO-SILENT-SKIP (#1826): this job is intentionally NOT a required check, but it
# is no longer unconditionally green. It previously carried continue-on-error at
# both the job and step level, so the check reported success even when the review
# aborted — for months `AI Review ✓` meant nothing, because a depleted Anthropic
# balance made every run a no-op. The job now reddens whenever no review was
# produced (missing/dead credential, depleted balance, unreachable provider,
# lintro-side failure); scripts/ci/run-ai-review.sh decides which case it is.
# Since the check is not required, a billing condition is loud but never blocks a
# merge. P1 findings still pass: the review ran, and its findings are advisory.
#
# ACTIVATION PRECONDITION (audited #1317, follow-up to #1072/#1074; ADR-0011):
# Safe to expose a provider credential to this job only when all of the
# following hold (structurally asserted in tests/scripts/test_run_ai_review.py):
#   1. Job if-guard: non-draft, same-repository PRs only (fork PRs never run).
#   2. Trusted install: the checkout ref is github.workflow_sha, the
#      base-branch commit that supplied this definition and the manifest,
#      never the PR head and never older than the manifest it is handed.
#   3. Secret ordering: provider credentials (CLAUDE_CODE_OAUTH_TOKEN,
#      CURSOR_API_KEY, ZAI_AUTH_TOKEN, KIMI_API_KEY and CODEX_AUTH_JSON) are
#      injected only into the review step env, after the trusted checkout,
#      the pinned CLI
#      installs, and uv sync.
#   4. Credentials are selected by the resolved lane id, never by a
#      variable's presence: each is one literal expression gated on
#      membership of the chain the secret-free lane job published.
# No GitHub Environment gate is required once (1–4) hold; the trusted-install
# mechanism from #1074 is the primary control. Re-audit if the checkout ref,
# job guard, or secret injection site changes.
#
# SAME-COMMIT SCRIPTS (ADR-0011 A; retires the two-PR bootstrap of #2025):
# since both the lane job and the review job check out github.workflow_sha,
# the commit that supplied this YAML also supplies every script it invokes,
# so a script and its first workflow invocation may land together. A second
# `actions/checkout` (any `path:`) still fails the audit in
# tests/scripts/test_run_ai_review.py.

# No paths filter: every PR gets the dogfood review (#1902). The lintro/**
# filter dated from API-metered billing; under subscription billing the CI and
# workflow diffs it skipped are exactly where recent regressions shipped.
#
# ON-REQUEST REVIEW (#2795, #2627 PR 2): a user with write access can comment
# `@lintro review` (full), `@lintro review delta` or `@lintro review <path…>`
# on a pull request. The `request` job validates the comment and the
# commenter (scripts/ci/resolve_review_request.py; no secrets, read-only
# token), `acknowledge` reacts 👀 (and posts the constant usage text for a
# malformed request) with the App token, and `ai-review` runs the same review
# as a push would (serialised with it, never cancelling it), with the mode
# passed through validated outputs. The comment
# text only ever reaches the request step through `env:`, never a `run:` line.
# For issue_comment GitHub takes this file and GITHUB_SHA from the default
# branch, and there is no pull_request.base.sha: the review job's checkout
# is github.workflow_sha on every event, which on a comment run is that
# default-branch commit. issue_comment is not affected by the 2026-11-02
# pull_request_target restriction (#2793).
'on':
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

# Per PR for pull-request events: a push supersedes its own PR's pending or
# running review. Every issue_comment run gets a group of its own (ruling 9 on
# #2795, from a CodeRabbit finding): workflow-level concurrency is evaluated
# before any job `if` or the permission check, so any comment that shared the
# PR's group could cancel a running review, including a `@lintro review` from
# a member or collaborator without write access. A comment run therefore never
# cancels anything and is never cancelled by a push; a push and an on-request
# review of the same PR both run, serialised by the PR's review slot below, and
# the later sticky wins. The permission API in the request job is the only
# boundary on who may request a review.
concurrency:
  group: >-
    ai-review-${{ github.event_name == 'pull_request_target'
    && github.event.pull_request.number
    || format('comment-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  lane:
    name: Resolve review lane
    # Secret-free. Reads the committed manifest at the base-branch commit
    # that supplied this workflow (github.workflow_sha), applies the
    # LINTRO_AI_PROVIDER lane selector and the LINTRO_AI_MODEL override, and
    # publishes the chain and every chain row; the review job consumes only
    # these outputs (ADR-0011 A). Runs on pull-request events and on comments
    # that could be a review request (the request job's own prefilter), so a
    # comment that
    # is not one spends no runner; the request job's refusals then leave this
    # job's result unused.
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@lintro review'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read # sparse checkout of the manifest and the resolver
    timeout-minutes: 5
    outputs:
      chain: ${{ steps.resolve.outputs.chain }}
      lane: ${{ steps.resolve.outputs.lane }}
      egress: ${{ steps.resolve.outputs.egress }}
      lanes: ${{ steps.resolve.outputs.lanes }}
      provider: ${{ steps.resolve.outputs.provider }}
      transport: ${{ steps.resolve.outputs.transport }}
      endpoint: ${{ steps.resolve.outputs.endpoint }}
      first-party: ${{ steps.resolve.outputs.first_party }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout the manifest and the resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base-branch commit that supplied this workflow definition.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/ai_review_lanes.json
            scripts/ci/resolve_review_lanes.py
          sparse-checkout-cone-mode: false

      - name: Resolve the chain from the manifest
        id: resolve
        # Fails closed, naming the declared lanes, before any secret exists.
        # The two routing variables are read here and nowhere else: the
        # resolver accepts only a declared lane id and a model id.
        env:
          LINTRO_AI_PROVIDER: ${{ vars.LINTRO_AI_PROVIDER }}
          LINTRO_AI_MODEL: ${{ vars.LINTRO_AI_MODEL }}
        run: python3 -I scripts/ci/resolve_review_lanes.py --format github

  request:
    name: Resolve review request
    # Comments on pull requests that start with the command word only. The
    # script re-parses, checks write access through the API, and requires an
    # open, non-draft, same-repository PR; every refusal is a log line.
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '@lintro review')
    runs-on: ubuntu-24.04
    # No secrets in this job, and nothing it can write with.
    permissions:
      contents: read # sparse checkout of the gate script and the parser
      pull-requests: read # read the PR's state, draft flag and head
    timeout-minutes: 5
    outputs:
      run: ${{ steps.resolve.outputs.run }}
      mode: ${{ steps.resolve.outputs.mode }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      paths: ${{ steps.resolve.outputs.paths }}
      comment-id: ${{ steps.resolve.outputs.comment-id }}
      requester: ${{ steps.resolve.outputs.requester }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout the trusted gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base-branch commit that supplied this workflow definition.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            lintro/ai/review/commands.py
            scripts/ci/resolve_review_request.py
          sparse-checkout-cone-mode: false

      - name: Check the request and the requester
        id: resolve
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/resolve_review_request.py

  acknowledge:
    name: Acknowledge review request
    needs: [request]
    # Accepted requests get 👀; a malformed request from a writer also gets the
    # constant usage text. A refused request never reaches this job.
    if: >-
      contains(fromJSON('["full","delta","paths","usage"]'), needs.request.outputs.mode)
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            api.github.com:443

      - name: Mint lintro-review App token
        id: lintro-review-app
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          private-key: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # The usage text is one list item per line, kept identical to
      # lintro/ai/review/commands.py USAGE_TEXT (asserted in tests).
      # yamllint disable rule:line-length
      - name: React, and answer a malformed request with the usage text
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Integers and a validated mode only; no comment text, no login.
          COMMENT_ID: ${{ needs.request.outputs.comment-id }}
          PR_NUMBER: ${{ needs.request.outputs.pr-number }}
          REQUEST_MODE: ${{ needs.request.outputs.mode }}
        with:
          github-token: ${{ steps.lintro-review-app.outputs.token }}
          script: |
            const { owner, repo } = context.repo
            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: Number(process.env.COMMENT_ID),
              content: 'eyes',
            })
            if (process.env.REQUEST_MODE === 'usage') {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: [
                  'Usage (first line of a comment, by a user with write access):',
                  '',
                  '- `@lintro review`: full review of the whole diff',
                  '- `@lintro review delta`: review the change since the last round',
                  '- `@lintro review <path> [<path> ...]`: review only files under these path prefixes (at most 20, each up to 200 characters; no globs, no `..`, no leading `/` or `-`)',
                ].join('\n'),
              })
            }
      # yamllint enable rule:line-length

  ai-review:
    name: AI Review
    needs: [lane, request]
    runs-on: ubuntu-24.04
    # No job-level continue-on-error: that rewrites the conclusion to
    # `success`, which is precisely how a review that never ran kept
    # reading as a pass (#1826). Locate/download are the only step-level
    # exceptions (best-effort plumbing; they must not skip the review).
    # The review step itself still has none. The check is not required,
    # so a red conclusion here is visible without being blocking.
    #
    # Skip draft PRs and never run for fork PRs. Fork PRs already cannot read
    # secrets, but requiring head.repo == the base repo makes it explicit that
    # the keyed job only runs for same-repository pull requests.
    #
    # SECURITY: lintro is installed from github.workflow_sha, the trusted
    # base-branch commit that supplied this definition and the manifest,
    # never the PR head, so the code that runs with the provider credential
    # is always trusted — a PR cannot substitute its own lintro/** to
    # exfiltrate the token. Agent CLI versions are pinned in that commit's
    # Dockerfile for the same reason. Each CLI install is gated on the
    # resolved lane's provider and runs its installer from this trusted
    # checkout — never a PR-head side-checkout. The PR is reviewed as data:
    # `lintro review --pr <N>` fetches the diff via `gh` (GitHub API), it
    # does not execute the PR's working tree.
    # Trade-off: a PR that breaks the review code itself won't be caught by this
    # job (that is covered by the unit tests in tests/), which is the correct
    # security posture. The credential is therefore safe to enable.
    #
    # On-request (#2795): runs only when the request job accepted the
    # comment (write access, open non-draft same-repository PR). `!cancelled()`
    # lets it run on pull-request events, where the request job is skipped.
    if: >-
      !cancelled()
      && needs.lane.result == 'success'
      && ((github.event_name == 'pull_request_target'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment'
          && needs.request.outputs.run == 'true'))
    permissions:
      # actions/checkout reads the trusted workflow_sha with the workflow token.
      contents: read
      # `--post` writes as lintro-review[bot] via the App token (#2050).
      # The workflow GITHUB_TOKEN is only used by `gh` to fetch the PR
      # diff, which needs pull-requests: read.
      pull-requests: read
      # Cross-run artifact listing / download-artifact with run-id uses
      # the workflow GITHUB_TOKEN (#2158). Upload uses the same token.
      actions: read
    # COUPLED to ai.transports.cli.timeout (default 1800 s,
    # lintro.ai.transport.DEFAULT_CLI_TIMEOUT, mirrored by
    # CLI_REVIEW_TIMEOUT_SECONDS in scripts/ci/run-ai-review.sh): the job
    # budget must cover setup (~7 min) + the bounded wall-clock wait for the
    # exact-head lint report (up to 10 min, LINT_REPORT_WAIT_SECONDS in
    # scripts/ci/run-ai-review.sh, #2571) + one locate that may straddle
    # that deadline (5 min: three gh sequences of three 30 s attempts each,
    # plus retry sleeps) +
    # one per-chunk CLI timeout (30 min) + a 1 min posting margin, so
    # lintro's own timeout always fires before the runner kills the job — a
    # runner kill truncates the JSON envelope the outcome classifier reads
    # (#1916). Invariant enforced by tests/scripts/test_run_ai_review.py;
    # bump the values together.
    #
    # 53 (38 before the lint-report wait; 120, and 75/50/30 before that) is
    # that floor: with the 1800 s per-chunk CLI timeout, the 600 s wait and
    # the locate allowance the coupling test allows nothing smaller.
    # Measured basis over the last 40 runs: median 10 to 14 min, p75 21 min,
    # so 38 leaves real headroom on the p75 review. The tail that used to
    # need 120 was reruns starting from scratch: a review that exhausts the
    # budget checkpoints its state (#2156) and, since #2506, a rerun resumes
    # its *own* previous attempt instead of only completed earlier runs, so
    # each attempt makes progress rather than re-reviewing the whole diff.
    timeout-minutes: 53
    # Two review slots (#2796, #2627 PR 3; one repo-wide slot since #2506).
    # The workflow-level group above is per-PR with cancel-in-progress, so a
    # push still supersedes its own PR's review; it keeps the default
    # queue: single because a stale pending review of the same PR is
    # exactly what should be replaced. This job-level group additionally
    # admits one review job at a time per slot, two across the repo, and
    # never cancels: a queued review waits for the running one so
    # concurrent PRs cannot pile onto the same provider rate limit.
    #
    # The slot is the PR number's parity (ruling 12 on #2796), not the run
    # number's: every run of one PR, push or on-request, lands in the same
    # slot, so a push and an on-request review of that PR are still
    # serialised (ruling 9 on #2795) and never race on the sticky comment
    # or the review-state artifacts. Expressions have no arithmetic
    # operators, so parity is read off the number's last digit. The split
    # is static: two busy PRs of the same parity queue behind each other
    # while the other slot idles, which is never worse than one slot.
    #
    # The two levels stack; the job-level group does NOT opt this job out
    # of the workflow-level one. They govern different objects: a
    # workflow-level group cancels the RUN, and "cancel a workflow run,
    # including all jobs and steps" is what GitHub's cancellation docs
    # promise, while a job-level group only decides when this JOB may
    # start and whether a competitor *in its own group* cancels it.
    # Nothing in the workflow-syntax reference or the concurrency guide
    # says a job carrying its own group is exempt from its workflow's
    # group ("most specific wins" there is about `defaults`, not
    # `concurrency`). Observed here too: docker-ci.yml's `publish` job
    # declares group publish-<ref> with cancel-in-progress: false and is
    # still cancelled when a newer push supersedes its run. ai-review has
    # exactly one job, so a superseded run has nothing left to keep
    # running regardless.
    #
    # queue: max is load-bearing, not decoration. The default queue: single
    # keeps at most ONE pending run per group and cancels it when a third
    # arrives, so a burst of pushes across PRs would silently drop the
    # middle review — and AI Review is not in auto-rerun-on-infra-failure's
    # workflow list, so nothing would rerun it. queue: max raises the depth
    # to 100 pending runs, which is what "queued reviews wait, not cancel"
    # requires. The cost is accepted by design: with the 53 min cap above, a
    # deep queue can leave a review pending for hours before it starts.
    concurrency:
      group: >-
        ai-review-slot-${{ (endsWith(format('{0}',
        github.event.pull_request.number || needs.request.outputs.pr-number),
        '0') || endsWith(format('{0}', github.event.pull_request.number
        || needs.request.outputs.pr-number), '2') || endsWith(format('{0}',
        github.event.pull_request.number || needs.request.outputs.pr-number),
        '4') || endsWith(format('{0}', github.event.pull_request.number
        || needs.request.outputs.pr-number), '6') || endsWith(format('{0}',
        github.event.pull_request.number || needs.request.outputs.pr-number),
        '8')) && 'even' || 'odd' }}
      cancel-in-progress: false
      queue: max
    # Provider hosts come from the resolved chain (ADR-0011 A): the lane job
    # publishes the union of the chain's egress lists, and nothing here names
    # a provider host. A rotated shard is named in the harden-runner summary
    # of the failed run; the fix is a one-line manifest diff. No wildcards on
    # this job; the resolver refuses a wildcard host before any secret exists.
    env:
      # The reviewed PR: the event's on pull-request events, the request job's
      # validated number on an on-request review.
      # yamllint disable-line rule:line-length
      AI_REVIEW_PR: ${{ github.event.pull_request.number || needs.request.outputs.pr-number }}
      # The chain's provider hosts, from the manifest via the lane job.
      AI_REVIEW_LANE_EGRESS: ${{ needs.lane.outputs.egress }}

    steps:
      - name: Harden Runner
        # Provider hosts are the resolved chain's, from the manifest (the
        # AI_REVIEW_LANE_EGRESS line below); the static entries are GitHub
        # and the toolchain. release-assets.githubusercontent.com is setup-node's
        # GitHub releases CDN; those runs blocked it and the action fell
        # back to nodejs.org — allowlisted so Node install is not a silent
        # fallback.
        # pipelines.actions.githubusercontent.com and
        # results-receiver.actions.githubusercontent.com are the artifact
        # service (#2158 / in-step persist upload). This job forbids
        # wildcard endpoints, so `*.blob.core.windows.net` (used by
        # publish jobs) cannot be copied here. No additional blob-redirect
        # host has been observed on artifact upload/download in this repo.
        # GitHub's hosted-runner watchdog hosts (*.githubapp.com) need no entry
        # here: harden-runner v2.21.1 allows them from GitHub meta (#2352,
        # #2488). This job allows no wildcard endpoints at all.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            nodejs.org:443
            registry.npmjs.org:443
            ${{ env.AI_REVIEW_LANE_EGRESS }}

      - name: Checkout workflow_sha (trusted lintro install)
        # Install lintro from github.workflow_sha, the protected base-branch
        # commit that supplied this workflow definition and the manifest the
        # lane job read, NOT the PR head and NOT pull_request.base.sha, which
        # is the base as of the PR's last sync and can lag main (ADR-0011 A).
        # The code that runs with the credential must be trusted and never
        # older than the manifest it is handed; the PR diff is fetched
        # separately via `gh` in the review step. It is the only ref (audited
        # in test_run_ai_review.py).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          # Nothing after this step talks to git over the network — `gh` uses
          # GH_TOKEN — so leaving the token in .git/config would only widen
          # what a compromised review step could read.
          persist-credentials: false

      - name: Locate prior review-state run
        # API listing, not download-artifact's same-run default. Extends
        # run-ai-review.sh so this is not a new script invocation (#2158).
        # Empty run-id is the no-op: first review on a PR, or no valid prior.
        # continue-on-error keeps a locator failure from skipping the
        # review. The file-existence guard is kept for symmetry with the
        # script's own fail-safe locate mode.
        id: prior-state
        continue-on-error: true
        env:
          PR_NUMBER: ${{ env.AI_REVIEW_PR }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # A rerun keeps run_id and bumps run_attempt; the locator uses
          # both to resume this run's own cancelled attempt (#2506).
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f scripts/ci/review_state_artifacts.py ]]; then
            scripts/ci/run-ai-review.sh --locate-prior-state
          else
            echo "run-id=" >>"${GITHUB_OUTPUT:?}"
          fi

      - name: Download prior review-state artifacts
        # Skipped until a prior completed run actually uploaded state.
        # continue-on-error: a download failure must not skip the review.
        if: steps.prior-state.outputs.run-id != ''
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.prior-state.outputs.run-id }}
          pattern: lintro-review-state-pr-${{ env.AI_REVIEW_PR }}-*
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ai-review-state

      - name: Resolve pinned agent-CLI versions
        id: pins
        # Single pin site: the Node and claude-code versions live in
        # docker/ai-tools.Dockerfile's Renovate-managed ARGs, so the CLI this
        # job drives is the one lintro ships and the contract tests verify.
        run: |
          python3 scripts/ci/ai_tools_arg_pin.py NODE_VERSION CLAUDE_CODE_VERSION \
            --exact --format github >>"$GITHUB_OUTPUT"

      - name: Resolve pinned cursor agent version
        id: cursor-pins
        if: ${{ needs.lane.outputs.provider == 'cursor' }}
        # Calendar build id is not semver, so this resolves without --exact.
        # Gated so the anthropic path never touches the Cursor tarball pins.
        run: |
          python3 scripts/ci/ai_tools_arg_pin.py CURSOR_AGENT_VERSION \
            CURSOR_AGENT_SHA256_X64 --format github >>"$GITHUB_OUTPUT"

      - name: Resolve pinned codex version
        id: codex-pins
        if: ${{ needs.lane.outputs.provider == 'openai' }}
        # Same single pin site as the other lanes: the codex CLI this job
        # drives is the one the released ai image ships and the contract
        # tests verify. --exact: the installer rejects npm ranges/aliases.
        run: |
          python3 scripts/ci/ai_tools_arg_pin.py CODEX_VERSION \
            --exact --format github >>"$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node-version }}

      - name: Install pinned claude CLI
        if: ${{ needs.lane.outputs.provider == 'anthropic' }}
        env:
          CLAUDE_CODE_VERSION: ${{ steps.pins.outputs.claude-code-version }}
        run: scripts/ci/install-claude-cli.sh

      - name: Install pinned cursor agent CLI
        if: ${{ needs.lane.outputs.provider == 'cursor' }}
        env:
          CURSOR_AGENT_VERSION: ${{ steps.cursor-pins.outputs.cursor-agent-version }}
          # yamllint disable-line rule:line-length
          CURSOR_AGENT_SHA256_X64: ${{ steps.cursor-pins.outputs.cursor-agent-sha256-x64 }}
        run: scripts/ci/install-cursor-agent.sh

      - name: Install pinned codex CLI
        if: ${{ needs.lane.outputs.provider == 'openai' }}
        env:
          # yamllint disable-line rule:line-length
          CODEX_VERSION: ${{ steps.codex-pins.outputs.codex-version }}
        run: scripts/ci/install-codex-cli.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --extra ai

      - name: Expose Actions runtime for state upload
        # run: steps do not receive ACTIONS_RUNTIME_TOKEN /
        # ACTIONS_RESULTS_URL (runner Node/container actions do).
        # Export masked outputs so the review step can upload
        # checkpoints before a cancel skips later always() steps.
        id: artifact-runtime
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
            const results = process.env.ACTIONS_RESULTS_URL || ''
            if (token) {
              core.setSecret(token)
            }
            core.setOutput('runtime-token', token)
            core.setOutput('results-url', results)

      - name: Mint lintro-review App token
        id: lintro-review-app
        # Repo-scoped installation token (#2050). Default current-repo scope —
        # do not pass `owner:` without `repositories:`. Only the review step
        # below sees `outputs.token`; inference credentials stay separate.
        # Request only permissions the App installation grants. Asking for
        # `permission-contents: read` 422s the whole mint when Contents is
        # not on the install; compare then degrades instead of posting nothing.
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LINTRO_REVIEW_APP_ID }}
          private-key: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Run AI review (posts comment; fails when nothing was reviewed)
        run: scripts/ci/run-ai-review.sh
        env:
          PR_NUMBER: ${{ env.AI_REVIEW_PR }}
          # On-request review (#2795): validated outputs of the request job,
          # empty on pull-request events. run-ai-review.sh re-validates them.
          REVIEW_REQUEST_MODE: ${{ needs.request.outputs.mode }}
          REVIEW_REQUEST_PATHS: ${{ needs.request.outputs.paths }}
          REVIEW_REQUESTER: ${{ needs.request.outputs.requester }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The chain's credentials (ADR-0011 A): one literal expression per
          # credential, under its SECRET name, gated on membership of the
          # chain the secret-free lane job published. Never indexed
          # dynamically, never selected by a variable's presence. The
          # wrapper captures them, unsets them, and re-arms only the active
          # lane's under the variable its CLI reads (the z.ai and Kimi tokens
          # fill ANTHROPIC_AUTH_TOKEN; CODEX_AUTH_JSON is decoded into the codex
          # session for the attempt). ANTHROPIC_API_KEY is deliberately
          # absent: its account has no balance, and its mere presence would
          # make lintro's bare-mode detection think a bare `claude` call could
          # authenticate (LINTRO_CLI_BARE pins the decision regardless). The
          # condition is inverted (secret in the TRUE branch) because
          # `cond && '' || secret` can never yield '': GHA's `||` falls
          # through on the falsy ''.
          # yamllint disable-line rule:line-length
          CLAUDE_CODE_OAUTH_TOKEN: ${{ contains(fromJSON(needs.lane.outputs.chain), 'anthropic') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          CODEX_AUTH_JSON: ${{ contains(fromJSON(needs.lane.outputs.chain), 'openai') && secrets.CODEX_AUTH_JSON || '' }}
          # yamllint disable-line rule:line-length
          CURSOR_API_KEY: ${{ contains(fromJSON(needs.lane.outputs.chain), 'cursor') && secrets.CURSOR_API_KEY || '' }}
          # yamllint disable-line rule:line-length
          ZAI_AUTH_TOKEN: ${{ contains(fromJSON(needs.lane.outputs.chain), 'zai') && secrets.ZAI_AUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          KIMI_API_KEY: ${{ contains(fromJSON(needs.lane.outputs.chain), 'kimi') && secrets.KIMI_API_KEY || '' }}
          # The resolved chain and its rows. The wrapper binds the attempt:
          # LINTRO_REVIEW_* facts for the run record (#2867), the LINTRO_AI_*
          # overlays from the row, and the base-URL override to the row's
          # endpoint off-host only. Nothing else routes the run.
          LINTRO_REVIEW_CHAIN: ${{ needs.lane.outputs.chain }}
          LINTRO_REVIEW_LANES: ${{ needs.lane.outputs.lanes }}
          # `never` == do not send `--bare`, so the CLI uses its OAuth session
          # (#1838/#1859). AUTO would resolve the same way with no API key in
          # scope; pinning it keeps CI deterministic if that ever changes.
          LINTRO_CLI_BARE: 'never'
          # Keep the CLI's egress to the lane endpoint only, and keep the
          # pinned version pinned — an autoupdate would silently swap the
          # binary the contract tests verified.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          # `gh` fetches the PR diff with the workflow token
          # (contents: read + pull-requests: read) and downloads the
          # untrusted lint job's `linting-json-report` artifact for the PR
          # head (actions: read) — linter facts for the prompt (#2571).
          # The job itself runs no linter and no PR code.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `--post` writes as lintro-review[bot] via the App token (#2050).
          GITHUB_TOKEN: ${{ steps.lintro-review-app.outputs.token }}
          # LINTRO_AI_ENABLED is hardcoded: CI always turns the master switch
          # on; the committed YAML stays `enabled: false` for local checkouts.
          # Provider, transport and model are NOT variables: the wrapper
          # exports them from the lane row (ADR-0011 A).
          LINTRO_AI_ENABLED: '1'
          # Spend ceiling overlay (#2024 / #2154 / #2156). Unset falls
          # through to committed YAML (now unset = no cap). Overlay
          # `uncapped` is the explicit lift; overlay `0` is rejected as
          # ambiguous. YAML `0` is still a literal $0 cap. The CLI
          # transport treats a numeric cap as a runtime bound, not
          # marginal dollars, under subscription auth.
          LINTRO_AI_MAX_COST_USD: ${{ vars.LINTRO_AI_MAX_COST_USD }}
          # Per-PR review budget overlay (#2796): total spend across every
          # round of one PR. Unset leaves the budget off. Same grammar as
          # the round cap; an overlay always enforces, even under the CLI
          # transport, where committed YAML alone is display-only.
          # yamllint disable-line rule:line-length
          LINTRO_AI_REVIEW_PR_BUDGET_USD: ${{ vars.LINTRO_AI_REVIEW_PR_BUDGET_USD }}
          # In-step persist upload (#2173). Masked outputs from the
          # github-script step above; blank when the runner omitted them.
          ACTIONS_RUNTIME_TOKEN: ${{ steps.artifact-runtime.outputs.runtime-token }}
          ACTIONS_RESULTS_URL: ${{ steps.artifact-runtime.outputs.results-url }}

      - name: Upload review-state artifacts
        # Final upload is best-effort. A cancelled job skips later
        # always() steps (dogfood #2166 round 5 / job 97293667852).
        # run-ai-review.sh uploads checkpoints and an inline snapshot
        # from inside the review step so persist survives that skip.
        # This step still runs on a clean or step-timeout finish.
        # if-no-files-found: ignore so pre-feature runs no-op.
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # yamllint disable-line rule:line-length
          name: lintro-review-state-pr-${{ env.AI_REVIEW_PR }}-attempt-${{ github.run_attempt }}-final
          path: ai-review-state/
          if-no-files-found: ignore
          retention-days: 30
