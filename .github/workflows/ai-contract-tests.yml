---
name: AI - CLI Contract Tests

# Catch agent-CLI drift before it reaches a user's review (issue #1614, epic
# #1609). lintro's `--transport cli` providers shell out to `claude`, `codex` and
# Cursor's `agent`, all of which move their flag surfaces independently of lintro.
# When @anthropic-ai/claude-code 2.1.218 removed `--json-schema-name`, every CLI
# review broke and CI never noticed (#1611) — this workflow is what would have.
#
# Two tiers, split by cost:
#
#   Tier 1 (every PR + push + weekly) — flag surface. Runs `--version` and
#     `--help` only, so it needs no credential and spends no quota. Free enough to
#     be a required check.
#   Tier 2 (weekly + manual) — real invocation. Walks presence -> liveness ->
#     invoke per provider and spends quota, so it stays off the PR hot path.
#
# NO PATH FILTER, deliberately. A path-filtered required check never reports on
# the PRs it filters out, and those PRs then hang forever in the merge queue
# waiting for a check that will never arrive (#1196). Tier 1 pulls one image and
# runs three help probes, which is cheap enough to run unconditionally so this can
# safely be made required.
#
# Both tiers run inside the digest-pinned lintro-ai-tools image resolved from the
# root Dockerfile's `aitools` stage, so they verify exactly the CLI versions the
# released `ai` variant ships — and there is only ever one pin site to bump.

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required before adding the Tier 1 context to checks-py-lintro (#1119 /
  # #1196): a merge-queue ruleset would otherwise wait forever for a check that
  # this workflow never schedules.
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly (Monday 05:17 UTC), after the ai-tools image rebuild at 03:47 so the
    # scheduled run exercises the freshly published CLIs.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tier1-flag-surface:
    name: 🧾 AI CLI Flag Surface (Tier 1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the contract suite and the image pin
      packages: read # pull the pinned lintro-ai-tools image from GHCR
    # Pull + uv sync + three help probes; 15 fails a stalled run fast.
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned lintro-ai-tools image
        id: image
        # Single pin site: the digest lives in the root Dockerfile's `aitools`
        # stage and is Renovate-managed there. Copying it here would drift.
        run: |
          echo "ref=$(python3 scripts/ci/ai_tools_image_pin.py)" >>"$GITHUB_OUTPUT"

      - name: Run tier-1 contract tests
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TIER: '1'
        run: scripts/ci/run-ai-contract-tests.sh

  tier2-invocation-smoke:
    name: 🔥 AI CLI Invocation Smoke (Tier 2)
    # Scheduled and manual only: this tier spends provider quota.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Gated on the free tier: there is no point spending quota to discover a
    # problem `--help` already proved.
    needs: [tier1-flag-surface]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the contract suite and the image pin
      packages: read # pull the pinned lintro-ai-tools image from GHCR
    timeout-minutes: 25
    # Trusted-event gate for the provider credentials (#2481). Tier 2 runs on
    # schedule / dispatch today, and the `if:` above keeps it there; the
    # same-repository head clause is what keeps the secrets safe when the
    # review round-trip (#2515) adds a `pull_request` trigger, because a fork
    # head would then evaluate to false and every secret below resolves to ''.
    # Job-level env carries only this boolean — never a secret — so the
    # credentials stay scoped to the two steps that need them.
    #
    # Deliberately NOT pinned to refs/heads/main. `schedule` only ever runs
    # the default branch, and `workflow_dispatch` requires write access, so
    # neither event can be reached from a fork or by an untrusted actor. A
    # branch dispatch is the point: #2481 requires a green Tier 2 on the PR
    # branch before the wiring merges, and main-only would make dispatch a
    # no-op tier that can never prove a change. The trust boundary here is
    # write access, which is the same boundary that governs main itself.
    env:
      # yamllint disable-line rule:line-length
      AI_CONTRACT_SECRETS_ALLOWED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden Runner
        # Every host any dogfood lane can reach (.github/workflows/ai-review.yml
        # AI_REVIEW_*_EGRESS). Dogfood allowlists them one provider at a time
        # because a single run picks one provider; Tier 2 drives all three
        # lanes in one job, so it allowlists the union — otherwise a lane that
        # authenticates in dogfood dies here on egress instead. auth.openai.com
        # and chatgpt.com are the Codex subscription-session hosts; without
        # them the restored session cannot be exchanged and the codex lane
        # 401s. Exact hosts only: no wildcards on this job.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            api.anthropic.com:443
            api.openai.com:443
            auth.openai.com:443
            chatgpt.com:443
            api.cursor.com:443
            downloads.cursor.com:443
            api2.cursor.sh:443
            api3.cursor.sh:443
            agentn.global.api5.cursor.sh:443
            repo42.cursor.sh:443
            api.z.ai:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned lintro-ai-tools image
        id: image
        run: |
          echo "ref=$(python3 scripts/ci/ai_tools_image_pin.py)" >>"$GITHUB_OUTPUT"

      - name: Restore Codex subscription session
        id: codex-session
        # A corrupt secret must cost one lane, not three. The script rejects a
        # CODEX_AUTH_JSON that is not valid base64 of a JSON object and exits
        # 1, deleting the partial file; without continue-on-error that step
        # failure ends the job, and the anthropic and cursor lanes never run.
        # With it, the run reaches the smoke step with no session, the codex
        # lane reports link 3 of 3 unauthenticated, and the job still goes red
        # — the verdict stays with the step that owns it. This is the one
        # step here allowed to swallow its own failure, asserted as such in
        # tests/scripts/test_ai_contract_tests_workflow.py.
        continue-on-error: true
        # Same credential and the same script as the dogfood openai lane
        # (#2472): decode CODEX_AUTH_JSON into $HOME/.codex/auth.json. Codex
        # has no OAuth-token env var, and CODEX_API_KEY would bill metered API
        # credits instead of the ChatGPT-plan subscription. The runner script
        # mounts that directory into the contract container as CODEX_HOME.
        # Injected after
        # the checkout, like dogfood does. An unset secret warns and exits 0 —
        # the tier then reports an unauthenticated codex lane, never a pass.
        env:
          # yamllint disable-line rule:line-length
          CODEX_AUTH_JSON: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && secrets.CODEX_AUTH_JSON || '' }}
        run: scripts/ci/restore-codex-session.sh

      - name: Run tier-2 invocation smoke
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TIER: '2'
          # Credentials are forwarded, never defaulted: an unset secret must
          # reach the suite as unset so it reports a visible skip naming the
          # missing link, rather than a pass. Each lane carries exactly the
          # credential the dogfood review uses, so a green Tier 2 proves the
          # credential the review will actually run on.
          #
          # anthropic: the subscription OAuth token, not ANTHROPIC_API_KEY —
          # that account's balance is depleted, and its mere presence would
          # flip the CLI to bare (API-key) mode. LINTRO_CLI_BARE=never pins
          # the decision regardless (#1838/#1859).
          #
          # The dogfood review has two anthropic configurations and picks
          # between them on ZAI_BASE_URL (#2472 lane 2): with the variable
          # empty the pinned `claude` binary talks to api.anthropic.com on the
          # subscription token; with it set, the same binary is pointed at the
          # z.ai gateway and authenticated with ZAI_AUTH_TOKEN instead. The
          # three expressions below are the dogfood ones with the provider
          # selection swapped for this job's gate — Tier 2 has no provider
          # variable, it always drives all three lanes — so whichever
          # configuration the review is in, Tier 2 proves that credential and
          # never both at once. tests/unit/test_workflow_wiring.py derives
          # them from ai-review.yml and fails if the two drift.
          # yamllint disable-line rule:line-length
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && vars.ZAI_BASE_URL == '') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          ANTHROPIC_BASE_URL: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && vars.ZAI_BASE_URL || '' }}
          # yamllint disable-line rule:line-length
          ANTHROPIC_AUTH_TOKEN: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && vars.ZAI_BASE_URL && secrets.ZAI_AUTH_TOKEN || '' }}
          LINTRO_CLI_BARE: 'never'
          # Keep the claude CLI's egress to api.anthropic.com only, and keep
          # the image's pinned CLI pinned — an autoupdate would swap the very
          # binary this tier exists to verify.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          # The dogfood review's model overlay (#2471/#1971), mirrored so a
          # `gh variable set LINTRO_AI_MODEL` experiment reaches both jobs and
          # Tier 2 exercises the model the review will actually run on rather
          # than only each provider's default. Empty when the variable is
          # unset, which is the default and leaves every lane on the default
          # the provider resolves for its credential (#2537).
          # yamllint disable-line rule:line-length
          LINTRO_AI_MODEL: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && vars.LINTRO_AI_MODEL || '' }}
          # cursor: the same API key the dogfood cursor lane uses.
          # yamllint disable-line rule:line-length
          CURSOR_API_KEY: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && secrets.CURSOR_API_KEY || '' }}
          # openai: no key here on purpose — the lane authenticates through
          # the session restored by the step above.
        run: scripts/ci/run-ai-contract-tests.sh
