---
name: AI - CLI Contract Tests

# Catch agent-CLI drift before it reaches a user's review (issue #1614, epic
# #1609). lintro's `--transport cli` providers shell out to `claude`, `codex` and
# Cursor's `agent`, all of which move their flag surfaces independently of lintro.
# When @anthropic-ai/claude-code 2.1.218 removed `--json-schema-name`, every CLI
# review broke and CI never noticed (#1611) — this workflow is what would have.
#
# Two tiers, split by cost:
#
#   Tier 1 (every PR + push) — flag surface. Runs `--version` and `--help`
#     only, so it needs no credential and spends no quota. Free enough to be a
#     required check.
#   Tier 2 (manual only) — real invocation. Walks presence -> liveness ->
#     invoke per provider and spends quota, so it stays off the PR hot path.
#
# Tier 2 is MANUAL ONLY since #2600. It used to run on a weekly cron, where it
# failed every Monday from 2026-08-10 on an exhausted prepaid balance and
# reached nobody: it gates nothing, and a scheduled failure is a red X in a run
# list. Its credentials are subscription- and session-bound, so they cannot be
# kept green by design. The weekly provider signal now comes from
# `ai-provider-api-smoke.yml`, which tests the API path (base URL, key, model),
# reports a commit status on main and files the error on the tracker. Drift
# between manual Tier 2 runs is accepted.
#
# NO PATH FILTER, deliberately. A path-filtered required check never reports on
# the PRs it filters out, and those PRs then hang forever in the merge queue
# waiting for a check that will never arrive (#1196). Tier 1 pulls one image and
# runs three help probes, which is cheap enough to run unconditionally so this can
# safely be made required.
#
# Both tiers run inside the digest-pinned lintro-ai-tools image resolved from the
# root Dockerfile's `aitools` stage, so they verify exactly the CLI versions the
# released `ai` variant ships — and there is only ever one pin site to bump.

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Required before adding the Tier 1 context to checks-py-lintro (#1119 /
  # #1196): a merge-queue ruleset would otherwise wait forever for a check that
  # this workflow never schedules.
  merge_group:
    types: [checks_requested]
  # No `schedule:` (#2600). The cron that used to live here only ever reddened
  # Tier 2, invisibly; the weekly live signal moved to ai-provider-api-smoke.yml
  # and Tier 2 became dispatch-only. Tier 1 runs on every PR, so it loses
  # nothing by losing a weekly repeat of itself.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-contract-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tier1-flag-surface:
    name: 🧾 AI CLI Flag Surface (Tier 1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the contract suite and the image pin
      packages: read # pull the pinned lintro-ai-tools image from GHCR
    # Pull + uv sync + three help probes; 15 fails a stalled run fast.
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned lintro-ai-tools image
        id: image
        # Single pin site: the digest lives in the root Dockerfile's `aitools`
        # stage and is Renovate-managed there. Copying it here would drift.
        run: |
          echo "ref=$(python3 scripts/ci/ai_tools_image_pin.py)" >>"$GITHUB_OUTPUT"

      - name: Run tier-1 contract tests
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TIER: '1'
        run: scripts/ci/run-ai-contract-tests.sh

  lane:
    name: Resolve review lane
    # Secret-free. Reads the committed manifest from the dispatched ref and
    # publishes the chain and the union of every declared row's hosts: Tier 2
    # drives every lane in one job, so its egress is derived from the
    # manifest by the same resolver the dogfood review uses (ADR-0011 A).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # sparse checkout of the manifest and the resolver
    timeout-minutes: 5
    outputs:
      chain: ${{ steps.resolve.outputs.chain }}
      lane: ${{ steps.resolve.outputs.lane }}
      egress-all: ${{ steps.resolve.outputs.egress_all }}
      endpoint: ${{ steps.resolve.outputs.endpoint }}
      first-party: ${{ steps.resolve.outputs.first_party }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout the manifest and the resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/ai_review_lanes.json
            scripts/ci/resolve_review_lanes.py
          sparse-checkout-cone-mode: false

      - name: Resolve the chain from the manifest
        id: resolve
        run: python3 -I scripts/ci/resolve_review_lanes.py --format github

  tier2-invocation-smoke:
    name: 🔥 AI CLI Invocation Smoke (Tier 2, manual only)
    # Manual only: this tier spends provider quota, and #2600 removed the cron
    # that used to run it unwatched.
    if: github.event_name == 'workflow_dispatch'
    # Gated on the free tier: there is no point spending quota to discover a
    # problem `--help` already proved. The lane job supplies the egress.
    needs: [tier1-flag-surface, lane]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the contract suite and the image pin
      packages: read # pull the pinned lintro-ai-tools image from GHCR
    timeout-minutes: 25
    # Trusted-event gate for the provider credentials (#2481). Tier 2 runs on
    # dispatch only today, and the `if:` above keeps it there; the
    # same-repository head clause is what keeps the secrets safe when the
    # review round-trip (#2515) adds a `pull_request` trigger, because a fork
    # head would then evaluate to false and every secret below resolves to ''.
    # Job-level env carries only this boolean — never a secret — so the
    # credentials stay scoped to the two steps that need them.
    #
    # Deliberately NOT pinned to refs/heads/main. `workflow_dispatch` requires
    # write access, so the event cannot be reached from a fork or by an
    # untrusted actor. A
    # branch dispatch is the point: #2481 requires a green Tier 2 on the PR
    # branch before the wiring merges, and main-only would make dispatch a
    # no-op tier that can never prove a change. The trust boundary here is
    # write access, which is the same boundary that governs main itself.
    env:
      # yamllint disable-line rule:line-length
      AI_CONTRACT_SECRETS_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden Runner
        # Every host any declared lane can reach, derived from the manifest by
        # the lane job (ADR-0011 A): the dogfood review allowlists its chain's
        # hosts; Tier 2 drives every lane in one job, so it allowlists the
        # union over every declared row — otherwise a lane that authenticates
        # in dogfood dies here on egress instead. The static entries are
        # GitHub, GHCR and PyPI. Exact hosts only: the resolver refuses a
        # wildcard host, and this job allows none.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            ${{ needs.lane.outputs.egress-all }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned lintro-ai-tools image
        id: image
        run: |
          echo "ref=$(python3 scripts/ci/ai_tools_image_pin.py)" >>"$GITHUB_OUTPUT"

      - name: Restore Codex subscription session
        id: codex-session
        # A corrupt secret must cost one lane, not three. The script rejects a
        # CODEX_AUTH_JSON that is not valid base64 of a JSON object and exits
        # 1, deleting the partial file; without continue-on-error that step
        # failure ends the job, and the anthropic and cursor lanes never run.
        # With it, the run reaches the smoke step with no session, the codex
        # lane reports link 3 of 3 unauthenticated, and the job still goes red
        # — the verdict stays with the step that owns it. This is the one
        # step here allowed to swallow its own failure, asserted as such in
        # tests/scripts/test_ai_contract_tests_workflow.py.
        continue-on-error: true
        # Same credential and the same script as the dogfood openai lane
        # (#2472): decode CODEX_AUTH_JSON into $HOME/.codex/auth.json. Codex
        # has no OAuth-token env var, and CODEX_API_KEY would bill metered API
        # credits instead of the ChatGPT-plan subscription. The runner script
        # mounts that directory into the contract container as CODEX_HOME.
        # Injected after
        # the checkout, like dogfood does. An unset secret warns and exits 0 —
        # the tier then reports an unauthenticated codex lane, never a pass.
        env:
          # yamllint disable-line rule:line-length
          CODEX_AUTH_JSON: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && secrets.CODEX_AUTH_JSON || '' }}
        run: scripts/ci/restore-codex-session.sh

      - name: Run tier-2 invocation smoke
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TIER: '2'
          # Credentials are forwarded, never defaulted: an unset secret must
          # reach the suite as unset so it reports a visible skip naming the
          # missing link, rather than a pass. Each lane carries exactly the
          # credential the dogfood review uses, so a green Tier 2 proves the
          # credential the review will actually run on.
          #
          # anthropic: the subscription OAuth token, not ANTHROPIC_API_KEY —
          # that account's balance is depleted, and its mere presence would
          # flip the CLI to bare (API-key) mode. LINTRO_CLI_BARE=never pins
          # the decision regardless (#1838/#1859).
          #
          # The dogfood review's anthropic credential comes from the resolved
          # chain (ADR-0011 A): the claude-subscription lane carries the
          # subscription token against api.anthropic.com, and the declared
          # zai-glm-gateway lane carries ZAI_AUTH_TOKEN as ANTHROPIC_AUTH_TOKEN
          # against its endpoint. The expressions below are the dogfood ones
          # with the chain-membership clause joined by this job's gate, and
          # the gateway endpoint is the lane row's, not a variable's. Tier 2
          # has no provider to select — it always drives every lane — so
          # whichever lane is active, Tier 2 proves that credential.
          # tests/unit/test_workflow_wiring.py derives them from ai-review.yml
          # and the manifest and fails if they drift.
          # yamllint disable-line rule:line-length
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && contains(fromJSON(needs.lane.outputs.chain), 'claude-subscription')) && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # yamllint disable-line rule:line-length
          ANTHROPIC_BASE_URL: ${{ (env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && needs.lane.outputs.first-party == 'false') && needs.lane.outputs.endpoint || '' }}
          # yamllint disable-line rule:line-length
          ANTHROPIC_AUTH_TOKEN: ${{ (env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && needs.lane.outputs.lane == 'zai-glm-gateway') && secrets.ZAI_AUTH_TOKEN || '' }}
          LINTRO_CLI_BARE: 'never'
          # Keep the claude CLI's egress to api.anthropic.com only, and keep
          # the image's pinned CLI pinned — an autoupdate would swap the very
          # binary this tier exists to verify.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_AUTOUPDATER: '1'
          # No model overlay: the dogfood review takes its model from the lane
          # row, and one value cannot serve the three lanes this job drives in
          # one container, so each lane resolves its own default (for codex,
          # the CLI's own under a subscription session, #2537).
          # cursor: the same API key the dogfood cursor lane uses.
          # yamllint disable-line rule:line-length
          CURSOR_API_KEY: ${{ env.AI_CONTRACT_SECRETS_ALLOWED == 'true' && secrets.CURSOR_API_KEY || '' }}
          # openai: no key here on purpose — the lane authenticates through
          # the session restored by the step above.
        run: scripts/ci/run-ai-contract-tests.sh
