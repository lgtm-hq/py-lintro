---
name: Maintenance - GHCR Registry Cleanup
# Weekly cleanup of untagged container images from GitHub Container Registry.
# Reduces storage costs and maintains clean registry state.
#
# IMPORTANT: Multi-arch images have architecture-specific manifests that appear
# as "untagged" but are referenced by the main manifest index. The lgtm-ci
# reusable collects referenced digests and skips prune when collection fails.

'on':
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no deletions)'
        required: false
        default: false
        type: boolean
      min_age_days:
        description: >-
          Minimum age in days before pruning untagged package versions
          (py-lintro / py-lintro-base). Scheduled runs always use 7.
        required: false
        default: 7
        type: number
      sweep_min_age_days:
        description: >-
          Minimum age in days before sweeping ephemeral ci-<run_id> tags.
          Default 91 = Actions' 90-day run retention plus one day so the
          push-time updated_at cutoff cannot precede the completion-based
          rerun window (#1138). Scheduled runs always use 91.
        required: false
        default: 91
        type: number
      candidate_min_age_days:
        description: >-
          Minimum age in days before sweeping tools-candidate-pr<n>-<sha> tags
          whose Renovate PR is still open. Scheduled runs always use 14.
        required: false
        default: 14
        type: number

concurrency:
  group: lintro-tools-registry
  cancel-in-progress: false

permissions: {}

jobs:
  prune-untagged:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ghcr-cleanup.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    permissions:
      contents: read # checkout repo and lgtm-ci tooling sparse checkout
      packages: write # delete untagged GHCR package versions via Packages API
    with:
      package-name: py-lintro
      # Bare expression, never a block scalar: a folded `>-` turns the number
      # into the string '7' and the number-typed input rejects the call at plan
      # time ("Unexpected value '7'"), which is how the prune legs vanished
      # from run 34754126197 (#2603). A number-typed workflow_dispatch input
      # also arrives as a string, so fromJSON() coerces it (runs 34766253077,
      # 34766393903); `|| '7'` covers the scheduled path, where the dispatch
      # input is empty — scheduled runs always prune at 7 days.
      # yamllint disable-line rule:line-length
      min-age-days: ${{ fromJSON(inputs.min_age_days || '7') }}
      # Bare number literal, never a string: the reusable's default 10-minute
      # job timeout cancelled the py-lintro prune leg mid-enumeration (run
      # 34774902409), so the caller forwards a raised budget (#2603).
      timeout-minutes: 30
      dry-run: ${{ inputs.dry_run == true }}
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
      runner-image: ubuntu-24.04
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Age-based sweep of ephemeral CI tags (ci-<run_id>) left behind by
  # docker-ci.yml. These are deferred (not deleted on run completion) so that
  # partial reruns can still pull the run-scoped image — see issue #1138.
  sweep-ci-tags:
    name: 🧹 Sweep ephemeral CI tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout sweep-ci-ghcr-tags.sh
      packages: write # delete aged-out CI tags from GHCR
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep aged-out CI tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 91d = Actions' 90-day run retention + 1d buffer: package
          # updated_at is push time (docker-build), while Actions retention
          # is completion-based — without the buffer a late partial rerun
          # near day 90 could hit an already-swept ci-<run_id> (#1138).
          # Dedicated dispatch input — do not share min_age_days with the
          # untagged prune jobs (those default to 7).
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 91 || inputs.sweep_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: scripts/ci/maintenance/sweep-ci-ghcr-tags.sh

  # Age-based sweep of per-commit tags (sha-<commit>) published alongside
  # releases. Unbounded growth here is not just storage: the tag list is what
  # Renovate's docker datasource must enumerate to find newer versions, and
  # at >1000 tags the first page held neither the pinned release nor any
  # recent one — over half of it was sha-* (#1590).
  #
  # Reuses the ci-* sweeper via TAG_PREFIX. Its safety rule does the heavy
  # lifting: only versions whose EVERY tag matches the prefix are candidates,
  # so a release version carrying both sha-<commit> and 0.91.49 is skipped
  # and can never be deleted by this job.
  sweep-sha-tags:
    name: 🧹 Sweep aged commit tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout sweep-ci-ghcr-tags.sh
      packages: write # delete aged-out CI tags from GHCR
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep aged-out commit tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: sha-
          # Same 91-day window as the ci-* sweep. sha-<commit> tags have no
          # rerun-retention constraint of their own, but a shared floor keeps
          # one knob instead of two and stays clear of the #1138 hazard.
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 91 || inputs.sweep_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: scripts/ci/maintenance/sweep-ci-ghcr-tags.sh

  sweep-tools-candidates:
    name: 🧹 Sweep tools candidate tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep stale candidate versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 14 || inputs.candidate_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: python3 scripts/ci/maintenance/sweep-tools-candidate-tags.py

  prune-untagged-base:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ghcr-cleanup.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    permissions:
      contents: read # checkout repo and lgtm-ci tooling sparse checkout
      packages: write # delete untagged GHCR package versions via Packages API
    with:
      package-name: py-lintro-base
      # Bare expression, never a block scalar: a folded `>-` turns the number
      # into the string '7' and the number-typed input rejects the call at plan
      # time ("Unexpected value '7'"), which is how the prune legs vanished
      # from run 34754126197 (#2603). A number-typed workflow_dispatch input
      # also arrives as a string, so fromJSON() coerces it (runs 34766253077,
      # 34766393903); `|| '7'` covers the scheduled path, where the dispatch
      # input is empty — scheduled runs always prune at 7 days.
      # yamllint disable-line rule:line-length
      min-age-days: ${{ fromJSON(inputs.min_age_days || '7') }}
      # Bare number literal, never a string: the reusable's default 10-minute
      # job timeout cancelled the py-lintro prune leg mid-enumeration (run
      # 34774902409), so the caller forwards a raised budget (#2603).
      timeout-minutes: 30
      dry-run: ${{ inputs.dry_run == true }}
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
      runner-image: ubuntu-24.04
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Visibility contract (#2598): a scheduled failure is a red X in a run list
  # no human reads, which is how the prune failed for five weeks (#2603). The
  # verdict goes onto main's HEAD as one commit status so the checks tab shows
  # it, and a failure opens or pings the deduplicated main-failure issue.
  report-status:
    name: 📣 Report the cleanup verdict on main
    needs:
      - prune-untagged
      - sweep-ci-tags
      - sweep-sha-tags
      - sweep-tools-candidates
      - prune-untagged-base
    # always(): the status is the whole point of the job. A failure that
    # skipped it would be invisible, which is the failure mode being removed.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout report-workflow-commit-status.sh
      statuses: write # report ghcr-cleanup on main's HEAD
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the commit status on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: ghcr-cleanup
          # yamllint disable-line rule:line-length
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: scripts/ci/maintenance/report-workflow-commit-status.sh

  notify-failure:
    needs:
      - prune-untagged
      - sweep-ci-tags
      - sweep-sha-tags
      - sweep-tools-candidates
      - prune-untagged-base
    # Main-only: a manual dispatch from a feature branch must not open or
    # ping the tracker. Deduplicated failure issue, the same mechanism
    # dogfood-nightly and the provider smoke use: the first failure opens
    # `fix(ci): main workflow failed: ghcr-cleanup`, later ones comment on
    # it. The lane label keeps a prune failure distinguishable from a generic
    # main failure at a glance.
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    permissions:
      actions: read # read workflow/job metadata for the failure context
      contents: read # repository context for the issue body
      issues: write # open or ping the deduplicated failure issue
    with:
      workflow-key: ghcr-cleanup
      failure-issue-labels: 'bug,ci,infrastructure,ghcr-cleanup'
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
