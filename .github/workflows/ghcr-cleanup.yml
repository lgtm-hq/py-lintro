---
name: Maintenance - GHCR Registry Cleanup
# Weekly cleanup of untagged container images from GitHub Container Registry.
# Reduces storage costs and maintains clean registry state.
#
# IMPORTANT: Multi-arch images have architecture-specific manifests that appear
# as "untagged" but are referenced by the main manifest index. The lgtm-ci
# reusable collects referenced digests and skips prune when collection fails.

'on':
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no deletions)'
        required: false
        default: false
        type: boolean
      min_age_days:
        description: >-
          Minimum age in days before pruning untagged package versions
          (py-lintro / py-lintro-base). Scheduled runs always use 7.
        required: false
        default: 7
        type: number
      sweep_min_age_days:
        description: >-
          Minimum age in days before sweeping ephemeral ci-<run_id> tags.
          Default 91 = Actions' 90-day run retention plus one day so the
          push-time updated_at cutoff cannot precede the completion-based
          rerun window (#1138). Scheduled runs always use 91.
        required: false
        default: 91
        type: number
      candidate_min_age_days:
        description: >-
          Minimum age in days before sweeping tools-candidate-pr<n>-<sha> tags
          whose Renovate PR is still open. Scheduled runs always use 14.
        required: false
        default: 14
        type: number

concurrency:
  group: lintro-tools-registry
  cancel-in-progress: false

permissions: {}

jobs:
  prune-untagged:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ghcr-cleanup.yml@eb01982e334eaa7599709a0f767d97afbb015303 # v0.69.1
    permissions:
      contents: read # checkout repo and lgtm-ci tooling sparse checkout
      packages: write # delete untagged GHCR package versions via Packages API
    with:
      package-name: py-lintro
      min-age-days: >-
        ${{ github.event_name != 'workflow_dispatch' && 7 || inputs.min_age_days }}
      dry-run: ${{ inputs.dry_run == true }}
      tooling-ref: 'eb01982e334eaa7599709a0f767d97afbb015303' # v0.69.1
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
      runner-image: ubuntu-24.04
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Age-based sweep of ephemeral CI tags (ci-<run_id>) left behind by
  # docker-ci.yml. These are deferred (not deleted on run completion) so that
  # partial reruns can still pull the run-scoped image — see issue #1138.
  sweep-ci-tags:
    name: 🧹 Sweep ephemeral CI tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout sweep-ci-ghcr-tags.sh
      packages: write # delete aged-out CI tags from GHCR
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep aged-out CI tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 91d = Actions' 90-day run retention + 1d buffer: package
          # updated_at is push time (docker-build), while Actions retention
          # is completion-based — without the buffer a late partial rerun
          # near day 90 could hit an already-swept ci-<run_id> (#1138).
          # Dedicated dispatch input — do not share min_age_days with the
          # untagged prune jobs (those default to 7).
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 91 || inputs.sweep_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: scripts/ci/maintenance/sweep-ci-ghcr-tags.sh

  # Age-based sweep of per-commit tags (sha-<commit>) published alongside
  # releases. Unbounded growth here is not just storage: the tag list is what
  # Renovate's docker datasource must enumerate to find newer versions, and
  # at >1000 tags the first page held neither the pinned release nor any
  # recent one — over half of it was sha-* (#1590).
  #
  # Reuses the ci-* sweeper via TAG_PREFIX. Its safety rule does the heavy
  # lifting: only versions whose EVERY tag matches the prefix are candidates,
  # so a release version carrying both sha-<commit> and 0.91.49 is skipped
  # and can never be deleted by this job.
  sweep-sha-tags:
    name: 🧹 Sweep aged commit tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout sweep-ci-ghcr-tags.sh
      packages: write # delete aged-out CI tags from GHCR
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep aged-out commit tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: sha-
          # Same 91-day window as the ci-* sweep. sha-<commit> tags have no
          # rerun-retention constraint of their own, but a shared floor keeps
          # one knob instead of two and stays clear of the #1138 hazard.
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 91 || inputs.sweep_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: scripts/ci/maintenance/sweep-ci-ghcr-tags.sh

  sweep-tools-candidates:
    name: 🧹 Sweep tools candidate tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep stale candidate versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # yamllint disable-line rule:line-length
          MIN_AGE_DAYS: ${{ github.event_name != 'workflow_dispatch' && 14 || inputs.candidate_min_age_days }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: python3 scripts/ci/maintenance/sweep-tools-candidate-tags.py

  prune-untagged-base:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ghcr-cleanup.yml@eb01982e334eaa7599709a0f767d97afbb015303 # v0.69.1
    permissions:
      contents: read # checkout repo and lgtm-ci tooling sparse checkout
      packages: write # delete untagged GHCR package versions via Packages API
    with:
      package-name: py-lintro-base
      min-age-days: >-
        ${{ github.event_name != 'workflow_dispatch' && 7 || inputs.min_age_days }}
      dry-run: ${{ inputs.dry_run == true }}
      tooling-ref: 'eb01982e334eaa7599709a0f767d97afbb015303' # v0.69.1
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
      runner-image: ubuntu-24.04
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
