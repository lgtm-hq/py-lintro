# SPDX-License-Identifier: MIT
# For license details, see the repository root LICENSE file.
---
name: Nightly - Dogfooding Lint

# Full-repo dogfooding backstop for changed-files PR linting (#1361): PRs
# whose diff has no global lint impact lint only their changed files in
# docker-ci.yml, so cross-file drift (tool updates inside the pinned image,
# environment skew, files nobody touched in a while) could go unnoticed
# between main pushes. This nightly run lints the whole repo on main with
# the image `resolve-image` resolves at run time (#2602 — never a hand-edited
# pin again) and, on failure, opens or pings a deduplicated issue via the
# lgtm-ci main-failure notifier (one open issue per workflow key; repeat
# failures comment on it).
#
# Runner loss is not a regression (#2246, epic #2245). GitHub-side kills
# ("The runner has received a shutdown signal", SIGTERM / exit 143) take the
# lint and skip-gate jobs down mid-run and used to reach the tracker looking
# exactly like a nightly regression. Two things prevent that now: each of
# those jobs has ONE bounded retry that runs only when the primary published
# no verdict, and `classify-failure` decides from the effective (post-retry)
# same-run state whether the tracker hears about the night at all. Everything
# it cannot classify still pings, exactly as before.

'on':
  schedule:
    # Nightly at 02:30 UTC — after the daily merge window, before EU morning.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dogfood-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One run-time resolution feeding every image consumer below (#2602). The
  # nightly used to carry a hand-maintained `py-lintro:<version>@sha256:...`
  # pin at five sites; nothing moved it, so it froze at 0.148.0 while main
  # reached 0.156.x and every night failed on manifest-vs-image mismatches
  # that were pure pin lag. `scripts/ci/resolve-image-digest.sh` prefers the
  # per-commit image docker-ci promoted for THIS run's commit and falls back
  # to the newest published release, reporting the git ref whose manifest that
  # image must be compared against. Image and manifest therefore always
  # describe the same commit, and the digest-lag gate below keeps meaning what
  # it says. Fail-loud: an unresolvable image fails this job, every consumer
  # is skipped, and classify-failure pings the tracker for the lost night.
  resolve-image:
    name: 🏷️ Resolve Dogfood Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the resolver script
      packages: read # read GHCR manifests/labels (no image pull)
    timeout-minutes: 10
    outputs:
      # Always `<repo>@sha256:<digest>` — resolved by digest so every consumer
      # runs the exact bits this job inspected, even if a tag moves mid-run.
      image: ${{ steps.resolve.outputs.image }}
      version: ${{ steps.resolve.outputs.version }}
      # Git ref the image's manifest must be verified against.
      manifest-ref: ${{ steps.resolve.outputs.manifest-ref }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout resolver script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/resolve-image-digest.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve dogfood image
        id: resolve
        env:
          COMMIT_SHA: ${{ github.sha }}
        # The script writes the resolved ref, version, resolution source and
        # manifest ref to the job summary, so a triage hop from the tracker
        # issue to this run answers "which image failed?" without digging.
        run: scripts/ci/resolve-image-digest.sh

  dogfood-full:
    needs: [resolve-image]
    # Same reusable workflow and tool options as the docker-ci.yml full run
    # (dogfooding-lint) so nightly coverage matches the pre-merge gate.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@48cd54fedf9d8baa2636e58b78912cfd297f919a # v0.74.2
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    with:
      tooling-ref: '48cd54fedf9d8baa2636e58b78912cfd297f919a' # v0.74.2
      job-name: '🌙 Nightly Dogfooding Lint'
      # black:timeout=120: the 30s default timed out on the full repo (#2352).
      lintro-tool-options: >-
        pydoclint:timeout=120,black:timeout=120,bandit:timeout=120,prettier:timeout=120,mypy:timeout=120,gitleaks:timeout=120,typos:timeout=120,semgrep:timeout=600,osv_scanner:check_suppressions=false
      egress-policy: block
      # No CI build in this workflow: lint main with the image resolve-image
      # resolved for this run (#2602). Never a literal here — a hand-edited
      # pin is what left the nightly four releases behind the manifest it
      # was checking; tests/unit/test_workflow_wiring.py fails on any
      # `py-lintro:<semver>@sha256:` literal in this file.
      lintro-image: ${{ needs.resolve-image.outputs.image }}

  # Bounded retry (1 attempt) of the full-repo lint, mirroring
  # `dogfooding_lint_retry` in docker-ci.yml (#1313, #2246). It runs only when
  # the primary attempt ended WITHOUT a lint verdict — the signature of a
  # runner-loss kill ("The runner has received a shutdown signal", SIGTERM /
  # exit 143) — so a sporadic kill still yields a real verdict the same night.
  # A genuine verdict (status=failed / exit-code=1) is never retried: it is a
  # regression the tracker must hear about tonight, and re-running it would
  # only burn another 20 minutes to reach the same answer.
  dogfood_full_retry:
    needs: [resolve-image, dogfood-full]
    if: >-
      always() &&
      !cancelled() &&
      (
        needs.dogfood-full.result == 'failure' ||
        needs.dogfood-full.result == 'cancelled'
      ) &&
      (
        needs.dogfood-full.outputs.exit-code == '143' ||
        needs.dogfood-full.outputs.timeout-flake == 'true' ||
        (
          needs.dogfood-full.outputs.status != 'failed' &&
          needs.dogfood-full.outputs.exit-code != '1'
        )
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@48cd54fedf9d8baa2636e58b78912cfd297f919a # v0.74.2
    permissions:
      contents: read
      packages: read # pull lintro-image from GHCR in reusable-quality-lint
    with:
      tooling-ref: '48cd54fedf9d8baa2636e58b78912cfd297f919a' # v0.74.2
      job-name: '🌙 Nightly Dogfooding Lint (retry)'
      # black:timeout=120: the 30s default timed out on the full repo (#2352).
      lintro-tool-options: >-
        pydoclint:timeout=120,black:timeout=120,bandit:timeout=120,prettier:timeout=120,mypy:timeout=120,gitleaks:timeout=120,typos:timeout=120,semgrep:timeout=600,osv_scanner:check_suppressions=false
      egress-policy: block
      # No CI build in this workflow: lint main with the image resolve-image
      # resolved for this run (#2602). Never a literal here — a hand-edited
      # pin is what left the nightly four releases behind the manifest it
      # was checking; tests/unit/test_workflow_wiring.py fails on any
      # `py-lintro:<semver>@sha256:` literal in this file.
      lintro-image: ${{ needs.resolve-image.outputs.image }}

  # Job id unchanged (#2602): classify-failure keys off it and #2246's state
  # table names it, so renaming it for the word "pinned" would cost more than
  # it clarifies.
  verify-pinned-image-tools:
    name: 🔎 Verify Resolved Image Tools
    # Image-vs-manifest drift gate (#1511, epic #1508): the nightly lints with
    # the image resolve-image resolved, and this verifies that image's tools
    # against the manifest of the commit it was BUILT from (#2602). Drift the
    # gate exists for — the manifest declaring a tool the image cannot execute,
    # as in the pip-audit gap of #1505 — still fails the check and opens a
    # deduplicated issue via notify-failure instead of surfacing as a silent
    # dogfooding SKIP. What no longer fails it is pin lag: comparing a frozen
    # release image against main's newer manifest, which is all this gate
    # reported from 2026-09-10 on. Kept in the nightly (not the required
    # docker-ci gate) so drift surfaces loudly without wedging every PR.
    needs: [resolve-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the verifier script + manifest
      packages: read # anonymous/authenticated GHCR pull of the resolved image
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the resolved image was BUILT from, not main (#2602).
          # Verifying a release image against main's manifest is precisely
          # the mismatch that failed this gate every night; against its own
          # commit's manifest a failure means a real image/manifest drift.
          ref: ${{ needs.resolve-image.outputs.manifest-ref }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate version artifacts for manifest verification
        # No-op while the artifacts are committed (#2179); load-bearing once
        # the flip (epic #2176 phase 4) stops committing them.
        run: python3 scripts/ci/generate-tool-versions.py
      - name: Verify resolved image tools against manifest
        env:
          # The same resolved image dogfood-full lints with.
          IMAGE: ${{ needs.resolve-image.outputs.image }}
        run: scripts/ci/verify-image-manifest-tools.sh

  # No-silent-skip gate (#1510, epic #1508): dogfood-full runs an external
  # reusable workflow, so this dedicated job re-derives the structured skip
  # state from the same pinned image and fails when an enabled tool silently
  # skips for a reason not covered by the committed allowlist.
  dogfood-skip-gate:
    name: 🚦 Dogfood No-Silent-Skip Gate
    needs: [resolve-image, dogfood-full]
    # Run even when dogfood-full failed on real issues — a silent skip is an
    # independent regression class — but not when it was cancelled, and not
    # when there is no image to run: an unresolved image would hand the gate
    # an empty LINTRO_IMAGE and fail it for a reason it cannot explain (#2602).
    if: >-
      always() &&
      !cancelled() &&
      needs.resolve-image.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the resolved image from GHCR
    # 30 leaves healthy runs room to complete and fails stalls fast (#1704).
    timeout-minutes: 30
    outputs:
      # Written by scripts/ci/dogfood-skip-gate.sh once the skip check reaches
      # a verdict (#2246). Their ABSENCE is the load-bearing signal: a runner
      # killed mid-lint leaves both empty, which is what distinguishes a night
      # with no coverage from a real non-allowlisted skip.
      status: ${{ steps.skips.outputs.status }}
      exit-code: ${{ steps.skips.outputs.exit-code }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            static.rust-lang.org:443
            bun.sh:443
            astral.sh:443
            releases.astral.sh:443
            sh.rustup.rs:443
            deb.debian.org:80
            registry.npmjs.org:443
            crates.io:443
            static.crates.io:443
            index.crates.io:443
            semgrep.dev:443
            metrics.semgrep.dev:443
            api.osv.dev:443
            api.deps.dev:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for silent tool skips
        id: skips
        env:
          # Same tool coverage as dogfood-full so skip behaviour matches.
          # black:timeout=120: the 30s default timed out on the full repo (#2352).
          TOOL_OPTIONS: >-
            pydoclint:timeout=120,black:timeout=120,bandit:timeout=120,prettier:timeout=120,mypy:timeout=120,gitleaks:timeout=120,typos:timeout=120,semgrep:timeout=600,osv_scanner:check_suppressions=false
          # The same resolved image dogfood-full lints with (#2602).
          LINTRO_IMAGE: ${{ needs.resolve-image.outputs.image }}
        # Memory trace (#1761): this job is repeatedly killed mid-lint with
        # "runner has received a shutdown signal" + container EOF, and memory
        # pressure is the leading hypothesis. Samples stream into this step's
        # log rather than an artifact, because a runner death skips later
        # steps and would discard the evidence.
        run: >-
          scripts/ci/run-with-memory-trace.sh
          scripts/ci/dogfood-skip-gate.sh

  # Bounded retry (1 attempt) of the gate above (#2246). Same job, same
  # image, same tool options — GitHub Actions has no job-level retry, and the
  # kills this exists to absorb take the whole runner down mid-step, so a
  # second job is the only way to reach a verdict the same night. It runs only
  # when the primary gate published no verdict at all (its `status` output is
  # written by scripts/ci/dogfood-skip-gate.sh once the skip check completes),
  # so a real non-allowlisted skip is reported immediately, never re-run.
  dogfood_skip_gate_retry:
    name: 🚦 Dogfood No-Silent-Skip Gate (retry)
    needs: [resolve-image, dogfood-skip-gate]
    if: >-
      always() &&
      !cancelled() &&
      (
        needs.dogfood-skip-gate.result == 'failure' ||
        needs.dogfood-skip-gate.result == 'cancelled'
      ) &&
      needs.dogfood-skip-gate.outputs.status == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the resolved image from GHCR
    # 30 leaves healthy runs room to complete and fails stalls fast (#1704).
    timeout-minutes: 30
    outputs:
      # Written by scripts/ci/dogfood-skip-gate.sh once the skip check reaches
      # a verdict (#2246). Their ABSENCE is the load-bearing signal: a runner
      # killed mid-lint leaves both empty, which is what distinguishes a night
      # with no coverage from a real non-allowlisted skip.
      status: ${{ steps.skips.outputs.status }}
      exit-code: ${{ steps.skips.outputs.exit-code }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            static.rust-lang.org:443
            bun.sh:443
            astral.sh:443
            releases.astral.sh:443
            sh.rustup.rs:443
            deb.debian.org:80
            registry.npmjs.org:443
            crates.io:443
            static.crates.io:443
            index.crates.io:443
            semgrep.dev:443
            metrics.semgrep.dev:443
            api.osv.dev:443
            api.deps.dev:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for silent tool skips
        id: skips
        env:
          # Same tool coverage as dogfood-full so skip behaviour matches.
          # black:timeout=120: the 30s default timed out on the full repo (#2352).
          TOOL_OPTIONS: >-
            pydoclint:timeout=120,black:timeout=120,bandit:timeout=120,prettier:timeout=120,mypy:timeout=120,gitleaks:timeout=120,typos:timeout=120,semgrep:timeout=600,osv_scanner:check_suppressions=false
          # The same resolved image dogfood-full lints with (#2602).
          LINTRO_IMAGE: ${{ needs.resolve-image.outputs.image }}
        # Memory trace (#1761): this job is repeatedly killed mid-lint with
        # "runner has received a shutdown signal" + container EOF, and memory
        # pressure is the leading hypothesis. Samples stream into this step's
        # log rather than an artifact, because a runner death skips later
        # steps and would discard the evidence.
        run: >-
          scripts/ci/run-with-memory-trace.sh
          scripts/ci/dogfood-skip-gate.sh

  # Classify before notifying (#2246, epic #2245). The nightly tracker (#2212)
  # is a human triage queue, so a GitHub-side runner kill must not land on it
  # looking like a nightly regression. Classification is same-run — job results
  # and the jobs' own outputs, never Actions API logs, whose ingestion race is
  # what #2238 exists to fix — and reuses the PR path's signature set through
  # scripts/ci/is-infra-flake-failure.sh rather than duplicating it.
  classify-failure:
    name: 🧭 Classify Nightly Failure
    needs:
      - resolve-image
      - dogfood-full
      - dogfood_full_retry
      - verify-pinned-image-tools
      - dogfood-skip-gate
      - dogfood_skip_gate_retry
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: read # sparse checkout of the classifier scripts below
    timeout-minutes: 5
    outputs:
      notify: ${{ steps.classify.outputs.notify }}
      action-required: ${{ steps.classify.outputs.action-required }}
      annotation: ${{ steps.classify.outputs.annotation }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
      - name: Checkout classifier scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/classify-nightly-dogfood-failure.py
            scripts/ci/is-infra-flake-failure.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify nightly failure
        id: classify
        env:
          LINT_RESULT: ${{ needs.dogfood-full.result }}
          LINT_STATUS: ${{ needs.dogfood-full.outputs.status }}
          LINT_EXIT_CODE: ${{ needs.dogfood-full.outputs.exit-code }}
          # Tool-execution timeout evidence from the attempt's OWN report
          # (#1653, lgtm-ci#746) — the same input the PR gate absorbs on.
          LINT_TIMEOUT_FLAKE: ${{ needs.dogfood-full.outputs.timeout-flake }}
          LINT_TIMED_OUT_TOOLS: >-
            ${{ needs.dogfood-full.outputs.timed-out-tools }}
          LINT_RETRY_RESULT: ${{ needs.dogfood_full_retry.result }}
          LINT_RETRY_STATUS: ${{ needs.dogfood_full_retry.outputs.status }}
          LINT_RETRY_EXIT_CODE: >-
            ${{ needs.dogfood_full_retry.outputs.exit-code }}
          LINT_RETRY_TIMEOUT_FLAKE: >-
            ${{ needs.dogfood_full_retry.outputs.timeout-flake }}
          LINT_RETRY_TIMED_OUT_TOOLS: >-
            ${{ needs.dogfood_full_retry.outputs.timed-out-tools }}
          SKIP_GATE_RESULT: ${{ needs.dogfood-skip-gate.result }}
          SKIP_GATE_STATUS: ${{ needs.dogfood-skip-gate.outputs.status }}
          SKIP_GATE_EXIT_CODE: >-
            ${{ needs.dogfood-skip-gate.outputs.exit-code }}
          SKIP_GATE_RETRY_RESULT: ${{ needs.dogfood_skip_gate_retry.result }}
          SKIP_GATE_RETRY_STATUS: >-
            ${{ needs.dogfood_skip_gate_retry.outputs.status }}
          SKIP_GATE_RETRY_EXIT_CODE: >-
            ${{ needs.dogfood_skip_gate_retry.outputs.exit-code }}
          VERIFY_RESULT: ${{ needs.verify-pinned-image-tools.result }}
          # A night whose image could not be resolved ran no lint at all;
          # that coverage gap must reach the tracker, not pass silently.
          RESOLVE_RESULT: ${{ needs.resolve-image.result }}
        run: python3 scripts/ci/classify-nightly-dogfood-failure.py

  notify-failure:
    needs: [classify-failure]
    # Main-only: a manual dispatch from a feature branch must not open or
    # ping the main-failure issue for the dogfood-nightly key. Fires on the
    # EFFECTIVE (post-retry) verdict from classify-failure, so a full lint or
    # no-silent-skip regression still pings while a runner kill the retry
    # answered does not (#2246). Fails closed twice over: the classifier pings
    # on anything it cannot classify, and a classifier job that did not itself
    # succeed pings regardless of its (missing) output.
    if: >-
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.classify-failure.outputs.notify == 'true' ||
        needs.classify-failure.result != 'success'
      )
    # Deduplicated failure issue (same mechanism as the release workflows):
    # first failure opens `fix(ci): main workflow failed: dogfood-nightly`,
    # repeat failures comment on the open issue instead of piling up.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@48cd54fedf9d8baa2636e58b78912cfd297f919a # v0.74.2
    permissions:
      actions: read # read workflow/job metadata for the failure context
      contents: read # repository context for the issue body
      issues: write # open or ping the deduplicated failure issue
    with:
      workflow-key: dogfood-nightly
      tooling-ref: '48cd54fedf9d8baa2636e58b78912cfd297f919a' # v0.74.2
