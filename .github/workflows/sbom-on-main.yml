---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Concurrency: pull_request runs share one group per PR and cancel the
# superseded head. Every push, merge_group, schedule or manual run gets its own
# group (run_id + run_attempt), so it is never cancelled or replaced; see
# .github/workflows/README.md "Concurrency".
concurrency:
  group: >-
    sbom-main-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number
    || github.run_id }}-${{ github.event_name == 'pull_request' && 'pr' ||
    github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '8a48e818c43efe4ac3b2669b2be31bee0b99cb15' # v0.98.7
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: sbom
    permissions:
      # read: SBOM generation, vuln scan and attestation only read the repo.
      # The contents:write release-asset upload moved out to
      # reusable-sbom-release-upload.yml upstream (lgtm-ci#770), so every job
      # in reusable-sbom.yml now declares contents: read.
      contents: read
      security-events: write
      id-token: write
      attestations: write
