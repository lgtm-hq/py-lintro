---
name: Security - SBOM Generation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-main-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: '2097a900753e3e5ad0e336483501b278e99855ae' # v0.78.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: sbom
    permissions:
      # read: SBOM generation, vuln scan and attestation only read the repo.
      # The contents:write release-asset upload moved out to
      # reusable-sbom-release-upload.yml upstream (lgtm-ci#770), so every job
      # in reusable-sbom.yml now declares contents: read.
      contents: read
      security-events: write
      id-token: write
      attestations: write
