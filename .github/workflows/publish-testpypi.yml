---
name: Publish - TestPyPI Staging

# Layout: lgtm-ci docs/python-release-publish.md (v0.45.1+)

'on':
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-build:
    name: Build Python distribution
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@9c92a06c66cbce667a043eb532e1e54537369bc1 # v0.63.2
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
    with:
      python-version: '3.14'
      verify-tag-version: false
      ensure-tag-on-default-branch: false
      artifact-name: python-dist
      tooling-ref: '9c92a06c66cbce667a043eb532e1e54537369bc1' # v0.63.2
      egress-policy: block
      egress-preset: pypi
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the pypi preset baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        test.pypi.org:443
        upload.pypi.org:443
        upload.test.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443

  pypi-upload:
    name: Upload to TestPyPI
    needs: [pypi-build]
    runs-on: ubuntu-latest
    # Must match TestPyPI trusted publisher environment (same pattern as production
    # `environment: pypi`). Auto-created in GitHub if missing.
    environment: testpypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for TestPyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            test.pypi.org:443
            upload.test.pypi.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@9c92a06c66cbce667a043eb532e1e54537369bc1 # v0.63.2
        with:
          artifact-name: python-dist
          python-version: '3.14'
          tooling-ref: '9c92a06c66cbce667a043eb532e1e54537369bc1' # v0.63.2
      - name: Upload to TestPyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*
