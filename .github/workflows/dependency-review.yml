---
name: Security - Dependency Review

'on':
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

# Concurrency: pull_request runs share one group per PR and cancel the
# superseded head. Every push, merge_group, schedule or manual run gets its own
# group (run_id + run_attempt), so it is never cancelled or replaced; see
# .github/workflows/README.md "Concurrency".
concurrency:
  group: >-
    dependency-review-${{ github.workflow_ref }}-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number
    || github.run_id }}-${{ github.event_name == 'pull_request' && 'pr' ||
    github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@bfeaec696ae5831fb369c8840cdf0df401fd8f8b # v0.91.1
    with:
      fail-on-severity: high
      tooling-ref: 'bfeaec696ae5831fb369c8840cdf0df401fd8f8b' # v0.91.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: scorecard
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the scorecard preset baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      contents: read
      pull-requests: read
