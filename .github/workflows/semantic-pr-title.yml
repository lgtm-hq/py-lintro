---
name: Quality Check - PR Title Validation

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@48cd54fedf9d8baa2636e58b78912cfd297f919a # v0.74.2
    with:
      # Org ruleset (checks-py-lintro): semantic-title / 📝 Validate PR Title
      job-name: '📝 Validate PR Title'
      tooling-ref: '48cd54fedf9d8baa2636e58b78912cfd297f919a' # v0.74.2
      # commitlint on main enforces a 100-character header, and the squash
      # merge appends " (#NNNN)" to the PR title. 90 leaves room for that
      # suffix, so a title that passes here cannot fail post-merge (#2553:
      # 9 of the last 269 main commits did).
      max-length: '90'
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      # post-failure-comment (default: true) upserts failure comments on the PR
      pull-requests: write
