---
name: Build - Platform Binaries
# Build stage of the binary release (#2562): compiles, verifies, smoke-tests
# and attests the three platform binaries and generates the man page, then
# uploads everything as run artifacts. Nothing here writes to a release; the
# publish stage is release-gate and the GitHub Release (#2562). workflow_call
# only: the manual repair dispatch that resolved "latest release" (#2484) is
# gone, and
# recovery is lgtm-hq/lgtm-ci#966.

'on':
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag the binaries are built for'
        required: true
        type: string

permissions: {}

# Exact uv pin so setup-uv's ExactVersionResolver skips resolving "latest"
# via astral-sh/versions uv.ndjson (the dominant tag-publish flake under
# harden-runner). Renovate keeps this in step with docker/tools.Dockerfile's
# ARG UV_VERSION via a customManager on this line; a contract test asserts the
# two stay equal. Artifact URL lookup may still consult the manifest, so the
# continue-on-error retry below remains as belt-and-suspenders (#1487, #1513).
env:
  UV_VERSION: '0.12.19'

jobs:
  generate-man-page:
    name: Generate Man Page
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # read: checkout only. The release upload lives in github-release.
      contents: read

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # This job (unlike the binary builds below) does need the dev group:
      # `click-man` lives there. It runs on Linux, where every dev-group
      # dependency has a wheel, so the source-build trap in #1897 can't bite.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate man page
        run: uv run python scripts/generate-man-page.py --output dist/lintro.1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-man-page
          path: dist/lintro.1
          # 90 days: the policy recovery window (lgtm-hq/lgtm-ci#962), so a
          # publish rerun weeks later still finds what this run built.
          retention-days: 90

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest
    # 25 min compile + 20 min smoke + 15 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test.
    timeout-minutes: 60
    permissions:
      # read: checkout, and the reuse check downloads the published asset to
      # hash it. No contents: write anywhere in this workflow (#2562): the
      # release is only touched by the github-release job of the caller.
      contents: read
      # #2435: the reuse check lists and downloads this run's own sha256
      # artifact (including earlier attempts) to decide whether the asset on
      # the release is one this job already verified.
      actions: read
      # write: OIDC for the Sigstore signing of the build-provenance
      # attestation.
      id-token: write
      # write: upload the attestation to the GitHub attestations API.
      attestations: write
    strategy:
      fail-fast: false
      # #2579: Apple silicon only. The x86_64 leg and the lipo'd universal
      # binary were dropped once the MCP bundle (#2577) made `cryptography` a
      # hard dependency of the binary: it ships no Intel macOS wheel from
      # 49.0.0 on, and GitHub retires the Intel runner in August 2027. Intel
      # Macs install from PyPI through the Homebrew formula instead. The
      # single-entry matrix keeps `matrix.arch` as the one arch spelling the
      # asset, artifact and checksum names below are built from.
      matrix:
        arch:
          - arm64

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          # The sigstore hosts and token.actions.githubusercontent.com serve
          # the attest step (OIDC token, Fulcio certificate, Rekor entry).
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            nuitka.net:443
            token.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            oauth2.sigstore.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after the harden-runner network extension activates
      # can stall past setup-uv's manifest-fetch timeout (macOS especially);
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # #1897: binary builds install the runtime deps, the `mcp` extra and the
      # `build` group, and nothing else. The default `dev` group drags in the
      # test stack, which a Nuitka binary does not need; keep the sync minimal
      # so a dependency without a wheel for this runner cannot turn into a
      # source build behind the (correctly) blocked crates.io egress. #2577:
      # the extra is what puts the MCP SDK into the binary, so `lintro mcp`
      # works from a release.
      - name: Install dependencies
        run: |
          uv sync --group build --extra mcp --no-default-groups

      # #2435: a rerun of this job used to rebuild from scratch even when the
      # release already carried this job's own verified binary. The step below
      # reuses that asset when its SHA256 matches the sha256 artifact this run
      # produced, and every step it makes redundant is gated on its output.
      # With contents: read the script cannot promote an `<asset>.new` left by
      # an interrupted swap; that case degrades to a rebuild here and the
      # publish stage's own reuse check (contents: write) finishes the swap.
      - name: Check for reusable release asset
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/reuse_release_asset.sh
          "$RELEASE_TAG"
          "lintro-macos-$BUILD_ARCH"
          "sha256-$BUILD_ARCH"
          "dist/nuitka/lintro-macos-$BUILD_ARCH"

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        # #2435: this step also tees a baseline snapshot into its own log, the
        # part that survives a runner kill. The interval samples still reach a
        # human only via Stop memory sampler's replay or the failure artifact.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        # #2435: skipped when the release already carries this job's verified
        # binary.
        if: steps.reuse.outputs.reuse != 'true'
        timeout-minutes: 25
        # `--no-default-groups` and `--extra mcp` are required here too:
        # `uv run` re-syncs the environment and would otherwise reinstall
        # `dev` and drop the SDK.
        run: |
          uv run --no-default-groups --extra mcp python scripts/build/build_macos.py \
            --arch "$BUILD_ARCH" \
            --skip-verify
        env:
          # matrix.arch via env, not template expansion, kept symmetric with
          # the Linux job so the two never drift apart.
          BUILD_ARCH: ${{ matrix.arch }}
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-macos-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        # Safe to skip on reuse: the checksum that authorised the reuse came
        # from a same-run artifact written only after this step and the smoke
        # test passed on an earlier attempt of this same job.
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # Same reuse invariant as Verify binary above.
        if: steps.reuse.outputs.reuse != 'true'
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # matrix.arch reaches the shell via env, not template expansion (same
      # shape as the Build binary step above).
      - name: Finalize binary
        id: sha256
        # On reuse the asset is already at the finalized path and its checksum
        # comes from the reuse step's output.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-macos-$BUILD_ARCH"
          "$BUILD_ARCH"

      # #2562: provenance for the finalized binary, before it leaves this job.
      # Not continue-on-error: an unattested binary must fail the build, not
      # ship. Skipped on reuse because the same-run checksum that authorised
      # the reuse was written only after this step succeeded on the earlier
      # attempt, so the bytes are already attested.
      - name: Attest build provenance
        if: steps.reuse.outputs.reuse != 'true'
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nuitka/lintro-macos-${{ matrix.arch }}

      # Ungated on reuse (#2435) so a later attempt still finds the binary and
      # its checksum among the run artifacts. No `overwrite:` needed: artifacts
      # are per-attempt, so re-uploading a name an earlier attempt already used
      # is not a conflict — run 33996465351 carries two `sha256-linux-x64`
      # artifacts, one per attempt, and the reuse check reads them by run id.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-macos-${{ matrix.arch }}
          path: dist/nuitka/lintro-macos-${{ matrix.arch }}
          # 90 days: the policy recovery window (lgtm-hq/lgtm-ci#962).
          retention-days: 90

      - name: Save SHA256 to file
        env:
          # #2435: Finalize binary is skipped on reuse, so fall back to the
          # checksum the reuse step verified against the release asset.
          # yamllint disable-line rule:line-length
          SHA256: ${{ steps.sha256.outputs.sha256 || steps.reuse.outputs.sha256 }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          echo "$SHA256" > "sha256-$BUILD_ARCH.txt"

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-${{ matrix.arch }}
          path: sha256-${{ matrix.arch }}.txt
          retention-days: 90

  build-linux:
    name: Build Linux Binary
    runs-on: ${{ matrix.runner }}
    # 25 min compile + 20 min smoke + 15 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test.
    timeout-minutes: 60
    permissions:
      # See the macOS job: read-only on the repository and the release.
      contents: read
      # #2435: the reuse check lists and downloads this run's own sha256
      # artifact (including earlier attempts) to decide whether the asset on
      # the release is one this job already verified.
      actions: read
      # write: OIDC for the Sigstore signing of the build-provenance
      # attestation.
      id-token: write
      # write: upload the attestation to the GitHub attestations API.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Harden Runner
        # GitHub's hosted-runner control-plane hosts under githubapp.com
        # (hosted-compute-watchdog-*, hosted-compute-request-orchestrator-*,
        # actions-results-receiver) need no entry here: harden-runner v2.21.1
        # allows *.githubapp.com from GitHub meta. The x64 leg was reclaimed
        # mid-run on 7 of 7 attempts for v0.147.7 while v2.21.0 denied them
        # (#1761, #2339); the literal shard list that fixed it is gone with
        # the wildcards elsewhere (#2488). If a "shutdown signal" kill 15-20
        # minutes into a single matrix leg returns, open an issue and check
        # the harden-runner version before touching this list.
        # The sigstore hosts and token.actions.githubusercontent.com serve
        # the attest step (OIDC token, Fulcio certificate, Rekor entry).
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            nuitka.net:443
            token.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            oauth2.sigstore.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after harden-runner's egress filtering activates
      # can stall past setup-uv's manifest-fetch timeout;
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # #1897/#2577: kept in lockstep with the macOS job above - binary builds
      # never install the dev test stack, and always the `mcp` extra.
      - name: Install dependencies
        run: |
          uv sync --group build --extra mcp --no-default-groups

      # #2435: see the macOS job — the reuse check and the `if:` guards it
      # feeds are kept identical across the two jobs.
      - name: Check for reusable release asset
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/reuse_release_asset.sh
          "$RELEASE_TAG"
          "lintro-linux-$BUILD_ARCH"
          "sha256-linux-$BUILD_ARCH"
          "dist/nuitka/lintro-linux-$BUILD_ARCH"

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        # #2435: this step also tees a baseline snapshot into its own log, the
        # part that survives a runner kill. The interval samples still reach a
        # human only via Stop memory sampler's replay or the failure artifact.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        # #2435: skipped when the release already carries this job's verified
        # binary.
        if: steps.reuse.outputs.reuse != 'true'
        timeout-minutes: 25
        run: |
          HOST_ARCH="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          uv run --no-default-groups --extra mcp python scripts/build/build_linux.py \
            --arch "$HOST_ARCH" \
            --skip-verify
        env:
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-linux-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        # Safe to skip on reuse: the checksum that authorised the reuse came
        # from a same-run artifact written only after this step and the smoke
        # test passed on an earlier attempt of this same job.
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # Same reuse invariant as Verify binary above.
        if: steps.reuse.outputs.reuse != 'true'
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # Kept symmetric with the macOS job: both call sites pass the arch
      # through env so the two never drift apart.
      - name: Finalize binary
        id: sha256
        # See the macOS job.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-linux-$BUILD_ARCH"
          "linux-$BUILD_ARCH"

      # #2562: see the macOS job — hard-fails, skipped on reuse.
      - name: Attest build provenance
        if: steps.reuse.outputs.reuse != 'true'
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nuitka/lintro-linux-${{ matrix.arch }}

      # Ungated on reuse and `overwrite:`-free for the same reason as the macOS
      # job above (#2435).
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-linux-${{ matrix.arch }}
          path: dist/nuitka/lintro-linux-${{ matrix.arch }}
          # 90 days: the policy recovery window (lgtm-hq/lgtm-ci#962).
          retention-days: 90

      - name: Save SHA256 to file
        env:
          # #2435: see the macOS job.
          # yamllint disable-line rule:line-length
          SHA256: ${{ steps.sha256.outputs.sha256 || steps.reuse.outputs.sha256 }}
        run: |
          echo "$SHA256" > sha256-linux-${{ matrix.arch }}.txt

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-linux-${{ matrix.arch }}
          path: sha256-linux-${{ matrix.arch }}.txt
          retention-days: 90
