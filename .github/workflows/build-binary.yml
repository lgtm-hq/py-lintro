---
name: Publish - Homebrew Tap

'on':
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to publish'
        required: true
        type: string
      arch:
        description: 'Target architecture'
        required: false
        default: universal
        type: string
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
          - universal
      upload_to_release:
        # yamllint disable-line rule:line-length
        description: 'Upload built binaries onto the latest release (repair only; a plain dispatch just builds and seeds the Nuitka cache)'
        required: false
        default: false
        type: boolean

permissions: {}

# Exact uv pin so setup-uv's ExactVersionResolver skips resolving "latest"
# via astral-sh/versions uv.ndjson (the dominant tag-publish flake under
# harden-runner). Renovate keeps this in step with docker/tools.Dockerfile's
# ARG UV_VERSION via a customManager on this line; a contract test asserts the
# two stay equal. Artifact URL lookup may still consult the manifest, so the
# continue-on-error retry below remains as belt-and-suspenders (#1487, #1513).
env:
  UV_VERSION: '0.12.11'
  # #2484: the binary builds' interpreter. Named here because the Nuitka
  # compile cache key has to carry it — a Python bump regenerates every C
  # source, so the previous ccache entries are all misses.
  PYTHON_VERSION: '3.14'
  # #2484: pin Nuitka's cache root instead of relying on the per-OS default
  # (~/Library/Caches/Nuitka vs ~/.cache/Nuitka), so one path expression
  # serves the restore step, the build and the save step on both runners.
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  get-release-info:
    name: Get Release Info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Manual runs use latest release. Tag releases pass inputs.release_tag via
    # workflow_call; the caller's push event is inherited (not workflow_call).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      inputs.release_tag != ''
    outputs:
      release_tag: ${{ steps.get-tag.outputs.tag }}
      is_prerelease: ${{ steps.get-tag.outputs.is_prerelease }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Get release tag
        id: get-tag
        run: scripts/ci/homebrew/get-release-info.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_CALL_RELEASE_TAG: ${{ inputs.release_tag }}

  generate-man-page:
    name: Generate Man Page
    needs: get-release-info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required by softprops/action-gh-release to upload dist/lintro.1.
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      inputs.release_tag != ''

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # This job (unlike the binary builds below) does need the dev group:
      # `click-man` lives there. It runs on Linux, where every dev-group
      # dependency has a wheel, so the source-build trap in #1897 can't bite.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate man page
        run: uv run python scripts/generate-man-page.py --output dist/lintro.1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-man-page
          path: dist/lintro.1
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch, so
        # a bare dispatch would otherwise republish onto the latest release
        # (#2484). Publish on the workflow_call path, or on a dispatch that
        # explicitly asked for a repair upload.
        if: >-
          needs.get-release-info.outputs.release_tag != '' &&
          (inputs.release_tag != '' || inputs.upload_to_release == true)
        # yamllint disable-line rule:line-length
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: dist/lintro.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Binary
    needs: get-release-info
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-latest' }}
    # 40 min compile + 20 min smoke + 10 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test. #2484 raised the compile bound to 40, so the job
    # deadline moves with it (60 -> 70) rather than re-creating that trap.
    timeout-minutes: 70
    permissions:
      contents: write
      # #2435: the reuse check lists and downloads this run's own sha256
      # artifact (including earlier attempts) to decide whether the asset on
      # the release is one this job already verified.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: >-
          ${{
            inputs.arch != 'universal' &&
            fromJSON(format('["{0}"]', inputs.arch)) ||
            fromJSON('["arm64", "x86_64"]')
          }}

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          # #2484: the last two entries are actions/cache restore/save — the
          # cache service is reached through the Actions endpoint, and the
          # entries themselves are read from and written to Azure blob
          # storage over a pre-signed URL.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443
            nuitka.net:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after the harden-runner network extension activates
      # can stall past setup-uv's manifest-fetch timeout (macOS especially);
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # #1897: binary builds install the runtime deps plus the `build` group and
      # nothing else. The default `dev` group drags in `mcp` -> `pyjwt[crypto]`
      # -> `cryptography`, which ships no macOS x86_64 wheel from 49.0.0 on, so
      # uv would build it from source via maturin/cargo and hit the (correctly)
      # blocked crates.io egress. A Nuitka binary needs none of that stack.
      - name: Install dependencies
        run: |
          uv sync --group build --no-default-groups

      # #2435: a rerun of this job (the supported npm backfill path, see
      # docs/npm-distribution.md) used to rebuild from scratch even when the
      # release already carried this job's own verified binary. The step below
      # reuses that asset when its SHA256 matches the sha256 artifact this run
      # produced, and every step it makes redundant is gated on its output. It
      # also promotes an `<asset>.new` left behind by a swap that was killed
      # between its delete and its rename, so that window costs no rebuild.
      - name: Check for reusable release asset
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/reuse_release_asset.sh
          "$RELEASE_TAG"
          "lintro-macos-$BUILD_ARCH"
          "sha256-$BUILD_ARCH"
          "dist/nuitka/lintro-macos-$BUILD_ARCH"

      # #2484: persist Nuitka's compile cache (its bundled ccache tree plus the
      # ccache download) across runs. A cold arm64 build compiles ~1500 C files
      # and reports every one as a ccache miss, which is most of the 18-22
      # minute compile; between patch releases nearly all of those sources are
      # byte-identical. GitHub caches are immutable per key, so the key ends in
      # the run id and attempt and the restore falls back through the shared
      # prefix to the newest matching entry — a fixed key would freeze on the
      # first upload and never pick up newly compiled modules. ccache is
      # content-addressed on the preprocessed source, the compiler and the
      # flags, so added, changed and removed modules need no invalidation
      # logic; a Python or Nuitka bump changes the key and starts clean.
      # Scope: GitHub caches are readable from the ref that wrote them and
      # from the default branch. This workflow runs on tag refs, so the
      # guaranteed win is a re-run or later attempt of the same tag run -
      # the seven-attempt case this exists for. Tag-to-tag reuse needs a
      # cache written on main: dispatch this workflow from main to seed one.
      # A plain dispatch is side-effect free - it builds and caches only.
      # Set the upload_to_release input to also republish release assets
      # (repair path).
      - name: Resolve Nuitka version
        id: nuitka-version
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 scripts/ci/resolve-nuitka-version.py

      - name: Restore Nuitka compile cache
        if: steps.reuse.outputs.reuse != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-
        # yamllint enable rule:line-length

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        # #2435: this step also tees a baseline snapshot into its own log, the
        # part that survives a runner kill. The interval samples still reach a
        # human only via Stop memory sampler's replay or the failure artifact.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        # #2435: skipped when the release already carries this job's verified
        # binary.
        if: steps.reuse.outputs.reuse != 'true'
        # #1702 set 25 minutes when the arm64 compile took 22. Module growth
        # since (724 -> 839 lintro modules, 1476 -> 1501 C units between
        # v0.147.0 and v0.151.1) ate the margin: on 2026-09-08 v0.148.1 needed
        # seven arm64 attempts and v0.149.0 five, every failure a timeout
        # during onefile packaging after a 19-22 minute compile. 40 minutes is
        # cold-cache headroom for runner-speed variance; the job-level
        # 70-minute limit still bounds the whole thing (#2484).
        timeout-minutes: 40
        # `--no-default-groups` is required here too: `uv run` re-syncs the
        # environment with the default groups and would reinstall `dev`.
        run: |
          uv run --no-default-groups python scripts/build/build_macos.py \
            --arch "$BUILD_ARCH" \
            --skip-verify
        env:
          # matrix.arch via env, not template expansion: workflow_call passes
          # inputs.arch as a free-form string (template-injection hardening).
          BUILD_ARCH: ${{ matrix.arch }}
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      # Saved even when the build failed or was cancelled by the step timeout:
      # the C files it did compile are the head start the next attempt needs.
      - name: Save Nuitka compile cache
        if: always() && steps.reuse.outputs.reuse != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        # yamllint enable rule:line-length

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-macos-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        # Safe to skip on reuse: the checksum that authorised the reuse came
        # from a same-run artifact written only after this step and the smoke
        # test passed on an earlier attempt of this same job.
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # Same reuse invariant as Verify binary above.
        if: steps.reuse.outputs.reuse != 'true'
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # matrix.arch reaches the shell via env, not template expansion: on
      # workflow_call inputs.arch is a free-form string that feeds this matrix
      # (same hardening as the Build binary step above).
      - name: Finalize binary
        id: sha256
        # On reuse the asset is already at the finalized path and its checksum
        # comes from the reuse step's output.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-macos-$BUILD_ARCH"
          "$BUILD_ARCH"

      # Ungated on reuse (#2435) so a later attempt still finds the binary and
      # its checksum among the run artifacts. No `overwrite:` needed: artifacts
      # are per-attempt, so re-uploading a name an earlier attempt already used
      # is not a conflict — run 33996465351 carries two `sha256-linux-x64`
      # artifacts, one per attempt, and the reuse check reads them by run id.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-macos-${{ matrix.arch }}
          path: dist/nuitka/lintro-macos-${{ matrix.arch }}
          retention-days: 7

      - name: Save SHA256 to file
        env:
          # #2435: Finalize binary is skipped on reuse, so fall back to the
          # checksum the reuse step verified against the release asset.
          # yamllint disable-line rule:line-length
          SHA256: ${{ steps.sha256.outputs.sha256 || steps.reuse.outputs.sha256 }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          echo "$SHA256" > "sha256-$BUILD_ARCH.txt"

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-${{ matrix.arch }}
          path: sha256-${{ matrix.arch }}.txt
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        # #2435: upload-then-swap instead of the action's overwrite_files,
        # which deletes the published asset before uploading its replacement.
        # Skipped entirely when the asset being uploaded is the one already
        # on the release.
        # #2484: a bare dispatch (cache seeding) must not republish onto the
        # latest release; only workflow_call or an explicit repair dispatch.
        if: >-
          needs.get-release-info.outputs.release_tag != '' &&
          steps.reuse.outputs.reuse != 'true' &&
          (inputs.release_tag != '' || inputs.upload_to_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/upload_release_asset.sh
          "$RELEASE_TAG"
          "dist/nuitka/lintro-macos-$BUILD_ARCH"

  build-linux:
    name: Build Linux Binary
    needs: get-release-info
    runs-on: ${{ matrix.runner }}
    # 40 min compile + 20 min smoke + 10 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test. #2484 raised the compile bound to 40, so the job
    # deadline moves with it (60 -> 70) rather than re-creating that trap.
    timeout-minutes: 70
    permissions:
      contents: write
      # #2435: the reuse check lists and downloads this run's own sha256
      # artifact (including earlier attempts) to decide whether the asset on
      # the release is one this job already verified.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Harden Runner
        # GitHub's own hosted-runner control plane under githubapp.com: the
        # hosted-compute-watchdog-prod-* and hosted-compute-request-
        # orchestrator-prod-* shards (iad-01, iad-02, eus-01, eus-02 -- every
        # shard observed in this repo's job logs) and the results receiver.
        # The x64 job was reclaimed mid-run on 7 of 7 attempts for v0.147.7
        # ("The runner has received a shutdown signal", 15-20 minutes in)
        # while this list denied them, while the arm64 sibling -- same source,
        # same runner class -- has never been observed dying that way (#1761,
        # #2339). Exact hosts rather than the `*.githubapp.com:443` wildcard
        # the docker-ci/ai-review jobs carry (#2353), by owner decision. If
        # GitHub adds a shard the kills return; the trigger is the kill itself
        # (a "shutdown signal" 15-20 minutes into a single matrix leg), not a
        # named host -- a reclaimed runner does not reliably publish its
        # harden-runner summary. The agreed procedure on that signal is an
        # immediate issue and a next PR reverting this job to the wildcard
        # (#2488 tracks narrowing the others). macOS legs are out of scope:
        # never observed reclaimed, and harden-runner enforces differently
        # there.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          # #2484: the last two entries are actions/cache restore/save — the
          # cache service is reached through the Actions endpoint, and the
          # entries themselves are read from and written to Azure blob
          # storage over a pre-signed URL.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443
            nuitka.net:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            hosted-compute-watchdog-prod-iad-01.githubapp.com:443
            hosted-compute-watchdog-prod-iad-02.githubapp.com:443
            hosted-compute-watchdog-prod-eus-01.githubapp.com:443
            hosted-compute-watchdog-prod-eus-02.githubapp.com:443
            hosted-compute-request-orchestrator-prod-iad-01.githubapp.com:443
            hosted-compute-request-orchestrator-prod-iad-02.githubapp.com:443
            hosted-compute-request-orchestrator-prod-eus-01.githubapp.com:443
            hosted-compute-request-orchestrator-prod-eus-02.githubapp.com:443
            actions-results-receiver-production.githubapp.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after harden-runner's egress filtering activates
      # can stall past setup-uv's manifest-fetch timeout;
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      # #1897: kept in lockstep with the macOS job above - binary builds never
      # install the dev test stack.
      - name: Install dependencies
        run: |
          uv sync --group build --no-default-groups

      # #2435: see the macOS job — the reuse check and the `if:` guards it
      # feeds are kept identical across the two jobs.
      - name: Check for reusable release asset
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/reuse_release_asset.sh
          "$RELEASE_TAG"
          "lintro-linux-$BUILD_ARCH"
          "sha256-linux-$BUILD_ARCH"
          "dist/nuitka/lintro-linux-$BUILD_ARCH"

      # #2484: persist Nuitka's compile cache (its bundled ccache tree plus the
      # ccache download) across runs. A cold arm64 build compiles ~1500 C files
      # and reports every one as a ccache miss, which is most of the 18-22
      # minute compile; between patch releases nearly all of those sources are
      # byte-identical. GitHub caches are immutable per key, so the key ends in
      # the run id and attempt and the restore falls back through the shared
      # prefix to the newest matching entry — a fixed key would freeze on the
      # first upload and never pick up newly compiled modules. ccache is
      # content-addressed on the preprocessed source, the compiler and the
      # flags, so added, changed and removed modules need no invalidation
      # logic; a Python or Nuitka bump changes the key and starts clean.
      # Scope: GitHub caches are readable from the ref that wrote them and
      # from the default branch. This workflow runs on tag refs, so the
      # guaranteed win is a re-run or later attempt of the same tag run -
      # the seven-attempt case this exists for. Tag-to-tag reuse needs a
      # cache written on main: dispatch this workflow from main to seed one.
      # A plain dispatch is side-effect free - it builds and caches only.
      # Set the upload_to_release input to also republish release assets
      # (repair path).
      - name: Resolve Nuitka version
        id: nuitka-version
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 scripts/ci/resolve-nuitka-version.py

      - name: Restore Nuitka compile cache
        if: steps.reuse.outputs.reuse != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-
        # yamllint enable rule:line-length

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        # #2435: this step also tees a baseline snapshot into its own log, the
        # part that survives a runner kill. The interval samples still reach a
        # human only via Stop memory sampler's replay or the failure artifact.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        # #2435: skipped when the release already carries this job's verified
        # binary.
        if: steps.reuse.outputs.reuse != 'true'
        # Kept in lockstep with the macOS job: #1702's 25 minutes had no
        # headroom left against a 19-22 minute compile, so 2026-09-08 spent
        # seven arm64 attempts on v0.148.1 alone. The job-level
        # 70-minute limit still bounds the whole thing (#2484).
        timeout-minutes: 40
        run: |
          HOST_ARCH="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          uv run --no-default-groups python scripts/build/build_linux.py \
            --arch "$HOST_ARCH" \
            --skip-verify
        env:
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      # Saved even when the build failed or was cancelled by the step timeout:
      # the C files it did compile are the head start the next attempt needs.
      - name: Save Nuitka compile cache
        if: always() && steps.reuse.outputs.reuse != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py${{ env.PYTHON_VERSION }}-nuitka${{ steps.nuitka-version.outputs.nuitka-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        # yamllint enable rule:line-length

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-linux-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        # Safe to skip on reuse: the checksum that authorised the reuse came
        # from a same-run artifact written only after this step and the smoke
        # test passed on an earlier attempt of this same job.
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # Same reuse invariant as Verify binary above.
        if: steps.reuse.outputs.reuse != 'true'
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # Kept symmetric with the macOS job: both call sites pass the arch
      # through env so the two never drift apart.
      - name: Finalize binary
        id: sha256
        # See the macOS job.
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-linux-$BUILD_ARCH"
          "linux-$BUILD_ARCH"

      # Ungated on reuse and `overwrite:`-free for the same reason as the macOS
      # job above (#2435).
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-linux-${{ matrix.arch }}
          path: dist/nuitka/lintro-linux-${{ matrix.arch }}
          retention-days: 7

      - name: Save SHA256 to file
        env:
          # #2435: see the macOS job.
          # yamllint disable-line rule:line-length
          SHA256: ${{ steps.sha256.outputs.sha256 || steps.reuse.outputs.sha256 }}
        run: |
          echo "$SHA256" > sha256-linux-${{ matrix.arch }}.txt

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-linux-${{ matrix.arch }}
          path: sha256-linux-${{ matrix.arch }}.txt
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        # #2435: see the macOS job — upload-then-swap, skipped on reuse.
        # #2484: a bare dispatch (cache seeding) must not republish onto the
        # latest release; only workflow_call or an explicit repair dispatch.
        if: >-
          needs.get-release-info.outputs.release_tag != '' &&
          steps.reuse.outputs.reuse != 'true' &&
          (inputs.release_tag != '' || inputs.upload_to_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/upload_release_asset.sh
          "$RELEASE_TAG"
          "dist/nuitka/lintro-linux-$BUILD_ARCH"

  create-universal-binary:
    name: Create Universal Binary
    needs: [get-release-info, build-macos]
    runs-on: macos-latest
    # download/lipo/upload (~10 min) + 20 min smoke + 5 min headroom.
    # The smoke step's 20-minute budget must not sit inside the previous
    # 10-minute job deadline or the parent would cancel a valid smoke test.
    timeout-minutes: 35
    permissions:
      contents: write
    if: inputs.arch == 'universal'

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443

      # Needed for scripts/build/create_universal.sh and the binary smoke
      # test. smoke-test-binary.py reads lintro/plugins/_builtin_index.py,
      # which is no longer committed (#2180), so the checkout carries the
      # builtin-index generator's inputs instead: lintro/tools (the per-tool
      # packages it scans) and the lintro_build package (the
      # implementation). The codeload / objects.githubusercontent.com
      # endpoints above are what actions/checkout fetches through, and match
      # the other sparse-checkout jobs here.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            lintro/plugins
            lintro/tools
            lintro_build
          persist-credentials: false

      # #2202: regenerate the builtin index the smoke test reads; the file
      # stopped being committed in #2180 and this job never builds the
      # package, so nothing else generates it. Stdlib-only and offline.
      - name: Generate builtin tool index
        run: python3 scripts/ci/generate-builtin-tool-index.py

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-macos-arm64
          path: binaries/

      - name: Download x86_64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-macos-x86_64
          path: binaries/

      - name: Create universal binary
        run: >-
          scripts/build/create_universal.sh
          binaries/lintro-macos-arm64
          binaries/lintro-macos-x86_64
          binaries/lintro-macos-universal

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. Lipo can also produce a binary that will not launch, so
      # the post-lipo artifact is smoke-tested independently of the per-arch
      # inputs.
      - name: Smoke-test tool registry
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py binaries/lintro-macos-universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-macos-universal
          path: binaries/lintro-macos-universal
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch; a
        # bare dispatch must not republish onto the latest release (#2484).
        if: >-
          needs.get-release-info.outputs.release_tag != '' &&
          (inputs.release_tag != '' || inputs.upload_to_release == true)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: binaries/lintro-macos-universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-dispatch:
    name: Notify Homebrew Tap
    needs: [get-release-info, build-macos, generate-man-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Stable tag releases only. The tap's formulas/lintro.yml declares a
    # binary formula, so the dispatch must carry both macOS checksums:
    # a failed binary build blocks the formula update (re-run this workflow
    # to recover) instead of shipping a partial bump. The universal guard
    # keeps single-arch workflow_call runs from failing on a missing
    # checksum artifact.
    # Use resolved tag: workflow_dispatch has no release_tag input.
    # #2484: a bare dispatch seeds the Nuitka cache and publishes nothing.
    if: >-
      inputs.arch == 'universal' &&
      needs.get-release-info.outputs.release_tag != '' &&
      needs.get-release-info.outputs.is_prerelease == 'false' &&
      (inputs.release_tag != '' || inputs.upload_to_release == true)

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            pypi.org:443

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download SHA256 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sha256-*
          path: checksums/
          merge-multiple: true

      - name: Read checksums
        id: checksums
        run: |
          ARM64_SHA=$(cat checksums/sha256-arm64.txt)
          X86_64_SHA=$(cat checksums/sha256-x86_64.txt)
          echo "arm64_sha256=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha256=$X86_64_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ needs.get-release-info.outputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        # The tap generates lintro-full from live PyPI metadata as soon as
        # the dispatch lands, so the sdist must be visible first.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/ci/homebrew/wait-for-pypi.sh lintro "$VERSION"

      - name: Dispatch formula update
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/trigger-homebrew-update@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
        with:
          formula: lintro
          version: ${{ steps.version.outputs.version }}
          pypi-package: lintro
          binary-arm64-sha: ${{ steps.checksums.outputs.arm64_sha256 }}
          binary-x86-sha: ${{ steps.checksums.outputs.x86_64_sha256 }}
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
