---
name: Publish - Homebrew Tap

'on':
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to publish'
        required: true
        type: string
      arch:
        description: 'Target architecture'
        required: false
        default: universal
        type: string
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64
          - universal

permissions: {}

# Exact uv pin so setup-uv's ExactVersionResolver skips resolving "latest"
# via astral-sh/versions uv.ndjson (the dominant tag-publish flake under
# harden-runner). Renovate keeps this in step with docker/tools.Dockerfile's
# ARG UV_VERSION via a customManager on this line; a contract test asserts the
# two stay equal. Artifact URL lookup may still consult the manifest, so the
# continue-on-error retry below remains as belt-and-suspenders (#1487, #1513).
env:
  UV_VERSION: '0.12.2'

jobs:
  get-release-info:
    name: Get Release Info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Manual runs use latest release. Tag releases pass inputs.release_tag via
    # workflow_call; the caller's push event is inherited (not workflow_call).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      inputs.release_tag != ''
    outputs:
      release_tag: ${{ steps.get-tag.outputs.tag }}
      is_prerelease: ${{ steps.get-tag.outputs.is_prerelease }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Get release tag
        id: get-tag
        run: scripts/ci/homebrew/get-release-info.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_CALL_RELEASE_TAG: ${{ inputs.release_tag }}

  generate-man-page:
    name: Generate Man Page
    needs: get-release-info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required by softprops/action-gh-release to upload dist/lintro.1.
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      inputs.release_tag != ''

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # This job (unlike the binary builds below) does need the dev group:
      # `click-man` lives there. It runs on Linux, where every dev-group
      # dependency has a wheel, so the source-build trap in #1897 can't bite.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate man page
        run: uv run python scripts/generate-man-page.py --output dist/lintro.1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-man-page
          path: dist/lintro.1
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        if: needs.get-release-info.outputs.release_tag != ''
        # yamllint disable-line rule:line-length
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: dist/lintro.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Binary
    needs: get-release-info
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-latest' }}
    # 25 min compile + 20 min smoke + 15 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test.
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: >-
          ${{
            inputs.arch != 'universal' &&
            fromJSON(format('["{0}"]', inputs.arch)) ||
            fromJSON('["arm64", "x86_64"]')
          }}

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443
            nuitka.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after the harden-runner network extension activates
      # can stall past setup-uv's manifest-fetch timeout (macOS especially);
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # #1897: binary builds install the runtime deps plus the `build` group and
      # nothing else. The default `dev` group drags in `mcp` -> `pyjwt[crypto]`
      # -> `cryptography`, which ships no macOS x86_64 wheel from 49.0.0 on, so
      # uv would build it from source via maturin/cargo and hit the (correctly)
      # blocked crates.io egress. A Nuitka binary needs none of that stack.
      - name: Install dependencies
        run: |
          uv sync --group build --no-default-groups

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        timeout-minutes: 25
        # `--no-default-groups` is required here too: `uv run` re-syncs the
        # environment with the default groups and would reinstall `dev`.
        run: |
          uv run --no-default-groups python scripts/build/build_macos.py \
            --arch "$BUILD_ARCH" \
            --skip-verify
        env:
          # matrix.arch via env, not template expansion: workflow_call passes
          # inputs.arch as a free-form string (template-injection hardening).
          BUILD_ARCH: ${{ matrix.arch }}
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-macos-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # matrix.arch reaches the shell via env, not template expansion: on
      # workflow_call inputs.arch is a free-form string that feeds this matrix
      # (same hardening as the Build binary step above).
      - name: Finalize binary
        id: sha256
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-macos-$BUILD_ARCH"
          "$BUILD_ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-macos-${{ matrix.arch }}
          path: dist/nuitka/lintro-macos-${{ matrix.arch }}
          retention-days: 7

      - name: Save SHA256 to file
        env:
          SHA256: ${{ steps.sha256.outputs.sha256 }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          echo "$SHA256" > "sha256-$BUILD_ARCH.txt"

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-${{ matrix.arch }}
          path: sha256-${{ matrix.arch }}.txt
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        if: needs.get-release-info.outputs.release_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: dist/nuitka/lintro-macos-${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    needs: get-release-info
    runs-on: ${{ matrix.runner }}
    # 25 min compile + 20 min smoke + 15 min setup/diagnostic headroom.
    # The smoke step's 20-minute budget used to sit inside a 35-minute job
    # that already spent 25 minutes on compile, so the parent could cancel a
    # valid smoke test.
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            astral.sh:443
            releases.astral.sh:443
            uploads.github.com:443
            nuitka.net:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        id: setup-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # First connections after harden-runner's egress filtering activates
      # can stall past setup-uv's manifest-fetch timeout;
      # one retry runs on a warm network path. See #1513 / #1487.
      - name: Install uv (retry)
        if: steps.setup-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # #1897: kept in lockstep with the macOS job above - binary builds never
      # install the dev test stack.
      - name: Install dependencies
        run: |
          uv sync --group build --no-default-groups

      - name: Start memory sampler
        # #1707: background vmstat/free sampler; log uploads on failure only.
        run: scripts/ci/memory-sampler.sh start memory-sampler.log memory-sampler.pid

      - name: Build binary
        timeout-minutes: 25
        run: |
          HOST_ARCH="${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          uv run --no-default-groups python scripts/build/build_linux.py \
            --arch "$HOST_ARCH" \
            --skip-verify
        env:
          PYTHONUNBUFFERED: '1'

      - name: Stop memory sampler
        if: always()
        run: scripts/ci/memory-sampler.sh stop memory-sampler.log memory-sampler.pid

      - name: Collect OOM evidence
        if: failure()
        run: scripts/ci/collect-oom-evidence.sh oom-evidence.txt

      - name: Upload memory diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memory-diagnostics-linux-${{ matrix.arch }}
          path: |
            memory-sampler.log
            oom-evidence.txt
          retention-days: 7

      - name: Verify binary
        run: scripts/build/verify_built_binary.sh dist/nuitka/lintro

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. This asserts the registry is actually populated.
      - name: Smoke-test tool registry
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py dist/nuitka/lintro

      # Kept symmetric with the macOS job: both call sites pass the arch
      # through env so the two never drift apart.
      - name: Finalize binary
        id: sha256
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: >-
          scripts/build/finalize_binary.sh
          dist/nuitka/lintro
          "dist/nuitka/lintro-linux-$BUILD_ARCH"
          "linux-$BUILD_ARCH"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-linux-${{ matrix.arch }}
          path: dist/nuitka/lintro-linux-${{ matrix.arch }}
          retention-days: 7

      - name: Save SHA256 to file
        env:
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          echo "$SHA256" > sha256-linux-${{ matrix.arch }}.txt

      - name: Upload SHA256 file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sha256-linux-${{ matrix.arch }}
          path: sha256-linux-${{ matrix.arch }}.txt
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        if: needs.get-release-info.outputs.release_tag != ''
        # yamllint disable-line rule:line-length
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: dist/nuitka/lintro-linux-${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-universal-binary:
    name: Create Universal Binary
    needs: [get-release-info, build-macos]
    runs-on: macos-latest
    # download/lipo/upload (~10 min) + 20 min smoke + 5 min headroom.
    # The smoke step's 20-minute budget must not sit inside the previous
    # 10-minute job deadline or the parent would cancel a valid smoke test.
    timeout-minutes: 35
    permissions:
      contents: write
    if: inputs.arch == 'universal'

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443

      # Needed for scripts/build/create_universal.sh and the binary smoke
      # test (scripts/ci/smoke-test-binary.py reads the generated builtin
      # index under lintro/plugins). The codeload /
      # objects.githubusercontent.com endpoints above are what actions/checkout
      # fetches through, and match the other sparse-checkout jobs here.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            lintro/plugins
          persist-credentials: false

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-macos-arm64
          path: binaries/

      - name: Download x86_64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-macos-x86_64
          path: binaries/

      - name: Create universal binary
        run: >-
          scripts/build/create_universal.sh
          binaries/lintro-macos-arm64
          binaries/lintro-macos-x86_64
          binaries/lintro-macos-universal

      # #2006: --version/--help pass even when the frozen binary ships an empty
      # tool registry. Lipo can also produce a binary that will not launch, so
      # the post-lipo artifact is smoke-tested independently of the per-arch
      # inputs.
      - name: Smoke-test tool registry
        # 9 min of script-internal timeouts (120s + 120s + 300s) plus slack for
        # the cold onefile extraction each of the three invocations may pay.
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-test-binary.py binaries/lintro-macos-universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lintro-macos-universal
          path: binaries/lintro-macos-universal
          retention-days: 7

      - name: Upload to release
        # Resolved tag is set for both workflow_call and workflow_dispatch.
        if: needs.get-release-info.outputs.release_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: binaries/lintro-macos-universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-dispatch:
    name: Notify Homebrew Tap
    needs: [get-release-info, build-macos, generate-man-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Stable tag releases only. The tap's formulas/lintro.yml declares a
    # binary formula, so the dispatch must carry both macOS checksums:
    # a failed binary build blocks the formula update (re-run this workflow
    # to recover) instead of shipping a partial bump. The universal guard
    # keeps single-arch workflow_call runs from failing on a missing
    # checksum artifact.
    # Use resolved tag: workflow_dispatch has no release_tag input.
    if: >-
      inputs.arch == 'universal' &&
      needs.get-release-info.outputs.release_tag != '' &&
      needs.get-release-info.outputs.is_prerelease == 'false'

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            pypi.org:443

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download SHA256 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sha256-*
          path: checksums/
          merge-multiple: true

      - name: Read checksums
        id: checksums
        run: |
          ARM64_SHA=$(cat checksums/sha256-arm64.txt)
          X86_64_SHA=$(cat checksums/sha256-x86_64.txt)
          echo "arm64_sha256=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha256=$X86_64_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ needs.get-release-info.outputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        # The tap generates lintro-full from live PyPI metadata as soon as
        # the dispatch lands, so the sdist must be visible first.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/ci/homebrew/wait-for-pypi.sh lintro "$VERSION"

      - name: Dispatch formula update
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/trigger-homebrew-update@666482503128c40a09ed21b955456e46d6bdfcbe # v0.63.0
        with:
          formula: lintro
          version: ${{ steps.version.outputs.version }}
          pypi-package: lintro
          binary-arm64-sha: ${{ steps.checksums.outputs.arm64_sha256 }}
          binary-x86-sha: ${{ steps.checksums.outputs.x86_64_sha256 }}
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
