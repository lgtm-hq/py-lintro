---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@b0d71b2b37fd205bf12118f5084612ceeea09208 # v0.69.9
    with:
      tooling-ref: 'b0d71b2b37fd205bf12118f5084612ceeea09208' # v0.69.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
