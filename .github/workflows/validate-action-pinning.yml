---
name: Quality Check - Action Pinning Validation

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@eb01982e334eaa7599709a0f767d97afbb015303 # v0.69.1
    with:
      tooling-ref: 'eb01982e334eaa7599709a0f767d97afbb015303' # v0.69.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
