---
name: Promote - Lintro Tools Candidate

# A merged Renovate PR already built and validated its tools image. Retag that
# exact candidate digest as :latest after the merge; do not rebuild from the
# squash commit. The candidate resolver selects by merged PR number because the
# digest commit changes the PR head SHA before GitHub creates the merge commit.
# Non-Renovate main updates use the canonical build fallback below; a Renovate
# merge with a missing candidate fails closed instead of rebuilding.
# persist-pinned-digest then tags the digest the Dockerfiles pin as pinned-<sha7>
# without moving latest. That job is idempotent and runs on every successful
# classify so a dropped queued run in lintro-tools-registry still heals later.
# Re-running an old promote still moves latest backwards.
#
# The promote step refuses a candidate whose tool manifest inputs no longer
# match main (#2497). force_publish=true is that guard's escape hatch only.
# It does not skip EXPECTED_DIGEST: the candidate must still be the digest
# the Dockerfiles pin, or latest would move off what main consumes (#2845).
# To rebuild from main, dispatch docker-tools-publish.yml instead.

'on':
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/ai-tools.Dockerfile'
      - 'docker/tools.Dockerfile'
      - '.github/workflows/docker-tools-publish.yml'
      - 'lintro/_tool_versions.py'
      - 'lintro/tools/manifest.src.json'
      - 'lintro/_tool_packages.py'
      - 'lintro_build/**'
      - 'scripts/utils/install-tools.sh'
      - 'scripts/utils/install-semgrep.sh'
      - 'scripts/utils/utils.sh'
      - 'package.json'
      - 'pyproject.toml'
      - 'requirements-semgrep.txt'
  workflow_dispatch:
    inputs:
      force_publish:
        # yamllint disable-line rule:line-length
        description: >-
          Bypass the manifest staleness guard only. The candidate digest must
          still match the digest the Dockerfiles pin.
        required: false
        default: 'false'
      backfill_pinned_tag:
        description: >-
          Tag the digest currently pinned on main as pinned-<sha7> without
          moving latest. Use when that digest has no pinned-* tag. latest
          alone is not enough. Re-running an old promote still moves latest.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: lintro-tools-registry
  cancel-in-progress: false

jobs:
  resolve:
    name: Classify main tools image update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      packages: read # resolve candidate tags from GHCR before promotion
    timeout-minutes: 10
    outputs:
      action: ${{ steps.candidate.outputs.action }}
      candidate-tag: ${{ steps.candidate.outputs.candidate-tag }}
      candidate-sha: ${{ steps.candidate.outputs.candidate-sha }}
      candidate-pr: ${{ steps.candidate.outputs.candidate-pr }}
      pin-changed: ${{ steps.candidate.outputs.pin-changed }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve candidate from merged PR
        id: candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # yamllint disable-line rule:line-length
          BACKFILL_PINNED: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_pinned_tag == true }}
        run: python3 scripts/ci/promote-tools-candidate.py
  promote:
    name: Promote candidate digest
    needs: resolve
    if: needs.resolve.outputs.action == 'promote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the manifest staleness guard walks main back to the
          # candidate's branch point. The candidate commit itself is fetched
          # by SHA inside the guard (its branch is deleted on merge).
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker
      - name: Log in to GHCR
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the tools digest main pins
        id: pin
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ci/update-tools-image-digest.py --read
      - name: Promote candidate by digest
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/lintro-tools
          CI_TAG: ${{ needs.resolve.outputs.candidate-tag }}
          # latest plus a persistent pinned-<merge-sha7> so the digest main
          # pins cannot become ephemeral-only after the next rebuild (#2845).
          TAGS: |
            ghcr.io/lgtm-hq/lintro-tools:latest
            ghcr.io/lgtm-hq/lintro-tools:pinned-${{ steps.pin.outputs.sha7 }}
          EXPECTED_DIGEST: ${{ steps.pin.outputs.digest }}
          # Staleness guard inputs (#2497): refuse to retag a candidate whose
          # manifest inputs no longer match main.
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate-sha }}
          # The tag carries an abbreviated SHA, so the guard resolves it
          # against refs/pull/<n>/head rather than fetching by object id.
          CANDIDATE_PR: ${{ needs.resolve.outputs.candidate-pr }}
          MAIN_SHA: ${{ github.sha }}
          # Manual escape hatch for the guard; always 'false' on a push.
          # yamllint disable-line rule:line-length
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || 'false' }}
        run: scripts/ci/promote-ci-docker-images.sh

  publish-fallback:
    name: Build canonical tools image for ordinary main update
    needs: resolve
    if: needs.resolve.outputs.action == 'publish' && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker.yml@234e84901ae4ac14f2d44f02fad517d95712cec3 # v0.75.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      file: docker/tools.Dockerfile
      image-name: lgtm-hq/lintro-tools
      tags: latest
      push: true
      platforms: linux/amd64,linux/arm64
      runner-map: '{"linux/arm64":"ubuntu-24.04-arm"}'
      smoke-test: bun --version
      validate-on-pr: false
      cache-registry-ref: ghcr.io/lgtm-hq/lintro-tools:cache
      provenance: true
      sbom: true
      cosign-sign: true
      scan: true
      scan-exit-code: '0'
      tooling-ref: '234e84901ae4ac14f2d44f02fad517d95712cec3' # v0.75.0
      egress-policy: block
      egress-preset: docker
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        deb.debian.org:80
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        dl.google.com:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        timestamp.sigstore.dev:443
        oauth2.sigstore.dev:443
        get.trivy.dev:443
        mirror.gcr.io:443

  persist-pinned-digest:
    name: Persist the digest main pins
    needs: resolve
    # Self-healing: every classified main run ensures the digest the
    # Dockerfiles pin has a pinned-* tag. The shared registry concurrency
    # group can drop a queued promote; the next run repairs it. Idempotent
    # when the digest already has pinned-*. Does not move latest.
    if: github.ref == 'refs/heads/main' && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker
      - name: Log in to GHCR
        # yamllint disable-line rule:line-length
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the pinned digest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRE_EPHEMERAL_ONLY: 'true'
        run: scripts/ci/tag-pinned-tools-digest.sh
