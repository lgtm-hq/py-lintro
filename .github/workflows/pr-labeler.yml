---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '8a48e818c43efe4ac3b2669b2be31bee0b99cb15' # v0.98.7
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
