---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@46cd4f431a6501230b629433c690bbc45d6c01ac # v0.59.28
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '46cd4f431a6501230b629433c690bbc45d6c01ac'  # v0.59.28
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
