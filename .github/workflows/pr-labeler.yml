---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36' # v0.69.8
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
