---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@3ff5243596da5e4808d58d9d4b6333c6021a4eff # v0.101.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '3ff5243596da5e4808d58d9d4b6333c6021a4eff' # v0.101.0
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
