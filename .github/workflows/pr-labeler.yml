---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'b777111fb3aaa6f09589fb029f0094a05dd76003' # v0.77.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
