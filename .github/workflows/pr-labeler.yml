---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@ea2eef45ec331a743dffd362a7397a0863501bd4 # v0.59.25
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'ea2eef45ec331a743dffd362a7397a0863501bd4'  # v0.59.25
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
