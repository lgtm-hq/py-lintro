---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '2097a900753e3e5ad0e336483501b278e99855ae' # v0.78.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
