---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@42aad382e0ca51e425a24f54053c298e588a9862 # v0.82.2
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '42aad382e0ca51e425a24f54053c298e588a9862' # v0.82.2
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
