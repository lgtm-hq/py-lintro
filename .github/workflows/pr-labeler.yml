---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@eb01982e334eaa7599709a0f767d97afbb015303 # v0.69.1
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'eb01982e334eaa7599709a0f767d97afbb015303' # v0.69.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
