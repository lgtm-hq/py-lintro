---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@903af56f9e0c623a047ccb5821e74bbb22d9514d # v0.74.1
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '903af56f9e0c623a047ccb5821e74bbb22d9514d' # v0.74.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
