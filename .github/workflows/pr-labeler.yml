---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@234e84901ae4ac14f2d44f02fad517d95712cec3 # v0.75.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '234e84901ae4ac14f2d44f02fad517d95712cec3' # v0.75.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
