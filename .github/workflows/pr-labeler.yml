---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@bab120fff62b419489d26a18b5cdccbc26703394 # v0.60.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'bab120fff62b419489d26a18b5cdccbc26703394' # v0.60.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
