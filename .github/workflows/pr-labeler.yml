---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@666482503128c40a09ed21b955456e46d6bdfcbe # v0.63.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '666482503128c40a09ed21b955456e46d6bdfcbe' # v0.63.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
