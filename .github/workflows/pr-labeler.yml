---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b # v0.59.30
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'cc5b3cc982868fa4c0718d4b26045ca9f56f0f5b'  # v0.59.30
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
