---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@97cb6ddb0d00eaaa38c208033020abc85f2ff1d0 # v0.73.2
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '97cb6ddb0d00eaaa38c208033020abc85f2ff1d0' # v0.73.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
