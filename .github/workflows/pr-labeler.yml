---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
