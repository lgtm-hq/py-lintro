---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@6c08ef91318466d03c615112820eae9b795a9a8b # v0.71.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '6c08ef91318466d03c615112820eae9b795a9a8b' # v0.71.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
