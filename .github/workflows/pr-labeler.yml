---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@19531b4aa3e8de8404a7fb6f3b5692c810acef39 # v0.72.0
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '19531b4aa3e8de8404a7fb6f3b5692c810acef39' # v0.72.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
