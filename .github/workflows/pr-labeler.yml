---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@2145a9aa0b1c82939be0506763442df6ea36884d # v0.74.2
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '2145a9aa0b1c82939be0506763442df6ea36884d' # v0.74.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
