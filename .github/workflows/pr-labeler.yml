---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@a167ee7165319d00dc92604ecdef87b719a0a55d # v0.74.4
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'a167ee7165319d00dc92604ecdef87b719a0a55d' # v0.74.4
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
