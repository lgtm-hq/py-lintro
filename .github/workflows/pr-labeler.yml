---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@737747b1b8590900afc41a72efdd372e244ea39d # v0.69.10
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '737747b1b8590900afc41a72efdd372e244ea39d' # v0.69.10
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
