---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@b0d71b2b37fd205bf12118f5084612ceeea09208 # v0.69.9
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: 'b0d71b2b37fd205bf12118f5084612ceeea09208' # v0.69.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
