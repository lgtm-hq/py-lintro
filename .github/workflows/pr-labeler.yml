---
name: PR - Auto Label

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@61180f222f8c04d381bbebcbd1e91b38a569080f # v0.69.6
    with:
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '61180f222f8c04d381bbebcbd1e91b38a569080f' # v0.69.6
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
