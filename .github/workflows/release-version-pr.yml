---
name: Release - Version PR

# Surface trigger context in the Actions history so post-merge release failures
# are traceable at a glance (event + branch), not just via the default commit
# subject. Guarded by test_release_workflows_define_traceable_run_names.
run-name: >-
  Release - Version PR (${{ github.event_name }} on ${{ github.ref_name }})

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Open the version PR even when the last tag publish failed (use for
          the first release after fixing the publish pipeline)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Publish gate (#2516). A broken tag publish used to mint one dead version
  # per merge to main — eleven versions, v0.151.2 to v0.152.6, were burned that
  # way while PyPI stayed on v0.151.1. This job reads the last version-tag run
  # of publish-pypi-on-tag.yml and skips the version PR while it is red. The
  # gate never fails: it reports green on its own errors (see the script's
  # module docstring), so an API hiccup cannot freeze the release train.
  publish-gate:
    name: 🚦 Publish Gate
    runs-on: ubuntu-24.04
    permissions:
      actions: read # read publish-pypi-on-tag.yml run conclusions
    timeout-minutes: 5
    outputs:
      publish_green: ${{ steps.gate.outputs.publish_green }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The gate script itself talks to api.github.com only; the remaining
          # hosts are what actions/checkout needs to fetch the script.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout gate script
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/check-last-publish-green.py
          sparse-checkout-cone-mode: false
      - name: Check the last tag publish
        id: gate
        env:
          # Read-only token: authenticates the Actions run listing.
          GITHUB_TOKEN: ${{ github.token }}
          # Resolved here so the conditional stays in the workflow expression
          # rather than in inline shell; the script drops the empty word.
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/ci/check-last-publish-green.py "${FORCE_FLAG}"

  version-pr:
    needs: [publish-gate]
    if: needs.publish-gate.outputs.publish_green == 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36 # v0.69.8
    with:
      ecosystems: python
      auto-merge: true
      max-bump: minor
      # Finalize the generated version PR before it is committed: reflow
      # CHANGELOG.md to lintro's 88-column markdown budget so release PRs pass
      # dogfooding-lint without CHANGELOG.md being ignored (#1117), and stamp
      # every SECURITY.md supported-versions table to the current major.minor
      # line so minor/major bumps do not go stale and block the unattended
      # release PR (#1372). Logic lives in dedicated scripts, not inline runs.
      version-update-script: scripts/ci/finalize-version-pr.py
      tooling-ref: 'f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36' # v0.69.8
      egress-policy: block
      # Paired with release-auto-tag.yml (egress-preset: github-tooling).
      # Guarded by test_release_workflows_use_paired_egress_presets.
      egress-preset: pypi
      # Since lgtm-ci v0.50.0 the enforcing harden-runner step runs before
      # preset resolution, so the preset's extra hosts never reach it and
      # pip is blocked from PyPI (#1287, lgtm-hq/lgtm-ci#512). Pass the
      # complete list explicitly; harden-runner splits on spaces, so keep
      # the folded scalar.
      allowed-endpoints: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      actions: read # report-release-failure reads workflow/job metadata
      contents: write # create version bump commits and PRs
      issues: write # report-release-failure opens deduplicated failure issues
      pull-requests: write
