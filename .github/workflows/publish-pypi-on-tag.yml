---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.1+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
      - '*.*.*a*'
      - v*.*.*a*
      - '*.*.*b*'
      - v*.*.*b*
      - '*.*.*rc*'
      - v*.*.*rc*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-tag:
    name: Classify release tag
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions:
      # read: sparse checkout of scripts for the classifier
      contents: read
    outputs:
      # true when github.ref_name is a prerelease (alpha/beta/rc or any
      # non-``X.Y.Z`` suffix); false for stable releases including +build
      # metadata. Consumed by Homebrew/npm/Docker gating below.
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout scripts
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/classify-release-tag.py
          sparse-checkout-cone-mode: false
      - name: Classify tag
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/classify-release-tag.py "$TAG_NAME"

  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      # Block tagged publishes when grype finds high/critical vulns (#1118).
      # Remediation landed in #1126; Dependabot shows no open high alerts.
      fail-on-severity: high
      create-attestation: true
      tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: SBOM generation, vuln scan and attestation only read the repo.
      # The contents:write release-asset upload moved out to
      # reusable-sbom-release-upload.yml upstream (lgtm-ci#770), so every job
      # in reusable-sbom.yml now declares contents: read.
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
    with:
      python-version: '3.14'
      artifact-name: python-dist
      tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      egress-policy: block
      egress-preset: pypi
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the pypi preset baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        test.pypi.org:443
        upload.pypi.org:443
        upload.test.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for PyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
        with:
          artifact-name: python-dist
          python-version: '3.14'
          tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      - name: Upload to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*

  sign-artifacts:
    name: Sign artifacts with Sigstore
    needs: [pypi-upload]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    permissions:
      # read: download the python-dist artifact to sign it
      contents: read
      # write: OIDC token for Sigstore keyless signing (Fulcio/Rekor)
      id-token: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # pypi + astral: install the `sigstore` CLI via uvx.
          # sigstore.dev endpoints: keyless signing exchanges the GitHub OIDC
          # token at Fulcio for a short-lived cert, logs to Rekor, and refreshes
          # the TUF trust root (same set already allowlisted for pypi-upload).
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            github-releases.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Download built distribution
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: dist
      - name: Sign distribution with Sigstore
        env:
          DIST_DIR: dist
        run: ./scripts/ci/sign-dist-sigstore.sh
      - name: Upload signed distribution
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist-signed
          # dist artifacts plus the .sigstore bundles produced above
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [sign-artifacts]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-github-release.yml@f8ce689b2453b7520a41b617d1a72051bfb1c1c0 # v0.63.7
    permissions:
      # write: create GitHub Release and upload dist assets
      contents: write
    with:
      # signed artifact: dist files + Sigstore .sigstore bundles as assets
      artifact-name: python-dist-signed
      generate-release-notes: true
      tooling-ref: 'f8ce689b2453b7520a41b617d1a72051bfb1c1c0' # v0.63.7
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443

  homebrew-tap:
    name: Publish Homebrew Tap
    needs: [classify-tag, pypi-upload, github-release]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/build-binary.yml
    permissions:
      # write: upload macOS/Linux binaries to the GitHub release. Formula
      # updates are dispatched to the tap (repository_dispatch), not pushed
      # from here — this token has no write access to lgtm-hq/homebrew-tap.
      contents: write
    with:
      release_tag: ${{ github.ref_name }}
      arch: universal
    secrets: inherit

  npm-publish:
    name: Publish to npm
    # Needs homebrew-tap: that job (build-binary.yml) uploads the four
    # platform binaries to the GitHub release, which publish-npm.yml
    # downloads. Gated to stable releases only, since build-binary does not
    # run for prereleases.
    needs: [classify-tag, homebrew-tap]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      # read: checkout and download release assets
      contents: read
      # write: OIDC for npm trusted publishing + provenance
      id-token: write
    with:
      release_tag: ${{ github.ref_name }}
    # No secrets: inherit — publishing is OIDC-only (id-token), and the
    # reusable workflow's GITHUB_TOKEN for release-asset download is provided
    # automatically. Avoids exposing all org/repo secrets to the call.

  docker-publish:
    name: Publish Docker Images to GHCR
    needs: [classify-tag, pypi-upload]
    # yamllint disable-line rule:line-length
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/docker-build-publish.yml
    permissions:
      # read: checkout for Docker build context
      contents: read
      # write: push images to ghcr.io
      packages: write
      # write: OIDC for container image signing / provenance
      id-token: write
      # write: publish image attestations
      attestations: write
      # write: upload container scan results to Security tab
      security-events: write
