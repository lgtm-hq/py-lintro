# SPDX-License-Identifier: MIT
# For license details, see the repository root LICENSE file.
---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.1+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
      - '*.*.*a*'
      - v*.*.*a*
      - '*.*.*b*'
      - v*.*.*b*
      - '*.*.*rc*'
      - v*.*.*rc*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-tag:
    name: Classify release tag
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions:
      # read: sparse checkout of scripts for the classifier
      contents: read
    outputs:
      # true when github.ref_name is a prerelease (alpha/beta/rc or any
      # non-``X.Y.Z`` suffix); false for stable releases including +build
      # metadata. Consumed by Homebrew/npm/Docker gating below.
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout scripts
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/classify-release-tag.py
          sparse-checkout-cone-mode: false
      - name: Classify tag
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/classify-release-tag.py "$TAG_NAME"

  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@97cb6ddb0d00eaaa38c208033020abc85f2ff1d0 # v0.73.2
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      # Block tagged publishes when grype finds high/critical vulns (#1118).
      # Remediation landed in #1126; Dependabot shows no open high alerts.
      fail-on-severity: high
      create-attestation: true
      tooling-ref: '97cb6ddb0d00eaaa38c208033020abc85f2ff1d0' # v0.73.2
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: SBOM generation, vuln scan and attestation only read the repo.
      # The contents:write release-asset upload moved out to
      # reusable-sbom-release-upload.yml upstream (lgtm-ci#770), so every job
      # in reusable-sbom.yml now declares contents: read.
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@97cb6ddb0d00eaaa38c208033020abc85f2ff1d0 # v0.73.2
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
      # write: since lgtm-ci v0.70.0 the build job attests dist/* (OIDC signing
      # and attestation upload) and requests both statically, so the caller
      # must grant them or the reusable call startup-fails (#2484 class).
      id-token: write
      attestations: write
    with:
      python-version: '3.14'
      artifact-name: python-dist
      # Policy recovery window (lgtm-hq/lgtm-ci#962): the reusable defaults
      # to 90 already; pinned so a default change upstream cannot shorten it.
      artifact-retention-days: 90
      tooling-ref: '97cb6ddb0d00eaaa38c208033020abc85f2ff1d0' # v0.73.2
      egress-policy: block
      egress-preset: pypi
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the pypi preset baseline AND the hosts
      # the reusable's own default list would have carried. Since lgtm-ci
      # v0.70.0 the build job attests dist/*: the attest step fetches the
      # OIDC token from token.actions.githubusercontent.com and signs through
      # Sigstore (Fulcio certificate, Rekor entry, TUF root, timestamp). The
      # pypi preset has none of those, so the replace list blocked them and
      # the v0.160.3a3 checkpoint died with ECONNREFUSED to fulcio (#2562).
      # Same hosts as build-binaries.yml's attest allowlist; a wiring test
      # keeps every attesting job on them.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        upload.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443
        token.actions.githubusercontent.com:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        timestamp.sigstore.dev:443
        oauth2.sigstore.dev:443

  release-gate:
    name: Release gate
    # #2562 PR (c): the last job before any irreversible write. Every build
    # job feeds it; it downloads every artifact, verifies the GitHub
    # attestation of each dist file and binary, checks the dist SHA256SUMS,
    # downloads the Sigstore bundles, assembles the release-assets artifact
    # the GitHub Release attaches, and writes release-manifest.json. Fails
    # closed: nothing downstream runs unless every check passed.
    needs: [classify-tag, sbom, pypi-build, build-binaries, docker-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-24.04
    permissions:
      # read: sparse checkout of the gate scripts
      contents: read
      # read: gh attestation verify/download read the attestations API. With
      # an explicit permissions block an omitted scope is `none`.
      attestations: read
    timeout-minutes: 15
    steps:
      - name: Harden runner
        # Artifact service hops for download/upload-artifact, the GitHub API
        # for the attestations, and the sigstore TUF root gh verifies with.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout scripts
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Download Python distribution
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: gate/dist
      - name: Download macOS binaries
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lintro-macos-*
          merge-multiple: true
          path: gate/binaries
      - name: Download Linux binaries
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lintro-linux-*
          merge-multiple: true
          path: gate/binaries
      - name: Download man page
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-man-page
          path: gate/man
      - name: Verify artifacts and assemble release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_DIR: gate
          OUT_DIR: release-assets
          ATTESTATION_REPO: lgtm-hq/py-lintro
          # A reusable signs as the called file: lgtm-ci's build-dist
          # reusable attests dist/*, and build-binaries.yml (a local
          # reusable) attests the binaries. The entry workflow signs nothing.
          DIST_SIGNER_WORKFLOW: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml
          BINARY_SIGNER_WORKFLOW: lgtm-hq/py-lintro/.github/workflows/build-binaries.yml
        run: scripts/ci/release-gate/verify_artifacts.sh
      - name: Write release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          BASE_DIGEST: ${{ needs.docker-build.outputs.base-digest }}
          FULL_DIGEST: ${{ needs.docker-build.outputs.full-digest }}
          AI_DIGEST: ${{ needs.docker-build.outputs.ai-digest }}
          ASSETS_DIR: release-assets
          OUTPUT: release-manifest.json
        run: python3 scripts/ci/release-gate/write_manifest.py
      - name: Upload release assets
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          # Policy recovery window (lgtm-hq/lgtm-ci#962): a publish rerun
          # weeks later still finds the verified bytes.
          retention-days: 90
      - name: Upload release manifest
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  pypi-upload:
    name: Upload to PyPI
    # The first irreversible write of the run, and the last step of this
    # job (#2562): everything upstream was built, verified and attested by
    # release-gate, and prepare-pypi-upload re-verifies dist/* here.
    needs: [release-gate]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # read: prepare-pypi-upload's require-attestation verifies dist/*
      attestations: read
      # write: OIDC JWT for PyPI trusted publishing (this workflow file)
      id-token: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@97cb6ddb0d00eaaa38c208033020abc85f2ff1d0 # v0.73.2
        with:
          artifact-name: python-dist
          python-version: '3.14'
          tooling-ref: '97cb6ddb0d00eaaa38c208033020abc85f2ff1d0' # v0.73.2
          require-attestation: 'true'
          # The dist attestation was made inside lgtm-ci's build reusable,
          # which is the signer identity Fulcio recorded.
          signer-workflow: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml
      # Last step on purpose: once this succeeds nothing can be re-run into
      # a different state (#2562). The attest step that used to follow it
      # moved to the build stage, where it is a hard failure.
      - name: Upload to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}

  github-release:
    name: Create GitHub Release
    needs: [pypi-upload]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-github-release.yml@97cb6ddb0d00eaaa38c208033020abc85f2ff1d0 # v0.73.2
    permissions:
      # write: create GitHub Release and upload the gated assets
      contents: write
    with:
      # The gate's assembled artifact: dist files, the three binaries,
      # lintro.1, SHA256SUMS over all of them and the Sigstore bundles.
      artifact-name: release-assets
      artifact-path: release
      # The gate's SHA256SUMS is attached as is; a rerun never overwrites a
      # published asset whose bytes differ (release-security policy, s.4).
      checksums: true
      immutable-assets: true
      generate-release-notes: true
      tooling-ref: '97cb6ddb0d00eaaa38c208033020abc85f2ff1d0' # v0.73.2
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443

  mirror-token:
    name: Check mirror token
    # Secrets are not readable from a job-level ``if``, so the presence of
    # MIRROR_REPO_TOKEN is resolved in a step and re-exported as an output the
    # mirror job can gate on. Until the owner creates the secret the mirror
    # bump is skipped with a warning instead of failing the whole tag run
    # (#2622).
    needs: [github-release]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - name: Probe MIRROR_REPO_TOKEN
        id: probe
        env:
          TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          msg="MIRROR_REPO_TOKEN is not set; lintro-pre-commit mirror bump skipped"
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >>"$GITHUB_OUTPUT"
            echo "MIRROR_REPO_TOKEN is set; mirror bump will run." \
              >>"$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=false" >>"$GITHUB_OUTPUT"
            echo "::warning::${msg}"
            echo "${msg}." >>"$GITHUB_STEP_SUMMARY"
          fi

  mirror-release:
    name: Bump lintro-pre-commit mirror
    # The mirror bump cannot run off `release: published`: this pipeline
    # creates the release with GITHUB_TOKEN and GitHub suppresses workflow
    # events for it, so mirror-release.yml never fired (#2599). Calling it
    # here is the only trigger that sees the automated release train.
    needs: [github-release, mirror-token]
    # yamllint disable-line rule:line-length
    if: ${{ !startsWith(github.ref_name, 'actions-v') && needs.mirror-token.outputs.has_token == 'true' }}
    uses: ./.github/workflows/mirror-release.yml
    permissions:
      # read: sparse checkout of scripts/ci/mirror in this repo. Mirror-side
      # writes use MIRROR_REPO_TOKEN, not this token. A called workflow may
      # not request more than its caller grants, so this must stay a superset
      # of mirror-release.yml's job permissions (#2484, #2563).
      contents: read
    with:
      release_tag: ${{ github.ref_name }}
    # Named secret rather than `secrets: inherit`: the call needs exactly one.
    secrets:
      MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}

  build-binaries:
    name: Build platform binaries
    # #2562: the build half of the former build-binary.yml, now ahead of the
    # pypi gate. Prerelease tags build too (artifacts and attestations only;
    # nothing is published for them), so a prerelease tag can prove the
    # build stage. release-gate verifies what this produced.
    needs: [classify-tag]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      # read: checkout, and the reuse check hashes the published asset. The
      # build half never writes to the release (#2562).
      contents: read
      # read: build-binaries.yml's build jobs list and download this run's
      # own sha256 artifacts (#2440, #2435). A called workflow may not
      # request more than its caller's job grants, so omitting this fails
      # the whole run at startup (v0.152.1+ tags died as startup_failure).
      actions: read
      # write: OIDC signing of the binary build-provenance attestations.
      id-token: write
      # write: upload the binary attestations.
      attestations: write
    with:
      release_tag: ${{ github.ref_name }}
    # No secrets: inherit — the callee only needs GITHUB_TOKEN, which every
    # reusable call receives.

  homebrew-tap:
    name: Publish Homebrew Tap
    # Pings the tap once the release carries the gated assets. The binaries
    # and man page are attached by github-release from the gate's artifact;
    # the dispatch reads the arm64 checksum from the release manifest.
    # Stable releases only.
    needs: [classify-tag, release-gate, github-release]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/publish-binaries.yml
    permissions:
      # read: sparse checkout of scripts and the release-manifest artifact.
      # Formula updates are dispatched to the tap (repository_dispatch), not
      # pushed from here — this token has no write access to the tap, and
      # nothing in the callee writes to this repository or its release.
      contents: read
    with:
      release_tag: ${{ github.ref_name }}
    # Named secret rather than `secrets: inherit`: the call needs exactly one.
    secrets:
      HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}

  npm-publish:
    name: Publish to npm
    # Needs github-release: it attaches the three platform binaries the gate
    # verified, which publish-npm.yml downloads. No longer behind Homebrew
    # (#2562). Stable releases only.
    needs: [classify-tag, github-release]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      # read: checkout and download release assets
      contents: read
      # write: OIDC for npm trusted publishing + provenance
      id-token: write
    with:
      release_tag: ${{ github.ref_name }}
    # No secrets: inherit — publishing is OIDC-only (id-token), and the
    # reusable workflow's GITHUB_TOKEN for release-asset download is provided
    # automatically. Avoids exposing all org/repo secrets to the call.

  docker-build:
    name: Build and attest Docker images (staging)
    # #2562 PR (b): the three release images are built, scanned, attested
    # and cosign-signed before the pypi gate, pushed only under run-scoped
    # staging tags (build-<run_id>[-<slug>] and sha-<short>). Staging tags
    # are not a release channel: no version or latest tag is written here.
    # Prerelease tags build too; only docker-promote is stable-only. Gated
    # on ref_type so a workflow_dispatch from a branch never builds or
    # attests non-release bytes.
    needs: [classify-tag]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    uses: ./.github/workflows/docker-build-publish.yml
    permissions:
      # A called workflow may not request more than its caller's job grants
      # (#2484): this is the superset of docker-build-publish.yml's jobs.
      # read: checkout for Docker build context
      contents: read
      # write: push staging images to ghcr.io
      packages: write
      # write: OIDC for cosign signing and the GitHub attestation
      id-token: write
      # write: publish image attestations
      attestations: write
      # write: upload container scan results to Security tab
      security-events: write
    with:
      staging: true

  docker-promote:
    name: Promote Docker images to release tags
    # Promotion is a registry-side retag of the digests built and attested
    # before the gate; nothing is rebuilt after approval (#1358, #2562). The
    # GitHub attestation and the lgtm-ci cosign signature are digest-bound
    # and carry over; this job verifies the attestation on every staging
    # digest, adds its own signature to those digests, and retags last.
    needs: [classify-tag, docker-build, release-gate, github-release]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      # read: checkout
      contents: read
      # read: gh attestation verify reads the attestations API. With an
      # explicit permissions block an omitted scope is `none`, so without
      # this the verification is unauthorized.
      attestations: read
      # write: retag the promoted digests in GHCR
      packages: write
      # write: OIDC for cosign keyless signing of the promoted digests
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # No build here: the allowlist covers checkout, GHCR retagging, the
        # cosign download, sigstore keyless signing and the attestation
        # verification (TUF root + GitHub API).
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker (Buildx + login)
        # Default `docker` driver: imagetools talks to the registry from the
        # CLI, no BuildKit container needed.
        uses: ./.github/actions/setup-docker
        with:
          login: 'true'
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (base)
        id: meta-base
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro-base
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      - name: Extract metadata (full)
        id: meta-full
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      - name: Extract metadata (ai)
        id: meta-ai
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro-ai
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      # Verify BEFORE any retag: attestations are digest-bound, so proving
      # the staging digests is proving the promoted ones, and a missing
      # attestation fails the job while the version tags are still unmoved.
      - name: Verify attestations on the staging digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_REPO: lgtm-hq/py-lintro
          # The nested lgtm-ci reusable made the attestation, so the signer
          # is lgtm-ci as a whole (docs/docker.md).
          SIGNER_REPO: lgtm-hq/lgtm-ci
          IMAGES: |
            ghcr.io/lgtm-hq/py-lintro-base@${{ needs.docker-build.outputs.base-digest }}
            ghcr.io/lgtm-hq/py-lintro@${{ needs.docker-build.outputs.full-digest }}
            ghcr.io/lgtm-hq/py-lintro-ai@${{ needs.docker-build.outputs.ai-digest }}
        run: scripts/ci/verify-image-attestations.sh
      # Sign BEFORE any retag (Codex on #2659): a cosign signature is bound
      # to the digest, so signing the staging digest signs every tag it will
      # carry, and a signing failure leaves the version tags unmoved rather
      # than a partially promoted, unsigned release.
      - name: Install Cosign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign staging digests (keyless)
        env:
          IMAGES: |
            ghcr.io/lgtm-hq/py-lintro-base@${{ needs.docker-build.outputs.base-digest }}
            ghcr.io/lgtm-hq/py-lintro@${{ needs.docker-build.outputs.full-digest }}
            ghcr.io/lgtm-hq/py-lintro-ai@${{ needs.docker-build.outputs.ai-digest }}
        run: scripts/ci/cosign-sign-images.sh
      # The retags are the job's irreversible writes and its last steps:
      # nothing may follow them. EXPECTED_DIGEST pins each promotion to the
      # digest verified and signed above, so the version tags can only ever
      # land on the attested bytes.
      - name: Promote base image (digest retag)
        id: promote-base
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro-base
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.base-digest }}
          TAGS: ${{ steps.meta-base.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh
      - name: Promote full image (digest retag)
        id: promote-full
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.full-digest }}
          TAGS: ${{ steps.meta-full.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh
      - name: Promote ai image (digest retag)
        id: promote-ai
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro-ai
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.ai-digest }}
          TAGS: ${{ steps.meta-ai.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh

  notify-failure:
    name: Report release failure
    # #2562 PR (d): one deduplicated issue per failed tag run, with the
    # per-channel table a human needs to pick a recovery tier. Runs after
    # every publish job unless the run was cancelled (a human stop is not an
    # incident); a green run closes the tag's
    # issue if one exists. Skipped channels (prereleases, no mirror token)
    # count as success. classify-tag and release-gate are listed so a gate
    # failure shows up as the reason nothing published. Gated on ref_type so
    # a branch dispatch never files an issue keyed to a branch name. Must
    # stay the last job in this file.
    needs:
      - classify-tag
      - release-gate
      - pypi-upload
      - github-release
      - mirror-token
      - mirror-release
      - homebrew-tap
      - npm-publish
      - docker-promote
    if: >-
      !cancelled() &&
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-failure-notifier.yml@0fec207d579bcf9961df170ef982da6d268c3fd1 # v0.73.1
    permissions:
      # read: failed-job logs for the infra-signature classifier
      actions: read
      # read: lgtm-ci tooling checkout
      contents: read
      # write: file, update and close the deduplicated failure issue
      issues: write
    with:
      workflow-key: publish-pypi-on-tag
      tag: ${{ github.ref_name }}
      channels: ${{ toJson(needs) }}
      # Must equal auto-rerun-on-infra-failure.yml's max-reruns: that
      # workflow watches "Publish - PyPI Production", so an attempt within
      # budget whose failure matches an infra signature stays quiet and the
      # rerun gets its chance (a wiring test pins the two). Bare number: the
      # reusable types this input as number.
      max-reruns: 3
      # Same extra signatures as the auto-rerun call so the two classifiers
      # cannot disagree (pinned by the same wiring test).
      signatures: |-
        fetching ambient OIDC credentials
        retrieving ID token
        reading ID token
        Get "https://registry-1.docker.io/v2/": context deadline exceeded
        No lint verdict (runner loss); auto-rerun will retry
      tooling-ref: '0fec207d579bcf9961df170ef982da6d268c3fd1' # v0.73.1
      # The reusable hardens its own runner first and resolves the
      # github-minimal allowlist itself; the caller passes no endpoints.
      egress-policy: block
