# SPDX-License-Identifier: MIT
# For license details, see the repository root LICENSE file.
---
name: Publish - PyPI Production
# Publishes package to PyPI when version tags are pushed.
# Lint gate: docker-ci on main/PR (no duplicate quality on tag).
# Layout: lgtm-ci docs/python-release-publish.md (requires lgtm-ci v0.45.1+)

'on':
  push:
    tags:
      - '*.*.*'
      - v*.*.*
      - '*.*.*a*'
      - v*.*.*a*
      - '*.*.*b*'
      - v*.*.*b*
      - '*.*.*rc*'
      - v*.*.*rc*
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-tag:
    name: Classify release tag
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions:
      # read: sparse checkout of scripts for the classifier
      contents: read
    outputs:
      # true when github.ref_name is a prerelease (alpha/beta/rc or any
      # non-``X.Y.Z`` suffix); false for stable releases including +build
      # metadata. Consumed by Homebrew/npm/Docker gating below.
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - name: Checkout scripts
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/classify-release-tag.py
          sparse-checkout-cone-mode: false
      - name: Classify tag
        id: classify
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/classify-release-tag.py "$TAG_NAME"

  sbom:
    name: Generate and verify SBOM
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@19531b4aa3e8de8404a7fb6f3b5692c810acef39 # v0.72.0
    with:
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      # Block tagged publishes when grype finds high/critical vulns (#1118).
      # Remediation landed in #1126; Dependabot shows no open high alerts.
      fail-on-severity: high
      create-attestation: true
      tooling-ref: '19531b4aa3e8de8404a7fb6f3b5692c810acef39' # v0.72.0
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: SBOM generation, vuln scan and attestation only read the repo.
      # The contents:write release-asset upload moved out to
      # reusable-sbom-release-upload.yml upstream (lgtm-ci#770), so every job
      # in reusable-sbom.yml now declares contents: read.
      contents: read
      # write: upload vulnerability findings to GitHub Security tab
      security-events: write
      # write: OIDC for SBOM attestation signing
      id-token: write
      # write: publish SBOM / build attestations
      attestations: write

  pypi-build:
    name: Build Python distribution
    needs: [sbom]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-python-dist.yml@19531b4aa3e8de8404a7fb6f3b5692c810acef39 # v0.72.0
    permissions:
      # read: checkout and build sdist/wheel (reusable-build-python-dist)
      contents: read
      # write: since lgtm-ci v0.70.0 the build job attests dist/* (OIDC signing
      # and attestation upload) and requests both statically, so the caller
      # must grant them or the reusable call startup-fails (#2484 class).
      id-token: write
      attestations: write
    with:
      python-version: '3.14'
      artifact-name: python-dist
      tooling-ref: '19531b4aa3e8de8404a7fb6f3b5692c810acef39' # v0.72.0
      egress-policy: block
      egress-preset: pypi
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the pypi preset baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        upload.pypi.org:443
        astral.sh:443
        releases.astral.sh:443
        github-releases.githubusercontent.com:443

  pypi-upload:
    name: Upload to PyPI
    needs: [pypi-build]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # read: download python-dist workflow artifact
      contents: read
      # write: OIDC JWT for PyPI trusted publishing (this workflow file)
      id-token: write
      # write: Sigstore provenance attestation after upload (best-effort)
      attestations: write
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # lgtm-ci workflow-contract.md § PyPI upload (OIDC)
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            upload.pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Prepare PyPI upload
        id: prepare
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/prepare-pypi-upload@19531b4aa3e8de8404a7fb6f3b5692c810acef39 # v0.72.0
        with:
          artifact-name: python-dist
          python-version: '3.14'
          tooling-ref: '19531b4aa3e8de8404a7fb6f3b5692c810acef39' # v0.72.0
      - name: Upload to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: ${{ steps.prepare.outputs.dist-path }}
      - name: Attest build provenance
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare.outputs.dist-path }}/*

  github-release:
    name: Create GitHub Release
    needs: [pypi-upload]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-github-release.yml@19531b4aa3e8de8404a7fb6f3b5692c810acef39 # v0.72.0
    permissions:
      # write: create GitHub Release and upload dist assets
      contents: write
    with:
      artifact-name: python-dist
      generate-release-notes: true
      tooling-ref: '19531b4aa3e8de8404a7fb6f3b5692c810acef39' # v0.72.0
      egress-policy: block
      egress-preset: github-tooling
      # Full list (v0.50.0+ replace semantics): the reusable passes
      # allowed-endpoints verbatim to step-security/harden-runner, so a
      # non-empty value must include the github-tooling baseline.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443

  mirror-token:
    name: Check mirror token
    # Secrets are not readable from a job-level ``if``, so the presence of
    # MIRROR_REPO_TOKEN is resolved in a step and re-exported as an output the
    # mirror job can gate on. Until the owner creates the secret the mirror
    # bump is skipped with a warning instead of failing the whole tag run
    # (#2622).
    needs: [github-release]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - name: Probe MIRROR_REPO_TOKEN
        id: probe
        env:
          TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          msg="MIRROR_REPO_TOKEN is not set; lintro-pre-commit mirror bump skipped"
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >>"$GITHUB_OUTPUT"
            echo "MIRROR_REPO_TOKEN is set; mirror bump will run." \
              >>"$GITHUB_STEP_SUMMARY"
          else
            echo "has_token=false" >>"$GITHUB_OUTPUT"
            echo "::warning::${msg}"
            echo "${msg}." >>"$GITHUB_STEP_SUMMARY"
          fi

  mirror-release:
    name: Bump lintro-pre-commit mirror
    # The mirror bump cannot run off `release: published`: this pipeline
    # creates the release with GITHUB_TOKEN and GitHub suppresses workflow
    # events for it, so mirror-release.yml never fired (#2599). Calling it
    # here is the only trigger that sees the automated release train.
    needs: [github-release, mirror-token]
    # yamllint disable-line rule:line-length
    if: ${{ !startsWith(github.ref_name, 'actions-v') && needs.mirror-token.outputs.has_token == 'true' }}
    uses: ./.github/workflows/mirror-release.yml
    permissions:
      # read: sparse checkout of scripts/ci/mirror in this repo. Mirror-side
      # writes use MIRROR_REPO_TOKEN, not this token. A called workflow may
      # not request more than its caller grants, so this must stay a superset
      # of mirror-release.yml's job permissions (#2484, #2563).
      contents: read
    with:
      release_tag: ${{ github.ref_name }}
    # Named secret rather than `secrets: inherit`: the call needs exactly one.
    secrets:
      MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}

  build-binaries:
    name: Build platform binaries
    # #2562 PR (a): the build half of the former build-binary.yml, called
    # from the same position the whole workflow used to occupy. Prerelease
    # tags build too (artifacts and attestations only; nothing is published
    # for them), so a prerelease tag can prove the build stage. Moving this
    # ahead of the PyPI gate is a later PR of #2562.
    needs: [classify-tag, pypi-upload, github-release]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      # read: checkout, and the reuse check hashes the published asset. The
      # build half never writes to the release (#2562).
      contents: read
      # read: build-binaries.yml's build jobs list and download this run's
      # own sha256 artifacts (#2440, #2435). A called workflow may not
      # request more than its caller's job grants, so omitting this fails
      # the whole run at startup (v0.152.1+ tags died as startup_failure).
      actions: read
      # write: OIDC signing of the binary build-provenance attestations.
      id-token: write
      # write: upload the binary attestations.
      attestations: write
    with:
      release_tag: ${{ github.ref_name }}
    # No secrets: inherit — the callee only needs GITHUB_TOKEN, which every
    # reusable call receives.

  homebrew-tap:
    name: Publish Homebrew Tap
    # The publish half: attaches this run's built and attested binaries and
    # man page to the release, then pings the tap. Stable releases only.
    needs: [classify-tag, pypi-upload, github-release, build-binaries]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/publish-binaries.yml
    permissions:
      # write: upload macOS/Linux binaries to the GitHub release. Formula
      # updates are dispatched to the tap (repository_dispatch), not pushed
      # from here — this token has no write access to lgtm-hq/homebrew-tap.
      contents: write
      # read: publish-binaries.yml's upload jobs list and download this run's
      # own sha256 artifacts for the reuse check (#2440, #2435). A called
      # workflow may not request more than its caller's job grants, so
      # omitting this fails the whole run at startup (v0.152.1+ tags died as
      # startup_failure).
      actions: read
    with:
      release_tag: ${{ github.ref_name }}
    # Named secret rather than `secrets: inherit`: the call needs exactly one.
    secrets:
      HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}

  npm-publish:
    name: Publish to npm
    # Needs homebrew-tap: that job (publish-binaries.yml) uploads the three
    # platform binaries to the GitHub release, which publish-npm.yml
    # downloads. Gated to stable releases only, since the binaries are not
    # published for prereleases.
    needs: [classify-tag, homebrew-tap]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      # read: checkout and download release assets
      contents: read
      # write: OIDC for npm trusted publishing + provenance
      id-token: write
    with:
      release_tag: ${{ github.ref_name }}
    # No secrets: inherit — publishing is OIDC-only (id-token), and the
    # reusable workflow's GITHUB_TOKEN for release-asset download is provided
    # automatically. Avoids exposing all org/repo secrets to the call.

  docker-build:
    name: Build and attest Docker images (staging)
    # #2562 PR (b): the three release images are built, scanned, attested
    # and cosign-signed before the pypi gate, pushed only under run-scoped
    # staging tags (build-<run_id>[-<slug>] and sha-<short>). Staging tags
    # are not a release channel: no version or latest tag is written here.
    # Prerelease tags build too; only docker-promote is stable-only. Gated
    # on ref_type so a workflow_dispatch from a branch never builds or
    # attests non-release bytes.
    needs: [classify-tag]
    if: >-
      github.ref_type == 'tag' &&
      !startsWith(github.ref_name, 'actions-v')
    uses: ./.github/workflows/docker-build-publish.yml
    permissions:
      # A called workflow may not request more than its caller's job grants
      # (#2484): this is the superset of docker-build-publish.yml's jobs.
      # read: checkout for Docker build context
      contents: read
      # write: push staging images to ghcr.io
      packages: write
      # write: OIDC for cosign signing and the GitHub attestation
      id-token: write
      # write: publish image attestations
      attestations: write
      # write: upload container scan results to Security tab
      security-events: write
    with:
      staging: true

  docker-manifest:
    name: Record image digests
    # The three index digests the staging build exported, written to the
    # release-manifest artifact for the promote job, a publish rerun and the
    # recovery window (#2562; PR (c)'s release gate extends this file).
    needs: [docker-build]
    if: ${{ !startsWith(github.ref_name, 'actions-v') }}
    runs-on: ubuntu-latest
    permissions:
      # read: sparse checkout of the manifest writer
      contents: read
    timeout-minutes: 5
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Checkout scripts
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/write-release-manifest.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Write release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          BASE_DIGEST: ${{ needs.docker-build.outputs.base-digest }}
          FULL_DIGEST: ${{ needs.docker-build.outputs.full-digest }}
          AI_DIGEST: ${{ needs.docker-build.outputs.ai-digest }}
          OUTPUT: release-manifest.json
        run: python3 scripts/ci/write-release-manifest.py
      - name: Upload release manifest
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          # Policy recovery window (lgtm-hq/lgtm-ci#962): a publish rerun
          # must still find the digests it has to promote.
          retention-days: 90

  docker-promote:
    name: Promote Docker images to release tags
    # Promotion is a registry-side retag of the digests built and attested
    # before the gate; nothing is rebuilt after approval (#1358, #2562). The
    # GitHub attestation and the lgtm-ci cosign signature are digest-bound
    # and carry over; this job adds its own signature and verifies the
    # attestation on every promoted digest before the job goes green.
    needs: [classify-tag, docker-build, github-release]
    if: >-
      !startsWith(github.ref_name, 'actions-v') &&
      needs.classify-tag.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04
    permissions:
      # read: checkout; gh attestation verify reads the attestations API
      contents: read
      # write: retag the promoted digests in GHCR
      packages: write
      # write: OIDC for cosign keyless signing of the promoted digests
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # No build here: the allowlist covers checkout, GHCR retagging, the
        # cosign download, sigstore keyless signing and the attestation
        # verification (TUF root + GitHub API).
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            oauth2.sigstore.dev:443
      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Docker (Buildx + login)
        # Default `docker` driver: imagetools talks to the registry from the
        # CLI, no BuildKit container needed.
        uses: ./.github/actions/setup-docker
        with:
          login: 'true'
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (base)
        id: meta-base
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro-base
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      - name: Extract metadata (full)
        id: meta-full
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      - name: Extract metadata (ai)
        id: meta-ai
        # yamllint disable-line rule:line-length
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/lgtm-hq/py-lintro-ai
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
      # EXPECTED_DIGEST pins each promotion to the digest the staging build
      # exported: the version tags can only ever land on the attested bytes.
      - name: Promote base image (digest retag)
        id: promote-base
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro-base
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.base-digest }}
          TAGS: ${{ steps.meta-base.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh
      - name: Promote full image (digest retag)
        id: promote-full
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.full-digest }}
          TAGS: ${{ steps.meta-full.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh
      - name: Promote ai image (digest retag)
        id: promote-ai
        env:
          SOURCE_IMAGE: ghcr.io/lgtm-hq/py-lintro-ai
          CI_TAG: build-${{ github.run_id }}
          EXPECTED_DIGEST: ${{ needs.docker-build.outputs.ai-digest }}
          TAGS: ${{ steps.meta-ai.outputs.tags }}
        run: scripts/ci/promote-ci-docker-images.sh
      - name: Install Cosign
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign promoted digests (keyless)
        env:
          IMAGES: |
            ghcr.io/lgtm-hq/py-lintro-base@${{ steps.promote-base.outputs.digest }}
            ghcr.io/lgtm-hq/py-lintro@${{ steps.promote-full.outputs.digest }}
            ghcr.io/lgtm-hq/py-lintro-ai@${{ steps.promote-ai.outputs.digest }}
        run: scripts/ci/cosign-sign-images.sh
      - name: Verify attestations on the promoted digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION_REPO: lgtm-hq/py-lintro
          # The nested lgtm-ci reusable made the attestation, so the signer
          # is lgtm-ci as a whole (docs/docker.md).
          SIGNER_REPO: lgtm-hq/lgtm-ci
          IMAGES: |
            ghcr.io/lgtm-hq/py-lintro-base@${{ steps.promote-base.outputs.digest }}
            ghcr.io/lgtm-hq/py-lintro@${{ steps.promote-full.outputs.digest }}
