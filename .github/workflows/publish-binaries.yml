---
name: Publish - Homebrew Tap
# Publish stage of the binary release (#2562): attaches the binaries and the
# man page that build-binaries.yml built, verified and attested in this same
# run to the GitHub release, then pings the Homebrew tap. Nothing is compiled
# here. workflow_call only: the manual repair dispatch that resolved "latest
# release" (#2484) is gone, and recovery is lgtm-hq/lgtm-ci#966.

'on':
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to publish'
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DISPATCH_TOKEN:
        description: >-
          Token that can fire repository_dispatch on lgtm-hq/homebrew-tap.
          The only secret this workflow uses besides GITHUB_TOKEN.
        required: true

permissions: {}

jobs:
  get-release-info:
    name: Get Release Info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.get-tag.outputs.tag }}
      is_prerelease: ${{ steps.get-tag.outputs.is_prerelease }}

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          # Sparse checkout plus the gh CLI's API endpoint (unreached on the
          # workflow_call path, see below, but the script is given GH_TOKEN).
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # WORKFLOW_CALL_RELEASE_TAG is always set here (the input is required
      # and workflow_call is the only trigger), so the script's latest-release
      # fallback is unreachable from this workflow.
      - name: Get release tag
        id: get-tag
        run: scripts/ci/homebrew/get-release-info.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_CALL_RELEASE_TAG: ${{ inputs.release_tag }}

  upload-binaries:
    name: Upload ${{ matrix.asset }} to release
    needs: get-release-info
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # write: attach the binary to the GitHub release (upload-then-swap) and
      # finish an interrupted swap the reuse check finds.
      contents: write
      # #2435: the reuse check lists and downloads this run's own sha256
      # artifact (including earlier attempts) to decide whether the asset on
      # the release is one this run already verified.
      actions: read
    strategy:
      fail-fast: false
      # One leg per release asset. The artifact and checksum names are the
      # ones build-binaries.yml uploads; a rename there must land here too.
      matrix:
        include:
          - asset: lintro-macos-arm64
            checksum: sha256-arm64
          - asset: lintro-linux-x64
            checksum: sha256-linux-x64
          - asset: lintro-linux-arm64
            checksum: sha256-linux-arm64

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.asset }}
          path: dist/nuitka/

      # #2435: the same reuse check the build jobs run, on the publish side.
      # When the release already carries this asset with the SHA256 this run's
      # own sha256 artifact recorded, the upload is skipped; an `<asset>.new`
      # left by an interrupted swap is promoted here (contents: write) instead
      # of re-uploaded. The reused copy lands in a scratch path so the
      # downloaded artifact is never overwritten.
      - name: Check for reusable release asset
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          ASSET_NAME: ${{ matrix.asset }}
          CHECKSUM_ARTIFACT: ${{ matrix.checksum }}
        run: >-
          scripts/build/reuse_release_asset.sh
          "$RELEASE_TAG"
          "$ASSET_NAME"
          "$CHECKSUM_ARTIFACT"
          "reused/$ASSET_NAME"

      - name: Upload to release
        # #2435: upload-then-swap instead of a delete-first overwrite, which
        # loses the binary when the runner dies mid-upload. Skipped entirely
        # when the asset being uploaded is the one already on the release.
        if: >-
          needs.get-release-info.outputs.release_tag != '' &&
          steps.reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get-release-info.outputs.release_tag }}
          ASSET_NAME: ${{ matrix.asset }}
        run: >-
          scripts/build/upload_release_asset.sh
          "$RELEASE_TAG"
          "dist/nuitka/$ASSET_NAME"

  upload-man-page:
    name: Upload Man Page
    needs: get-release-info
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Required by softprops/action-gh-release to upload dist/lintro.1.
      contents: write

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Download man page artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lintro-man-page
          path: dist/

      - name: Upload to release
        # The man page is regenerated cheaply, so the #2435 upload-then-swap
        # was not extended to it.
        if: needs.get-release-info.outputs.release_tag != ''
        # yamllint disable-line rule:line-length
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.get-release-info.outputs.release_tag }}
          files: dist/lintro.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-dispatch:
    name: Notify Homebrew Tap
    needs: [get-release-info, upload-binaries, upload-man-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Stable tag releases only. The tap's formulas/lintro.yml declares a
    # binary formula for Apple silicon, so the dispatch must carry the arm64
    # checksum: a failed binary build or upload blocks the formula update
    # (re-run the failed jobs to recover) instead of shipping a partial bump.
    # Intel Macs are served from PyPI by the formula's own `on_intel` branch
    # (#2579), so no second checksum travels with the dispatch.
    if: >-
      needs.get-release-info.outputs.release_tag != '' &&
      needs.get-release-info.outputs.is_prerelease == 'false'

    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          # pipelines/results-receiver: actions/download-artifact reaches the
          # artifact service through them under block mode.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            pypi.org:443

      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download SHA256 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sha256-arm64
          path: checksums/

      - name: Read checksum
        id: checksums
        run: |
          ARM64_SHA=$(cat checksums/sha256-arm64.txt)
          echo "arm64_sha256=$ARM64_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ needs.get-release-info.outputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI availability
        # The tap generates lintro-full from live PyPI metadata as soon as
        # the dispatch lands, so the sdist must be visible first.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/ci/homebrew/wait-for-pypi.sh lintro "$VERSION"

      - name: Dispatch formula update
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/trigger-homebrew-update@6c08ef91318466d03c615112820eae9b795a9a8b # v0.71.0
        with:
          formula: lintro
          version: ${{ steps.version.outputs.version }}
          pypi-package: lintro
          binary-arm64-sha: ${{ steps.checksums.outputs.arm64_sha256 }}
          token: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
