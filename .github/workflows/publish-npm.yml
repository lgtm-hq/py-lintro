---
name: Publish - npm

# Distributes lintro as an npm package via platform-specific Nuitka binaries
# (the esbuild/biome model). Publishing uses npm trusted publishing (OIDC):
# no NODE_AUTH_TOKEN secret is required.
#
# Two jobs (#2632):
#
#   stage    Downloads the three release binaries plus the release's
#            SHA256SUMS, verifies each binary's digest and its
#            build-binaries.yml attestation, stages them into the npm tree,
#            injects the version, smoke-tests the launcher, writes a
#            SHA256SUMS over every file npm would pack, attests that set and
#            uploads it as the `npm-dist` artifact. No environment: nothing
#            here is irreversible.
#   publish  lgtm-ci's reusable-publish-npm-set.yml: re-verifies every packed
#            file against the manifest and the stage job's attestation
#            BEFORE npm pack, publishes platform packages first and the meta
#            package last (idempotent re-runs, bounded transient retry), then
#            verifies the registry (dist.attestations per package, npm audit
#            signatures, launcher smoke). Bound to the `npm` environment
#            through the reusable's `environment` input (lgtm-ci 0.74.0,
#            lgtm-hq/lgtm-ci#990): every live publish waits for maintainer
#            approval on the job that mints the OIDC token, mirroring the
#            `pypi` environment, and the npm trusted publisher stays
#            registered against the `npm` environment name.
#
# npm trusted publishing matches the ENTRY workflow of the run — the tag
# pipeline (publish-pypi-on-tag.yml), not this file. The reusable's entry
# guard enforces that binding on live runs; a `workflow_dispatch` of this
# workflow is a dry-run by default and cannot publish. See #2247 and
# docs/npm-distribution.md.

'on':
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag whose binaries to package'
        required: true
        type: string
      dry_run:
        description: 'Run npm publish with --dry-run instead of publishing'
        required: false
        default: false
        type: boolean
      dist_tag:
        description: >-
          npm dist-tag for the publish (default latest). Use a non-latest tag
          such as backfill when publishing a version older than current latest.
        required: false
        default: latest
        type: string
      release_fault:
        description: >-
          Fault to inject (#2633, docs/release-validation.md): the stage job's
          `fail-publish-npm` step exits 1 iff this equals its name. A called
          workflow cannot read vars.*, so the tag pipeline passes
          classify-tag's release_fault output through. Empty (the default)
          injects nothing.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag whose binaries to package'
        required: true
        type: string
      dry_run:
        description: 'Run npm publish with --dry-run instead of publishing'
        required: false
        default: true
        type: boolean
      dist_tag:
        description: >-
          npm dist-tag (default latest). Use backfill for versions older than
          current latest so npm does not refuse to move the latest tag.
        required: false
        default: latest
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.inputs.release_tag || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  stage:
    name: Verify and stage npm package set
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # read: checkout and download release assets
      contents: read
      # write: OIDC signing of the staged package-set attestation
      id-token: write
      # write: upload that attestation; read half covers gh attestation
      # verify of the release binaries
      attestations: write

    steps:
      - name: Harden Runner
        # gh release download (api + release-assets), gh attestation verify
        # (api + Sigstore TUF root), setup-node, the pre-publish smoke's npm
        # install, attest-build-provenance (OIDC token + Sigstore) and the
        # artifact upload service.
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            oauth2.sigstore.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inject fault (fail-publish-npm)
        # #2633 S3: the publish-stage fault. First step after the checkout
        # that provides the script, before any binary is downloaded, so a
        # fired fault leaves npm untouched while PyPI, the GitHub Release and
        # the Docker promote (all upstream or parallel) complete, which is
        # exactly the partial release the notifier and the recovery workflow
        # exist for. Unconditional: the script is the condition, exiting 1
        # only when the input equals this step's name and logging "nothing
        # injected" otherwise.
        id: fail-publish-npm
        env:
          RELEASE_FAULT: ${{ inputs.release_fault }}
        run: scripts/ci/release-fault.sh fail-publish-npm

      - name: Set up Node.js
        # Node 24 ships npm ≥ 11.5.1. Do not run `npm install -g npm` here:
        # in-place self-upgrade corrupts the toolcache tree (#1203).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Download release binaries and SHA256SUMS
        run: >-
          scripts/ci/npm/download_release_binaries.sh
          "$RELEASE_TAG"
          "${{ runner.temp }}/npm-binaries"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Verify release binaries (digest + attestation)
        # The first consumer of the #2562 evidence: each binary must match
        # the release's SHA256SUMS and carry a build-binaries.yml attestation
        # (a reusable signs as the called file, never as the entry workflow).
        # A replaced release asset (#2484 class) fails here, before staging.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_DIR: ${{ runner.temp }}/npm-binaries
          ATTESTATION_REPO: lgtm-hq/py-lintro
          BINARY_SIGNER_WORKFLOW: lgtm-hq/py-lintro/.github/workflows/build-binaries.yml
        run: scripts/ci/npm/verify_release_binaries.sh

      - name: Stage binaries into npm packages
        run: >-
          python scripts/ci/npm/stage_binaries.py
          --artifacts-dir "${{ runner.temp }}/npm-binaries"

      - name: Inject release version into manifests
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python scripts/ci/npm/sync_npm_version.py
          --version "$RELEASE_TAG"

      - name: Verify manifests are in sync
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python scripts/ci/npm/sync_npm_version.py
          --check --version "$RELEASE_TAG"

      - name: Write package-set checksums
        # One `<sha256>  <package>/<file>` line per file npm would pack, for
        # all four packages: the manifest the reusable verifies against and
        # the subject list of the attestation below.
        run: >-
          python scripts/ci/npm/write_package_checksums.py
          --packages-dir npm
          --output npm/SHA256SUMS

      - name: Attest staged package set
        # Signs as this file (publish-npm.yml); the reusable's verify step
        # requires exactly that signer for every packed file.
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: npm/SHA256SUMS

      - name: Upload staged package set
        # Jobs have isolated filesystems: the reusable downloads this artifact
        # into its packages-dir. The zip drops file modes (every file lands
        # as 644), so the launcher restores the binary's exec bit at run time
        # and smoke_test.sh above proves that path before anything ships.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-dist
          path: npm/
          if-no-files-found: error
          # Policy recovery window (lgtm-hq/lgtm-ci#962): a resume weeks
          # later still finds the verified, attested set.
          retention-days: 90

      - name: Smoke test launcher (Linux x64)
        # Deliberately LAST, after the manifest is attested and the artifact
        # uploaded: this step executes a release binary, and anything that
        # runs as the runner user could rewrite files in this workspace, so
        # nothing it could touch is what gets published (the reusable
        # downloads the immutable artifact). A failed smoke test still fails
        # this job and the publish job never starts (Codex review on #2667).
        run: scripts/ci/npm/smoke_test.sh

  publish:
    name: Publish npm package set
    needs: stage
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-npm-set.yml@2145a9aa0b1c82939be0506763442df6ea36884d # v0.74.2
    permissions:
      # read: checkout of this repository inside the reusable
      contents: read
      # write: OIDC for npm trusted publishing + provenance
      id-token: write
      # write: the reusable's job requests it statically for the tarball
      # provenance upload; the call startup-fails without it (#2484 class)
      attestations: write
    with:
      # The approval gate and the OIDC environment claim live on the publish
      # job itself (see the header); the trusted-publisher registration on
      # npmjs keeps its `npm` environment binding.
      environment: npm
      packages-dir: npm
      artifact-name: npm-dist
      # Platform packages first, meta package last: the meta package's
      # optionalDependencies must exist on the registry before it does.
      order: '["darwin-arm64", "linux-arm64", "linux-x64", "lintro"]'
      # dist_tag must be non-latest when backfilling versions below current
      # latest (npm refuses to move latest backwards without --tag).
      dist-tag: ${{ inputs.dist_tag || 'latest' }}
      dry-run: ${{ inputs.dry_run }}
      provenance: true
      access: public
      max-attempts: 3
      # The one entry workflow npm trusts (#2247): a live run entering
      # through any other file fails here, before anything is packed. A
      # dry-run leaves the allowlist empty so a `workflow_dispatch` of this
      # workflow (dry-run by default) can still rehearse the pipeline.
      entry-workflows: >-
        ${{ !inputs.dry_run && '.github/workflows/publish-pypi-on-tag.yml' || '' }}
      # Workspace-relative path to the manifest that shipped inside the
      # artifact; its entries are relative to packages-dir. The default
      # files-to-verify ("[]") verifies every file the manifest lists, on
      # top of every file npm would pack.
      checksums-file: npm/SHA256SUMS
      signer-repo: lgtm-hq/py-lintro
      # The stage job's attestation over npm/SHA256SUMS (a called workflow
      # signs as its own file). The binaries' build-binaries.yml attestation
      # was checked in stage, before they were staged.
      signer-workflow: .github/workflows/publish-npm.yml
      post-publish-verify: true
      # Runs inside the scratch install of the published meta package.
      smoke-command: ./node_modules/.bin/lintro --version
      node-version: '24'
      tooling-ref: '2145a9aa0b1c82939be0506763442df6ea36884d' # v0.74.2
      egress-policy: block
      egress-preset: npm-publish
      # Full list (replace semantics): the reusable passes allowed-endpoints
      # verbatim to harden-runner, so this must carry everything its own
      # default carried plus the hosts this consumer adds (nodejs.org for
      # setup-node, the artifact download service, the Sigstore timestamp).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        actions.githubusercontent.com:443
        token.actions.githubusercontent.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        results-receiver.actions.githubusercontent.com:443
        *.blob.core.windows.net:443
        nodejs.org:443
        registry.npmjs.org:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        timestamp.sigstore.dev:443
        oauth2.sigstore.dev:443
