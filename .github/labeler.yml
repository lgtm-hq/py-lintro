# Configuration for actions/labeler
# Maps file paths to labels for automatic PR labeling
#
# Note: Several paths intentionally match multiple labels:
#   CHANGELOG.md → documentation + release
#   renovate.json → maintenance + infrastructure
#   pyproject.toml → dependencies + release
#   lintro/__init__.py → enhancement + release
#   .github/workflows/release-*.yml, publish-*.yml, docker-*-publish.yml,
#     and build-binary.yml → ci + release
#   scripts/ci/release-*, scripts/ci/homebrew/**, scripts/ci/npm/**
#     → ci + release
#   scripts/ci/classify-release-tag.py, check-release-version-skew.py,
#     and finalize-version-pr.py → ci + release
#   scripts/ci/testing/** → ci + testing
#   test_samples/**/*.md → testing + documentation
#   npm/**/package.json → release only
#   .github/workflows/*security*.yml, *codeql*.yml → ci + security
#   lintro/tools/{bandit,gitleaks,semgrep}/** → enhancement + security
---
enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - 'lintro/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'scripts/ci/**'
          - 'scripts/docker/**'
          - 'Dockerfile'
          - 'docker-compose.yml'
          - '.dockerignore'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'README.md'
          - 'CHANGELOG.md'
          - '**/*.md'
          - '!.github/**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'uv.lock'
          - 'requirements*.txt'

maintenance:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/utils/**'
          - 'scripts/local/**'
          - '.github/CODEOWNERS'
          - '.github/labeler.yml'
          - 'renovate.json'

security:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/*security*.yml'
          - '.github/workflows/*codeql*.yml'
          - 'lintro/tools/bandit/**'
          - 'lintro/tools/gitleaks/**'
          - 'lintro/tools/semgrep/**'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - 'pytest.ini'
          - 'test_samples/**'
          - 'scripts/ci/testing/**'

release:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/release-*.yml'
          - '.github/workflows/publish-*.yml'
          - '.github/workflows/docker-*-publish.yml'
          - '.github/workflows/build-binary.yml'
          - 'CHANGELOG.md'
          - 'pyproject.toml'
          - 'lintro/__init__.py'
          - 'npm/**/package.json'
          - 'tools/ascii_resizer/pyproject.toml'
          - 'tools/ascii_resizer/__init__.py'
          - 'scripts/ci/release-*'
          - 'scripts/ci/classify-release-tag.py'
          - 'scripts/ci/check-release-version-skew.py'
          - 'scripts/ci/finalize-version-pr.py'
          - 'scripts/ci/homebrew/**'
          - 'scripts/ci/npm/**'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - 'renovate.json'
          - '.allstar/**'
