# Grype configuration for the Dependency Vulnerability Gate
# (.github/workflows/dependency-vuln-gate.yml, lgtm-ci scan-vulnerabilities).
#
# Grype reads this file from the working directory. Mirror ONLY entries that
# are also suppressed in .osv-scanner.toml, where the full rationale and the
# time box (ignoreUntil) live. Grype ignore rules cannot expire on their own,
# so remove an entry here whenever its .osv-scanner.toml counterpart is
# removed or lapses. Exception: rules scoped by location to the lgtm-ci
# tooling checkout (/.lgtm-ci-tooling/**) have no OSV counterpart; their time
# box is _TOOLING_CHECKOUT_EXPIRY in tests/unit/test_vuln_suppression_parity.py.

---
ignore: []
