# Grype configuration for the Dependency Vulnerability Gate
# (.github/workflows/dependency-vuln-gate.yml, lgtm-ci scan-vulnerabilities).
#
# Grype reads this file from the working directory. Mirror ONLY entries that
# are also suppressed in .osv-scanner.toml, where the full rationale and the
# time box (ignoreUntil) live. Grype ignore rules cannot expire on their own,
# so remove an entry here whenever its .osv-scanner.toml counterpart is
# removed or lapses.

---
ignore:
  # http-cache-semantics <= 4.2.0: no patched release; build-time only via
  # astro (remote image cache). Mirrors .osv-scanner.toml, review by 2026-11-02.
  - vulnerability: GHSA-ch52-4w7c-c8xp
    package:
      name: http-cache-semantics
      type: npm
  # braces <= 3.0.3: no patched release; dev/lint tooling glob expansion only.
  # Mirrors .osv-scanner.toml, review by 2026-11-02.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    package:
      name: braces
      type: npm
  # markdown-it 15.0.1: pinned exactly by markdownlint-cli2 0.23.3 (latest);
  # DoS-only quadratic parsing of linted Markdown. Mirrors .osv-scanner.toml,
  # review by 2026-11-03.
  - vulnerability: GHSA-r7fv-28h4-cvq7
    package:
      name: markdown-it
      type: npm
  - vulnerability: GHSA-vfgh-jcmw-g37q
    package:
      name: markdown-it
      type: npm
  - vulnerability: GHSA-gfr2-rv44-r23c
    package:
      name: markdown-it
      type: npm
  # certifi < 2026.10.19 (GHSA-6q48-6c7w-9gw2, critical: emSign roots with
  # compromised intermediates). Scoped by location to the lgtm-ci tooling
  # checkout ONLY: reusable-sbom.yml clones lgtm-ci@v0.75.1 into
  # .lgtm-ci-tooling/ inside the scanned dir, and its uv.lock still pins
  # certifi 2026.7.22. That lock is lgtm-ci's, not lintro's; lintro's own
  # uv.lock and requirements-semgrep.txt already pin 2026.10.19, and this rule
  # does not cover them. No lgtm-ci release carries the fix yet (fixed on
  # lgtm-ci main by lgtm-hq/lgtm-ci#1186, shipping in v0.77.8 via
  # lgtm-hq/lgtm-ci#1187). There is no .osv-scanner.toml counterpart because
  # osv-scanner never sees the tooling checkout. Remove this entry when
  # sbom-on-main.yml moves to an lgtm-ci release with certifi >= 2026.10.19.
  # Re-verified 2026-10-21; review by 2026-11-21.
  - vulnerability: GHSA-6q48-6c7w-9gw2
    package:
      name: certifi
      type: python
      location: '/.lgtm-ci-tooling/**'
