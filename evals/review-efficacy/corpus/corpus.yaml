---
# Review eval corpus (issue #2147), seeded from the #1962 pilot selections.
#
# Each item is a merged historical pull request that `lintro review --pr`
# can re-review. `expected_findings` is optional: only labeled items take
# part in the precision/recall table, and a label is a human adjudication,
# not a competitor bot's comment.
#
# A label carries exactly the three fields that form a finding fingerprint
# (file, category, title), because that is what
# lintro/ai/review/finding_matcher.py hashes. The matcher normalizes a title's
# case, punctuation and whitespace before hashing it -- it does not match
# rewritten wording -- so a label survives line drift and cosmetic title
# differences, not a freely reworded title.
#
# Severity is carried alongside, not hashed: it is what the expected verdict is
# derived from, and it never affects whether a label matches a finding. It is
# required on every label for exactly that reason -- a forgotten P1 must fail
# the loader, not be stored as a quieter default.
#
# Every item is a merged pull request of this repository; each title is the
# merged PR's own title.
version: 1
repo: lgtm-hq/py-lintro

