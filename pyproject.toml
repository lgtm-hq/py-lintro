[build-system]
requires = ["setuptools==84.0.0", "wheel"]
# In-tree PEP 517 shim: generates the derived version artifacts before
# delegating to setuptools.build_meta (#2180). lintro_build never ships
# in the wheel; the sdist carries it via MANIFEST.in.
build-backend = "lintro_build.backend"
backend-path = ["."]

[project]
name = "lintro"
version = "0.147.6"
description = "A unified CLI tool for code formatting, linting, and quality assurance"
keywords = [
  "linting",
  "formatting",
  "code-quality",
  "cli",
  "python",
  "javascript",
  "yaml",
  "docker",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
  # click 8.1.8 is vulnerable to PYSEC-2026-2132 / CVE-2026-7246
  # (GHSA-47fr-3ffg-hgmw, High); fixed in 8.3.3.
  "click>=8.3.3",
  "loguru>=0.7.3",
  "packaging>=25.0",
  "pathspec>=0.12.1",
  "pydantic>=2.12.5",
  "pyyaml>=6.0",
  "rich>=14.2.0",
  "tabulate>=0.9.0",
  "httpx>=0.28.1",
  "defusedxml>=0.7.1",
  "identify>=2.6.19",
  "watchdog>=6.0.0",
]
authors = [{ name = "lgtm-hq", email = "turbocoder13@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
# No `dev`/`test` extras: PEP 735 `[dependency-groups] dev` below is the single
# dev dependency list (#2314). Extras here are runtime-facing only.
typing = ["types-setuptools>=80.9.0.20251223", "types-tabulate>=0.9.0.20241207"]
full = [
  "ruff>=0.15.9",
  "black>=26.3.1",
  "bandit>=1.9.4",
  "import-linter>=2.15",
  "mypy>=1.19.1",
  "pydoclint>=0.8.3",
  "pylint>=4.0.8",
  "yamllint>=1.37.1",
]
ai = ["anthropic>=0.39.0", "openai>=1.50.0"]
# Floor: 2.0 is the first release of the constructor-registered low-level
# `Server` API (`on_list_tools` / `on_call_tool`), explicit `ListToolsResult`,
# and snake_case type fields (`input_schema`, `is_error`).
# Ceiling: 3.x is not yet a supported migration.
mcp = ["mcp>=2,<3"]
# Semgrep is intentionally absent: it ships from the isolated lockfile
# ``requirements-semgrep.txt`` (#2104) so its pins cannot collide with
# lintro's shared resolver. sqlfluff and pip-audit remain here.
tools = ["sqlfluff>=4.0.0", "pip-audit>=2.10.1"]

[project.scripts]
lintro = "lintro.cli:main"

[project.urls]
Homepage = "https://github.com/lgtm-hq/py-lintro"
Documentation = "https://github.com/lgtm-hq/py-lintro/docs"
Source = "https://github.com/lgtm-hq/py-lintro"

[project.entry-points."lintro.plugins"]

[dependency-groups]
# Workspace-only compensation for `[tool.uv] override-dependencies` (#2378).
# The override strips anthropic's `docstring-parser` requirement from every uv
# resolution so it cannot shadow pydoclint's `docstring-parser-fork`, which owns
# the same top-level `docstring_parser` module. In a sync that also has `full`
# the fork arrives via pydoclint, but `uv sync --extra ai` on its own would then
# install neither and `anthropic.lib.tools` would raise ModuleNotFoundError.
# This group puts the fork back for exactly those syncs, and no call site has to
# ask for it: `[tool.uv] default-groups` below lists `ai-runtime` alongside
# `dev`, so a plain `uv sync --extra ai` already carries the fork. `ai-review.yml`
# and `scripts/ci/run-ai-contract-tests.sh` therefore pass no `--group` flag.
#
# It is deliberately NOT on the published `ai` extra: the override is a uv
# workspace setting that pip never reads, so shipping the fork in wheel metadata
# would make `uv pip install 'lintro[ai]'` (README, docs/configuration.md) pull
# two distributions that own `docstring_parser`. lintro itself imports neither.
ai-runtime = ["docstring-parser-fork>=0.0.16"]

dev = [
  "build>=1.4.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "twine>=6.2.0",
  "assertpy>=1.1",
  "pytest-mock>=3.15.1",
  "bandit>=1.9.4",
  "black>=26.3.1",
  "ruff>=0.15.9",
  "yamllint>=1.37.1",
  "pytest-timeout>=2.4.0",
  "pytest-sugar>=1.1.1",
  "mypy>=1.19.1",
  "types-PyYAML>=6.0.12.20250915",
  "types-tabulate>=0.9.0.20241207",
  "types-defusedxml>=0.7.0.20250822",
  "tomlkit>=0.13.3",
  "click-man>=0.5.1",
  # Kept in the default dev group (not just the optional `mcp` extra) so the
  # MCP server tests really execute in CI, which syncs `--extra full` plus the
  # default groups. Without it they would importorskip into a silent pass.
  "mcp>=2,<3",
  "pytest-asyncio>=1.3.0",
  # Randomises test order every run so nothing may depend on declaration
  # order or on state a neighbour left behind (#2315).
  "pytest-randomly>=4.0.1",
]
build = ["nuitka>=2.8.9", "ordered-set>=4.1.0", "zstandard>=0.25.0"]

[tool.setuptools.packages.find]
# Discover every lintro subpackage automatically so adding one never requires
# editing a hand-maintained list (#1225). ``include`` already limits discovery
# to the runtime package; the excludes keep repo-only trees (and the in-tree
# PEP 517 backend, which ``lintro*`` would otherwise match) out of the wheel.
where = ["."]
include = ["lintro*"]
exclude = [
  "apps*",
  "benchmarks*",
  "docs*",
  "evals*",
  "lintro_build*",
  "scripts*",
  "test_samples*",
  "tests*",
  "tools*",
]
# Only real packages ship: directories without ``__init__.py`` (lintro/ascii-art,
# the prompt-template and checklist-corpus data dirs) stay package data.
namespaces = false

[tool.setuptools.package-data]
lintro = ["tools/*.json", "py.typed", "ascii-art/*.txt"]
"lintro.ai.prompts.templates" = ["**/*.md", "**/*.json"]
"lintro.ai.review.checklist" = ["corpus/*.yaml"]

[tool.setuptools.exclude-package-data]
# manifest.src.json is the hand-authored source the generator renders
# manifest.json from (#2178); only the rendered manifest ships in the wheel.
# This filters the ``tools/*.json`` package-data glob; MANIFEST.in carries a
# matching ``exclude`` because setuptools does not apply this filter to
# files pulled in via the sdist manifest (include-package-data path).
lintro = ["tools/manifest.src.json"]

[tool.ruff]
line-length = 88
target-version = "py311"
unsafe-fixes = false
exclude = [
  ".venv",
  "venv",
  "env",
  "build",
  "dist",
  "__pycache__",
  "test_samples",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "COM",
  "N",
  "D",
  "DOC",
  "UP",
  "B",
  "C4",
  "SIM",
  "C90",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "RUF100",
]
ignore = []
preview = true
explicit-preview-rules = true

# Structural thresholds (issue #2291). Ratchet plan: max-complexity 15 -> 12 -> 10.
# Never raise these; the burn-down happens in the per-file baseline below.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "SIM117", "SIM105"]
".lintro/**/*.py" = ["E501"]
"**/__init__.py" = ["D104"]
"test_samples/**/*.py" = ["ALL"]

