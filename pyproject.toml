[build-system]
requires = ["setuptools==84.0.0", "wheel"]
# In-tree PEP 517 shim: generates the derived version artifacts before
# delegating to setuptools.build_meta (#2180). lintro_build never ships
# in the wheel; the sdist carries it via MANIFEST.in.
build-backend = "lintro_build.backend"
backend-path = ["."]

[project]
name = "lintro"
version = "0.143.0"
description = "A unified CLI tool for code formatting, linting, and quality assurance"
keywords = [
  "linting",
  "formatting",
  "code-quality",
  "cli",
  "python",
  "javascript",
  "yaml",
  "docker",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
  # click 8.1.8 is vulnerable to PYSEC-2026-2132 / CVE-2026-7246
  # (GHSA-47fr-3ffg-hgmw, High); fixed in 8.3.3.
  "click>=8.3.3",
  "loguru>=0.7.3",
  "packaging>=25.0",
  "pathspec>=0.12.1",
  "pydantic>=2.12.5",
  "pyyaml>=6.0",
  "rich>=14.2.0",
  "tabulate>=0.9.0",
  "httpx>=0.28.1",
  "defusedxml>=0.7.1",
  "identify>=2.6.19",
  "watchdog>=6.0.0",
]
authors = [{ name = "lgtm-hq", email = "turbocoder13@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "pytest-sugar>=1.1.1",
  "tox>=4.34.1",
  "allure-pytest>=2.15.3",
  "ruff>=0.15.9",
  "mypy>=1.19.1",
  "coverage-badge>=1.1.2",
  "assertpy>=1.1",
  "httpx>=0.28.1",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
  "assertpy>=1.1",
]
typing = ["types-setuptools>=80.9.0.20251223", "types-tabulate>=0.9.0.20241207"]
full = [
  "ruff>=0.15.9",
  "black>=26.3.1",
  "bandit>=1.9.4",
  "mypy>=1.19.1",
  "pydoclint>=0.8.3",
  "yamllint>=1.37.1",
]
ai = ["anthropic>=0.39.0", "openai>=1.50.0"]
# Floor: 2.0 is the first release of the constructor-registered low-level
# `Server` API (`on_list_tools` / `on_call_tool`), explicit `ListToolsResult`,
# and snake_case type fields (`input_schema`, `is_error`).
# Ceiling: 3.x is not yet a supported migration.
mcp = ["mcp>=2,<3"]
# Semgrep is intentionally absent: it ships from the isolated lockfile
# ``requirements-semgrep.txt`` (#2104) so its pins cannot collide with
# lintro's shared resolver. sqlfluff and pip-audit remain here.
tools = ["sqlfluff>=4.0.0", "pip-audit>=2.10.1"]

[project.scripts]
lintro = "lintro.cli:main"

[project.urls]
Homepage = "https://github.com/lgtm-hq/py-lintro"
Documentation = "https://github.com/lgtm-hq/py-lintro/docs"
Source = "https://github.com/lgtm-hq/py-lintro"

[project.entry-points."lintro.plugins"]

[dependency-groups]
dev = [
  "build>=1.4.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "twine>=6.2.0",
  "assertpy>=1.1",
  "pytest-mock>=3.15.1",
  "bandit>=1.9.4",
  "black>=26.3.1",
  "ruff>=0.15.9",
  "yamllint>=1.37.1",
  "pytest-timeout>=2.4.0",
  "mypy>=1.19.1",
  "types-PyYAML>=6.0.12.20250915",
  "types-tabulate>=0.9.0.20241207",
  "types-defusedxml>=0.7.0.20250822",
  "tomlkit>=0.13.3",
  "click-man>=0.5.1",
  # Kept in the default dev group (not just the optional `mcp` extra) so the
  # MCP server tests really execute in CI, which syncs `--extra full` plus the
  # default groups. Without it they would importorskip into a silent pass.
  "mcp>=2,<3",
  "pytest-asyncio>=1.3.0",
]
build = ["nuitka>=2.8.9", "ordered-set>=4.1.0", "zstandard>=0.25.0"]

